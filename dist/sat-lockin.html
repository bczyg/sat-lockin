<script>
/* ============================================================
   SAT PrepMe, test engine
   Digital SAT (Bluebook) structure, as administered 2024-2026:

   Reading and Writing Module 1 27 questions 32 min
   Reading and Writing Module 2 27 questions 32 min <- adaptive
   Break 10 min
   Math Module 1 22 questions 35 min
   Math Module 2 22 questions 35 min <- adaptive

   98 questions total, 2 h 14 min of testing time. Module 2 difficulty is
   chosen from Module 1 performance; the routing decides the score ceiling.
   ============================================================ */
(function (global) {
    'use strict';

    /* ---------------- deterministic RNG (so an attempt can be replayed) ---- */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, rnd) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    /* ---------------- test blueprint -------------------------------------- */
    var BLUEPRINT = {
      rw: {
        label: 'Reading and Writing',
        count: 27,
        seconds: 32 * 60,
        // College Board domain weighting for each RW module
        domains: {
          'Information and Ideas': 7,
          'Craft and Structure': 8,
          'Expression of Ideas': 5,
          'Standard English Conventions': 7
        }
      },
      math: {
        label: 'Math',
        count: 22,
        seconds: 35 * 60,
        domains: {
          'Algebra': 8,
          'Advanced Math': 8,
          'Problem-Solving and Data Analysis': 3,
          'Geometry and Trigonometry': 3
        }
      }
    };

    // difficulty mixes: [easy, medium, hard] proportions
    var MIX = {
      module1: { E: 0.35, M: 0.40, H: 0.25 },
      hard: { E: 0.10, M: 0.35, H: 0.55 },
      easy: { E: 0.55, M: 0.35, H: 0.10 }
    };

    /* ---------------- scaled-score estimation -----------------------------
       Anchor points interpolated linearly. These approximate published
       practice-test curves; the app always labels the result an estimate. */
    var CURVES = {
      rw: {
        hard: [[0, 400], [7, 450], [14, 520], [21, 580], [28, 640], [35, 690], [42, 740], [48, 775], [54, 800]],
        easy: [[0, 200], [7, 260], [14, 330], [21, 390], [28, 450], [35, 500], [42, 545], [48, 575], [54, 600]]
      },
      math: {
        hard: [[0, 420], [5, 470], [10, 530], [15, 590], [20, 640], [26, 700], [32, 750], [38, 780], [44, 800]],
        easy: [[0, 200], [5, 250], [10, 310], [15, 370], [20, 425], [26, 480], [32, 530], [38, 565], [44, 590]]
      }
    };
    function interp(anchors, x) {
      if (x <= anchors[0][0]) return anchors[0][1];
      for (var i = 1; i < anchors.length; i++) {
        if (x <= anchors[i][0]) {
          var a = anchors[i - 1], b = anchors[i];
          var t = (x - a[0]) / (b[0] - a[0]);
          return a[1] + t * (b[1] - a[1]);
        }
      }
      return anchors[anchors.length - 1][1];
    }
    function midCurve(sec, raw) {
      return (interp(CURVES[sec].hard, raw) + interp(CURVES[sec].easy, raw)) / 2;
    }
    function scaleScore(sec, raw, path) {
      var v = path === 'hard' ? interp(CURVES[sec].hard, raw)
      : path === 'easy' ? interp(CURVES[sec].easy, raw)
      : midCurve(sec, raw);
      return Math.round(v / 10) * 10;
    }

    /* ---------------- question selection ---------------------------------- */
    function bankFor(sec) {
      if (sec === 'both') return (global.RW_BANK || []).concat(global.MATH_BANK || []);
      return sec === 'rw' ? global.RW_BANK : global.MATH_BANK;
    }

    function pickByDifficulty(pool, want, used, rnd, seen) {
      // want = {E:n, M:n, H:n}; falls back across difficulties when a level is thin.
      // Within a difficulty, questions she has seen fewest times come first, so
      // repeat sittings draw fresh material until the bank is genuinely exhausted.
      var out = [];
      var order = { E: ['E', 'M', 'H'], M: ['M', 'E', 'H'], H: ['H', 'M', 'E'] };
      seen = seen || {};
      ['H', 'M', 'E'].forEach(function (lvl) {
          var need = want[lvl] || 0;
          for (var k = 0; k < order[lvl].length && need > 0; k++) {
            var d = order[lvl][k];
            var avail = shuffle(pool.filter(function (q) {
                  return q.difficulty === d && !used[q.id];
              }), rnd).sort(function (a, b) { return (seen[a.id] || 0) - (seen[b.id] || 0); });
            while (need > 0 && avail.length) {
              var q = avail.shift();
              used[q.id] = true; out.push(q); need--;
            }
          }
      });
      return out;
    }

    function splitMix(n, mix) {
      var e = Math.round(n * mix.E), h = Math.round(n * mix.H);
      var m = n - e - h;
      if (m < 0) { m = 0; e = n - h; }
      return { E: e, M: m, H: h };
    }

    function buildModule(sec, kind, used, rnd) {
      var bp = BLUEPRINT[sec], bank = bankFor(sec), mix = MIX[kind];
      var seen = (global.Store && global.Store.seenCount) ? global.Store.seenCount() : {};
      var qs = [];
      Object.keys(bp.domains).forEach(function (dom) {
          var n = bp.domains[dom];
          var pool = bank.filter(function (q) { return q.domain === dom; });
          qs = qs.concat(pickByDifficulty(pool, splitMix(n, mix), used, rnd, seen));
      });
      // top up if a domain ran thin, then trim if rounding overshot
      var guard = 0;
      while (qs.length < bp.count && guard++ < 500) {
        var left = shuffle(bank.filter(function (q) { return !used[q.id]; }), rnd)
        .sort(function (a, b) { return (seen[a.id] || 0) - (seen[b.id] || 0); });
        if (!left.length) break;
        used[left[0].id] = true; qs.push(left[0]);
      }
      qs = qs.slice(0, bp.count);
      // interleave domains a little so it doesn't feel blocked by topic
      qs = shuffle(qs, rnd);
      if (sec === 'rw') {
        // real RW modules group by question type: II/C&S first, then EoI, then SEC
        var rank = {
          'Information and Ideas': 0, 'Craft and Structure': 0,
          'Expression of Ideas': 1, 'Standard English Conventions': 2
        };
        qs.sort(function (a, b) { return rank[a.domain] - rank[b.domain]; });
      } else {
        // real math modules put multiple-choice first, then student-response
        qs.sort(function (a, b) { return (a.type === 'spr' ? 1 : 0) - (b.type === 'spr' ? 1 : 0); });
      }
      return qs;
    }

    /* ---------------- session --------------------------------------------- */
    function Session(config) {
      this.cfg = config; // {kind, sections:[], seed, name}
      this.seed = config.seed || (Date.now() % 2147483647);
      this.rnd = mulberry32(this.seed);
      this.used = {};
      this.name = config.name || 'Student';
      this.modules = [];
      this.mi = 0; // module index
      this.qi = 0; // question index inside module
      this.startedAt = new Date().toISOString();
      this.id = 'a' + Date.now() + '-' + Math.floor(this.seed % 9973);
      this.finished = false;
      this.paused = false;
      this.timerHidden = false;
      this.abcOn = false;
      this.listeners = {};
      this._buildInitial();
      this._enterModule(0);
    }

    Session.prototype.on = function (evt, fn) {
      (this.listeners[evt] = this.listeners[evt] || []).push(fn); return this;
    };
    Session.prototype.emit = function (evt, data) {
      (this.listeners[evt] || []).forEach(function (f) { f(data); });
    };

    Session.prototype._mkModule = function (sec, kind, num, label) {
      var qs = buildModule(sec, kind, this.used, this.rnd);
      return {
        section: sec, kind: kind, num: num,
        label: label || (BLUEPRINT[sec].label + ', Module ' + num),
        seconds: BLUEPRINT[sec].seconds,
        remaining: BLUEPRINT[sec].seconds,
        questions: qs,
        state: qs.map(function () {
            return { choice: null, text: '', marked: false, struck: [], seconds: 0, visited: false };
        }),
        done: false
      };
    };

    Session.prototype._buildInitial = function () {
      var k = this.cfg.kind;
      if (k === 'full') {
        this.modules = [this._mkModule('rw', 'module1', 1)];
        this.plan = ['rw1', 'rw2', 'break', 'math1', 'math2'];
      } else if (k === 'rw' || k === 'math') {
        this.modules = [this._mkModule(k, 'module1', 1)];
        this.plan = [k + '1', k + '2'];
      } else if (k === 'drill') {
        var bank = bankFor(this.cfg.section);
        var pool = bank.filter(this.cfg.filter || function () { return true; });
        var self = this;
        pool = shuffle(pool, this.rnd).slice(0, this.cfg.count || 10);
        pool.forEach(function (q) { self.used[q.id] = true; });
        this.modules = [{
            section: this.cfg.section === 'both' ? 'mixed' : this.cfg.section, kind: 'drill', num: 1,
            label: this.cfg.label || 'Practice set',
            seconds: null, remaining: null, questions: pool,
            state: pool.map(function () {
                return { choice: null, text: '', marked: false, struck: [], seconds: 0, visited: false, checked: false };
            }),
            done: false
        }];
        this.plan = ['drill'];
      }
    };

    Session.prototype.mod = function () { return this.modules[this.mi]; };
    Session.prototype.q = function () { return this.mod().questions[this.qi]; };
    Session.prototype.st = function () { return this.mod().state[this.qi]; };
    Session.prototype.isDrill = function () { return this.cfg.kind === 'drill'; };
    Session.prototype.isBreak = function () { return this.mod().kind === 'break'; };
    Session.prototype.paneSection = function () {
      var m = this.mod();
      return m.section === 'mixed' ? (this.q() ? this.q().section : 'math') : m.section;
    };

    Session.prototype._enterModule = function (i) {
      this.mi = i; this.qi = 0;
      var m = this.mod();
      if (m.state && m.state[0]) m.state[0].visited = true;
      this._qClock = Date.now();
      this.startTimer();
    };

    /* ---- timing ---- */
    Session.prototype.startTimer = function () {
      var self = this;
      this.stopTimer();
      if (this.mod().remaining === null) return; // untimed drill
      this._iv = setInterval(function () {
          if (self.paused || self.finished) return;
          var m = self.mod();
          m.remaining -= 1;
          self.emit('tick', m.remaining);
          if (m.remaining <= 0) { m.remaining = 0; self.stopTimer(); self.timeExpired(); }
        }, 1000);
    };
    Session.prototype.stopTimer = function () { if (this._iv) clearInterval(this._iv); this._iv = null; };
    Session.prototype.togglePause = function () {
      this.paused = !this.paused; this.emit('change');
    };
    Session.prototype.timeExpired = function () {
      this.emit('expired');
      this.advanceModule();
    };
    Session.prototype._chargeTime = function () {
      var now = Date.now();
      var st = this.mod().state[this.qi];
      if (st && this._qClock) st.seconds += Math.round((now - this._qClock) / 1000);
      this._qClock = now;
    };

    /* ---- answering ---- */
    Session.prototype.select = function (i) {
      var st = this.st(); if (!st) return;
      if (this.isDrill() && st.checked) return;
      st.choice = (st.choice === i) ? null : i;
      if (st.choice !== null && st.struck.indexOf(i) >= 0) {
        st.struck = st.struck.filter(function (x) { return x !== i; });
      }
      this.emit('change');
    };
    Session.prototype.setText = function (v) {
      var st = this.st(); if (!st) return;
      if (this.isDrill() && st.checked) return;
      st.text = v;
    };
    Session.prototype.toggleStrike = function (i) {
      var st = this.st(); var k = st.struck.indexOf(i);
      if (k >= 0) st.struck.splice(k, 1);
      else { st.struck.push(i); if (st.choice === i) st.choice = null; }
      this.emit('change');
    };
    Session.prototype.toggleMark = function () { this.st().marked = !this.st().marked; this.emit('change'); };
    Session.prototype.toggleAbc = function () { this.abcOn = !this.abcOn; this.emit('change'); };
    Session.prototype.toggleTimer = function () { this.timerHidden = !this.timerHidden; this.emit('change'); };

    /* ---- navigation ---- */
    Session.prototype.goto = function (i) {
      var m = this.mod();
      if (i < 0 || i >= m.questions.length) return;
      this._chargeTime();
      this.qi = i; m.state[i].visited = true;
      this.emit('change');
    };
    Session.prototype.next = function () {
      if (this.qi < this.mod().questions.length - 1) this.goto(this.qi + 1);
      else this.emit('module-end');
    };
    Session.prototype.prev = function () { this.goto(this.qi - 1); };

    /* ---- module scoring / routing ---- */
    Session.prototype.gradeQuestion = function (mod, i) {
      var q = mod.questions[i], st = mod.state[i];
      if (q.type === 'spr') {
        if (!st.text || !st.text.trim()) return null;
        return Session.checkSPR(st.text, q.answers || [q.answer]) ? true : false;
      }
      if (st.choice === null || st.choice === undefined) return null;
      return st.choice === q.answer;
    };
    Session.prototype.moduleRaw = function (mod) {
      var self = this, right = 0;
      mod.questions.forEach(function (q, i) { if (self.gradeQuestion(mod, i) === true) right++; });
      return right;
    };

    /* A crude ability estimate: harder items count for more, easier for less.
       The real test uses item response theory; this captures the part that
       matters to a student -- getting the hard ones right is worth more than
       getting the same number of easy ones right. */
    var WEIGHT = { E: 0.72, M: 1.0, H: 1.32 };
    Session.prototype.moduleAbility = function (mod) {
      var self = this, got = 0, max = 0;
      mod.questions.forEach(function (q, i) {
          var w = WEIGHT[q.difficulty] || 1;
          max += w;
          if (self.gradeQuestion(mod, i) === true) got += w;
      });
      return max ? got / max : 0;
    };

    Session.prototype.advanceModule = function () {
      this._chargeTime();
      this.stopTimer();
      var m = this.mod(); m.done = true;

      var planPos = this.modules.length; // how many modules exist so far
      var kindNow = m.kind, sec = m.section;

      if (this.isDrill()) { return this.finish(); }

      // decide what comes next based on the plan
      if (this.cfg.kind === 'full') {
        if (sec === 'rw' && m.num === 1) {
          this.modules.push(this._mkModule('rw', this._route(m), 2));
          this._enterModule(this.modules.length - 1);
        } else if (sec === 'rw' && m.num === 2) {
          this.modules.push({
              section: 'break', kind: 'break', num: 0, label: 'Break',
              seconds: 10 * 60, remaining: 10 * 60, questions: [], state: [], done: false
          });
          this._enterModule(this.modules.length - 1);
        } else if (sec === 'break') {
          this.modules.push(this._mkModule('math', 'module1', 1));
          this._enterModule(this.modules.length - 1);
        } else if (sec === 'math' && m.num === 1) {
          this.modules.push(this._mkModule('math', this._route(m), 2));
          this._enterModule(this.modules.length - 1);
        } else {
          return this.finish();
        }
      } else {
        if (m.num === 1) {
          this.modules.push(this._mkModule(sec, this._route(m), 2));
          this._enterModule(this.modules.length - 1);
        } else {
          return this.finish();
        }
      }
      this.emit('module-change');
      this.emit('change');
    };

    // Routing uses the difficulty-weighted estimate, not the raw count, so a
    // student who cleared the hard items routes up even a question or two short.
    Session.prototype._route = function (mod) {
      return this.moduleAbility(mod) >= 0.6 ? 'hard' : 'easy';
    };

    Session.prototype.skipBreak = function () { this.advanceModule(); };

    /* ---- results ---- */
    Session.prototype.finish = function () {
      this._chargeTime();
      this.stopTimer();
      this.finished = true;
      this.result = this.buildResult();
      var self = this, evs = [];
      this.modules.forEach(function (m) {
          if (m.kind === 'break') return;
          m.questions.forEach(function (q, i) { evs.push(self.eventFor(m, i)); });
      });
      global.Store.recordEvents(evs);
      global.Store.saveAttempt(this.result);
      this.emit('finished', this.result);
      this.emit('change');
      return this.result;
    };

    Session.prototype.buildResult = function () {
      var self = this;
      var out = {
        id: this.id, kind: this.cfg.kind, seed: this.seed,
        startedAt: this.startedAt, finishedAt: new Date().toISOString(),
        label: this.cfg.label || null,
        sections: {}, items: [], path: {}
      };
      ['rw', 'math'].forEach(function (sec) {
          var mods = self.modules.filter(function (m) { return m.section === sec; });
          if (!mods.length) return;
          var raw = 0, total = 0;
          mods.forEach(function (m) { raw += self.moduleRaw(m); total += m.questions.length; });
          var m2 = mods[1];
          var path = m2 ? (m2.kind === 'hard' ? 'hard' : 'easy') : null;
          out.path[sec] = path;
          var full = BLUEPRINT[sec].count * 2;
          var ability = 0, wsum = 0;
          mods.forEach(function (m) {
              var w = m.questions.length;
              ability += self.moduleAbility(m) * w; wsum += w;
          });
          ability = wsum ? ability / wsum : 0;
          // half the estimate from the raw count, half from the difficulty-weighted
          // performance, then pro-rated to a full section's worth of questions
          var rawShare = total ? raw / total : 0;
          var scaledRaw = full * (0.5 * rawShare + 0.5 * ability);
          out.sections[sec] = {
            raw: raw, total: total, answered: 0, ability: Math.round(ability * 100),
            scaled: scaleScore(sec, scaledRaw, path),
            path: path, prorated: total < full
          };
      });
      if (out.sections.rw && out.sections.math) {
        out.total = out.sections.rw.scaled + out.sections.math.scaled;
      }
      this.modules.forEach(function (m, mIdx) {
          if (m.kind === 'break') return;
          m.questions.forEach(function (q, i) {
              var st = m.state[i], g = self.gradeQuestion(m, i);
              if (g !== null && out.sections[m.section]) out.sections[m.section].answered++;
              var tg = global.tagsFor ? global.tagsFor(q) : { strat: null, traps: {} };
              out.items.push({
                  qid: q.id, section: m.section, module: m.num, moduleKind: m.kind,
                  domain: q.domain, skill: q.skill, difficulty: q.difficulty,
                  choice: st.choice, text: st.text, marked: st.marked,
                  correct: g, seconds: st.seconds,
                  strat: tg.strat,
                  trap: (g === false && st.choice !== null && st.choice !== undefined) ? (tg.traps[st.choice] || null) : null
              });
          });
      });
      return out;
    };

    Session.prototype.eventFor = function (mod, i) {
      var q = mod.questions[i], st = mod.state[i], g = this.gradeQuestion(mod, i);
      var tg = global.tagsFor ? global.tagsFor(q) : { strat: null, traps: {} };
      return {
        key: this.id + '|' + q.id,
        attempt: this.id, kind: this.cfg.kind, t: new Date().toISOString(),
        qid: q.id, section: q.section, domain: q.domain, skill: q.skill,
        difficulty: q.difficulty, strat: tg.strat,
        trap: (g === false && st.choice !== null && st.choice !== undefined) ? (tg.traps[st.choice] || null) : null,
        correct: g, seconds: st.seconds, marked: !!st.marked
      };
    };

    /* ---- student-produced response checking (SAT rules) ---- */
    Session.checkSPR = function (raw, accepted) {
      function norm(s) {
        return String(s).trim().replace(/[,$\s]/g, '').replace(/^\+/, '');
      }
      function toNum(s) {
        if (!s) return null;
        if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {
          var p = s.split('/'); var d = parseFloat(p[1]);
          if (!d) return null;
          return parseFloat(p[0]) / d;
        }
        if (/^-?(\d+\.?\d*|\.\d+)%?$/.test(s)) return parseFloat(s);
        return null;
      }
      var s = norm(raw);
      if (!s) return false;
      var list = [].concat(accepted);
      for (var i = 0; i < list.length; i++) if (s === norm(list[i])) return true;
      var v = toNum(s);
      if (v === null) return false;
      var decimals = (s.split('.')[1] || '').length;
      for (var j = 0; j < list.length; j++) {
        var av = toNum(norm(list[j]));
        if (av === null) continue;
        if (Math.abs(v - av) < 1e-9) return true;
        if (decimals >= 3) { // SAT: 3+ digits, truncated or rounded
          var f = Math.pow(10, decimals);
          if (Math.abs(Math.trunc(av * f) / f - v) < 1e-9) return true;
          if (Math.abs(Math.round(av * f) / f - v) < 1e-9) return true;
        }
      }
      return false;
    };

    /* ---------------- persistence -----------------------------------------
       One event per answered question is the unit of record. Skill, strategy,
       and trap statistics are all derived from that log, which means there is
       only ever one thing to keep correct -- and it maps directly onto a row
       in the cloud database when the app is signed in. */
    var KEY = 'satprepme.v2';
    var MAX_EVENTS = 6000;

    var Store = {
      _read: function () {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
        catch (e) { return {}; }
      },
      _write: function (d) {
        try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
        if (global.Cloud && global.Cloud.onLocalWrite) global.Cloud.onLocalWrite(d);
      },
      data: function () {
        var d = this._read();
        d.name = d.name || 'Student';
        d.attempts = d.attempts || [];
        d.events = d.events || [];
        if (d.skills && !d._migrated) { d._migrated = true; }
        return d;
      },
      setName: function (n) { var d = this.data(); d.name = n; this._write(d); },

      /* upsert by key so re-recording the same question is idempotent */
      recordEvents: function (list) {
        if (!list || !list.length) return;
        var d = this.data();
        var idx = {};
        d.events.forEach(function (e, i) { idx[e.key] = i; });
        list.forEach(function (e) {
            if (e.correct === null || e.correct === undefined) return; // unanswered
            if (idx[e.key] !== undefined) d.events[idx[e.key]] = e;
            else { idx[e.key] = d.events.length; d.events.push(e); }
        });
        if (d.events.length > MAX_EVENTS) d.events = d.events.slice(-MAX_EVENTS);
        this._write(d);
        if (global.Cloud && global.Cloud.pushEvents) global.Cloud.pushEvents(list);
      },

      saveAttempt: function (res) {
        var d = this.data();
        d.attempts = d.attempts.filter(function (a) { return a.id !== res.id; });
        d.attempts.unshift(res);
        d.attempts = d.attempts.slice(0, 60);
        this._write(d);
        if (global.Cloud && global.Cloud.pushAttempt) global.Cloud.pushAttempt(res);
      },
      attempt: function (id) {
        return this.data().attempts.filter(function (a) { return a.id === id; })[0];
      },
      reset: function () { this._write({}); },

      /* ---------- aggregates, all derived from the event log ---------- */
      agg: function (events) {
        var evs = events || this.data().events;
        var out = { skills: {}, strats: {}, traps: {}, fams: {}, sections: {}, total: { seen: 0, right: 0 } };
        evs.forEach(function (e) {
            if (e.correct === null || e.correct === undefined) return;
            out.total.seen++; if (e.correct) out.total.right++;

            var sk = e.section + '|' + e.domain + '|' + e.skill;
            var s = out.skills[sk] || (out.skills[sk] = { key: sk, section: e.section, domain: e.domain, skill: e.skill, seen: 0, right: 0 });
            s.seen++; if (e.correct) s.right++;

            var sec = out.sections[e.section] || (out.sections[e.section] = { seen: 0, right: 0 });
            sec.seen++; if (e.correct) sec.right++;

            if (e.strat) {
              var st = out.strats[e.strat] || (out.strats[e.strat] = { id: e.strat, seen: 0, right: 0, recent: [] });
              st.seen++; if (e.correct) st.right++;
              st.recent.push(e.correct ? 1 : 0);
            }
            if (e.trap) {
              var tr = out.traps[e.trap] || (out.traps[e.trap] = { id: e.trap, n: 0, last: null, qids: [] });
              tr.n++; tr.last = e.t; if (tr.qids.indexOf(e.qid) < 0) tr.qids.push(e.qid);
              var fam = (global.TRAPS && global.TRAPS[e.trap]) ? global.TRAPS[e.trap].fam : 'other';
              out.fams[fam] = (out.fams[fam] || 0) + 1;
            }
        });
        return out;
      },

      /* accuracy on the most recent n attempts of a strategy vs the n before */
      trend: function (stratId, n) {
        n = n || 8;
        var evs = this.data().events.filter(function (e) { return e.strat === stratId && e.correct !== null; });
        if (evs.length < n + 3) return null;
        var recent = evs.slice(-n), prior = evs.slice(-2 * n, -n);
        if (!prior.length) return null;
        var pctOf = function (a) { return a.filter(function (e) { return e.correct; }).length / a.length; };
        return Math.round(100 * (pctOf(recent) - pctOf(prior)));
      },

      weakestStrats: function (n, minSeen) {
        var a = this.agg().strats, out = [];
        Object.keys(a).forEach(function (k) { if (a[k].seen >= (minSeen || 3)) out.push(a[k]); });
        out.sort(function (x, y) { return (x.right / x.seen) - (y.right / y.seen); });
        return out.slice(0, n || 5);
      },
      topTraps: function (n) {
        var a = this.agg().traps, out = [];
        Object.keys(a).forEach(function (k) { out.push(a[k]); });
        out.sort(function (x, y) { return y.n - x.n; });
        return out.slice(0, n || 6);
      },
      weakest: function (n) { // by skill, kept for the older screens
        var a = this.agg().skills, out = [];
        Object.keys(a).forEach(function (k) { if (a[k].seen >= 3) out.push(a[k]); });
        out.sort(function (x, y) { return (x.right / x.seen) - (y.right / y.seen); });
        return out.slice(0, n || 5);
      },

      /* questions she has missed and has not since got right -- the retry queue */
      missedQueue: function (n) {
        /* Only questions from this app can be retried. A miss logged from an
           official practice test has no question here to come back to. */
        var evs = this.data().events.filter(function (e) { return e.correct !== null && e.qid; });
        var last = {};
        evs.forEach(function (e) { last[e.qid] = e; });
        var out = [];
        Object.keys(last).forEach(function (q) { if (last[q].correct === false) out.push(last[q]); });
        out.sort(function (a, b) { return (a.t < b.t) ? 1 : -1; });
        return out.slice(0, n || 20);
      },

      /* Coverage answers the real question: has she met all of this, and can she
       now beat it? A strategy or a trap counts as mastered once she has met it
       at least 3 times and got the most recent 3 right. "Meeting" a trap means
       answering a question that had that trap sitting among its choices, which
       is why this walks the bank rather than only the recorded misses. */
    coverage: function () {
      var bank = {};
      (global.RW_BANK || []).concat(global.MATH_BANK || []).forEach(function (q) { bank[q.id] = q; });
      var out = { strats: {}, traps: {} };

      function note(group, id, correct) {
        var c = out[group][id] || (out[group][id] = { id: id, seen: 0, right: 0, recent: [] });
        c.seen++;
        if (correct) c.right++;
        c.recent.push(correct ? 1 : 0);
        if (c.recent.length > 6) c.recent.shift();
      }

      this.data().events.forEach(function (e) {
        if (e.correct === null || e.correct === undefined) return;
        var q = bank[e.qid];
        var tg = (q && global.tagsFor) ? global.tagsFor(q) : null;
        var strat = e.strat || (tg && tg.strat);
        if (strat) note('strats', strat, e.correct);
        if (tg) {
          var ids = {};
          Object.keys(tg.traps).forEach(function (k) { ids[tg.traps[k]] = 1; });
          Object.keys(ids).forEach(function (t) { note('traps', t, e.correct); });
        } else if (e.trap) {
          note('traps', e.trap, false);
        }
      });

      ['strats', 'traps'].forEach(function (g) {
        Object.keys(out[g]).forEach(function (id) {
          var c = out[g][id];
          var last3 = c.recent.slice(-3);
          var clean = last3.length === 3 && last3.every(function (x) { return x === 1; });
          c.state = (c.seen >= 3 && clean) ? 'mastered' : 'learning';
        });
      });
      return out;
    },

    coverageSummary: function () {
      var cov = this.coverage();
      function count(group, all) {
        var m = 0, l = 0;
        Object.keys(all).forEach(function (id) {
          var c = cov[group][id];
          if (!c) return;
          if (c.state === 'mastered') m++;
          else l++;
        });
        return { mastered: m, learning: l, total: Object.keys(all).length };
      }
      return {
        strats: count('strats', global.STRATS || {}),
        traps: count('traps', global.TRAPS || {})
      };
    },

    streak: function () {
        var days = {};
        this.data().events.forEach(function (e) { if (e.t) days[String(e.t).slice(0, 10)] = true; });
        var n = 0, d = new Date();
        var key = function (dt) { return dt.toISOString().slice(0, 10); };
        if (!days[key(d)]) { // today not done yet: start from yesterday
          d.setDate(d.getDate() - 1);
          if (!days[key(d)]) return 0;
        }
        while (days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
        return n;
      },

      answeredToday: function () {
        var today = new Date().toISOString().slice(0, 10), n = 0;
        this.data().events.forEach(function (e) { if (e.t && String(e.t).slice(0, 10) === today) n++; });
        return n;
      },

      /* Misses logged from an official practice test. Same event shape as
       everything else, so the diagnosis screens pick them up for free. */
    logMisses: function (session, rows) {
      var evs = rows.map(function (r, i) {
        return {
          key: 'log-' + session.id + '-' + i,
          attempt: 'log-' + session.id,
          kind: 'logged',
          source: session.label,
          t: new Date().toISOString(),
          qid: null,
          section: session.section,
          domain: r.domain || null,
          skill: r.skill || null,
          difficulty: null,
          strat: r.strat || null,
          trap: r.trap || null,
          cause: r.cause,
          correct: false,
          seconds: 0
        };
      });
      this.recordEvents(evs);
      return evs.length;
    },

    /* How the logged misses break down: trapped, rushed, or a content gap.
       Keeping those apart is the point, because they call for different work. */
    logSummary: function () {
      var out = { total: 0, trap: 0, rushed: 0, gap: 0, sessions: {} };
      this.data().events.forEach(function (e) {
        if (e.kind !== 'logged') return;
        out.total++;
        if (e.cause === 'rushed') out.rushed++;
        else if (e.cause === 'gap') out.gap++;
        else out.trap++;
        if (e.source) out.sessions[e.source] = (out.sessions[e.source] || 0) + 1;
      });
      return out;
    },

    seenCount: function () {
        var c = {};
        this.data().events.forEach(function (e) { c[e.qid] = (c[e.qid] || 0) + 1; });
        return c;
      }
    };


    global.SATP = {
      BLUEPRINT: BLUEPRINT, CURVES: CURVES, Session: Session, Store: Store,
      scaleScore: scaleScore, shuffle: shuffle, mulberry32: mulberry32,
      bankFor: bankFor,
      fmtTime: function (s) {
        if (s === null || s === undefined) return '--:--';
        s = Math.max(0, Math.round(s));
        var m = Math.floor(s / 60), r = s % 60;
        return m + ':' + (r < 10 ? '0' : '') + r;
      }
    };
    global.Store = Store;
})(window);

</script>
<script>
/* ============================================================
   SAT LockIn: accounts, sync, and the AI tutor (browser side)

   Talks to this app's own API, served by server.js and backed by Postgres.
   No third party service and no SDK: plain fetch, so the app stays a folder
   of files you can double-click.

   Offline first by design. Local storage is the source of truth for the
   student in front of the screen and the server is a mirror. If the network
   is down, or there is no database, everything still works and nothing is
   lost. Unsynced rows queue up and go out later.

   Zero configuration: on boot the app asks the server what it supports. Open
   index.html from disk and there is no server, so it stays offline. Deploy it
   with a database attached and accounts appear on their own.
   ============================================================ */
(function (global) {
  'use strict';

  var CFG = global.CONFIG || {};
  var API = (CFG.apiUrl || '').replace(/\/+$/, '');
  var SKEY = 'decoy.session.v2';
  var QKEY = 'decoy.queue.v2';

  var Cloud = {
    enabled: false,      // set true once the server reports a working database
    aiEnabled: false,    // set true once the server reports a tutor key
    session: null,       // { token, user }
    profile: null,       // { id, email, display_name, role, class_code }
    lastError: null,
    ready: false,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function () {
      this.listeners.forEach(function (f) { try { f(); } catch (e) {} });
    },

    /* ---------------- plumbing ---------------- */
    url: function (p) { return API + p; },

    saveSession: function (s) {
      this.session = s;
      this.profile = s ? s.user : null;
      try {
        if (s) localStorage.setItem(SKEY, JSON.stringify(s));
        else localStorage.removeItem(SKEY);
      } catch (e) {}
    },

    loadSession: function () {
      try {
        var s = JSON.parse(localStorage.getItem(SKEY));
        if (s && s.token) { this.session = s; this.profile = s.user || null; }
      } catch (e) {}
    },

    signedIn: function () { return !!(this.session && this.session.token); },

    post: function (path, body, opts) {
      var self = this;
      var headers = { 'Content-Type': 'application/json' };
      if (this.signedIn()) headers.Authorization = 'Bearer ' + this.session.token;
      return fetch(this.url(path), {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body || {})
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401 && self.signedIn() && !(opts && opts.noLogout)) {
            self.saveSession(null);
            self.emit();
          }
          if (!r.ok || d.error) throw new Error(d.error || 'That did not work.');
          return d;
        });
      });
    },

    /* ---------------- what does this server support? ---------------- */
    probe: function () {
      var self = this;
      return fetch(this.url('/healthz'), { method: 'GET' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          self.ready = true;
          if (!d) return false;
          self.enabled = !!d.accounts;
          self.aiEnabled = !!(d.tutor && d.accounts) || !!(d.tutor && CFG.allowAnonTutor);
          self.mail = !!d.mail;
          if (self.enabled && self.signedIn()) {
            return self.afterSignIn().then(function () { return true; });
          }
          self.emit();
          return true;
        })
        .catch(function () { self.ready = true; return false; });
    },

    /* ---------------- sign in ---------------- */
    sendCode: function (email) {
      return this.post('/api/auth/request', { email: email });
    },

    verifyCode: function (email, code) {
      var self = this;
      return this.post('/api/auth/verify', { email: email, code: code }, { noLogout: true })
        .then(function (d) {
          self.saveSession({ token: d.token, user: d.user });
          return self.afterSignIn();
        });
    },

    signOut: function () {
      var self = this;
      var p = this.signedIn() ? this.post('/api/auth/signout', {}).catch(function () {}) : Promise.resolve();
      return p.then(function () { self.saveSession(null); self.emit(); });
    },

    afterSignIn: function () {
      var self = this;
      return this.pullAll()
        .then(function () { return self.flushQueue(); })
        .then(function () { self.emit(); return true; });
    },

    /* ---------------- profile and class ---------------- */
    updateProfile: function (patch) {
      var self = this;
      return this.post('/api/me/update', patch).then(function (d) {
        self.profile = d.user;
        if (self.session) { self.session.user = d.user; self.saveSession(self.session); }
        self.emit();
        return d.user;
      });
    },

    joinClass: function (code) { return this.updateProfile({ class_code: code }); },

    createClass: function (name, code) {
      var self = this;
      return this.post('/api/class/create', { name: name, code: code }).then(function (d) {
        self.profile = d.user;
        if (self.session) { self.session.user = d.user; self.saveSession(self.session); }
        self.emit();
        return d;
      });
    },

    _classCache: null,
    _classFetch: function () {
      var self = this;
      if (this._classCache && Date.now() - this._classCache.at < 4000) {
        return Promise.resolve(this._classCache.data);
      }
      return this.post('/api/class/roster', {}).then(function (d) {
        self._classCache = { at: Date.now(), data: d };
        return d;
      });
    },
    classRoster: function () {
      return this._classFetch().then(function (d) { return d.roster || []; });
    },
    classTraps: function () {
      return this._classFetch().then(function (d) { return d.traps || []; });
    },

    /* ---------------- outbound sync ---------------- */
    queue: function (kind, rows) {
      try {
        var q = JSON.parse(localStorage.getItem(QKEY)) || { events: [], attempts: [], generated: [] };
        q[kind] = (q[kind] || []).concat(rows);
        if (q.events.length > 4000) q.events = q.events.slice(-4000);
        localStorage.setItem(QKEY, JSON.stringify(q));
      } catch (e) {}
    },
    readQueue: function () {
      try { return JSON.parse(localStorage.getItem(QKEY)) || { events: [], attempts: [], generated: [] }; }
      catch (e) { return { events: [], attempts: [], generated: [] }; }
    },
    clearQueue: function () { try { localStorage.removeItem(QKEY); } catch (e) {} },

    pushEvents: function (list) {
      var self = this;
      var real = (list || []).filter(function (e) {
        return e.correct !== null && e.correct !== undefined;
      });
      if (!real.length) return;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/sync/events', { events: real }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('events', real);
      });
    },

    pushAttempt: function (a) {
      var self = this;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/sync/attempt', { attempt: a }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('attempts', [a]);
      });
    },

    pushGenerated: function (list) {
      var self = this;
      if (!list || !list.length) return;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/generated', { questions: list }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('generated', list);
      });
    },

    flushQueue: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      var q = this.readQueue();
      if (!q.events.length && !q.attempts.length && !(q.generated || []).length) return Promise.resolve();
      var jobs = [];
      if (q.events.length) jobs.push(this.post('/api/sync/events', { events: q.events }));
      (q.attempts || []).forEach(function (a) {
        jobs.push(self.post('/api/sync/attempt', { attempt: a }));
      });
      if ((q.generated || []).length) jobs.push(this.post('/api/generated', { questions: q.generated }));
      return Promise.all(jobs).then(function () { self.clearQueue(); })
        .catch(function (err) { self.lastError = String(err.message || err); });
    },

    /* ---------------- inbound sync ---------------- */
    pullAll: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      return this.post('/api/sync/pull', {}).then(function (d) {
        var store = global.Store.data();
        var have = {};
        store.events.forEach(function (e) { have[e.key] = true; });
        (d.events || []).forEach(function (row) {
          if (have[row.key]) return;
          store.events.push({
            key: row.key, attempt: row.attempt, t: row.t, qid: row.qid,
            section: row.section, domain: row.domain, skill: row.skill,
            difficulty: row.difficulty, strat: row.strat, trap: row.trap,
            correct: row.correct, seconds: row.seconds
          });
        });
        store.events.sort(function (a, b) { return (a.t < b.t) ? -1 : 1; });

        var seen = {};
        store.attempts.forEach(function (a) { seen[a.id] = true; });
        (d.attempts || []).forEach(function (a) { if (a && !seen[a.id]) store.attempts.push(a); });
        store.attempts.sort(function (a, b) { return (a.finishedAt < b.finishedAt) ? 1 : -1; });

        if (d.user && d.user.display_name) store.name = d.user.display_name;
        if (d.user) { self.profile = d.user; }
        global.Store._write(store);

        if ((d.generated || []).length && global.Generate) {
          var mine = {};
          global.Generate.stored().forEach(function (q) { mine[q.id] = 1; });
          var fresh = d.generated.filter(function (q) { return q && q.id && !mine[q.id]; });
          if (fresh.length) {
            global.Generate.save(global.Generate.stored().concat(fresh));
            global.Generate.install();
          }
        }
        return true;
      }).catch(function (err) { self.lastError = String(err.message || err); });
    },

    /* kept so callers written against the older shape still work */
    pullGenerated: function () { return Promise.resolve(0); },
    fetchProfile: function () { return Promise.resolve(this.profile); },

    /* ---------------- AI tutor ---------------- */
    ask: function (task, prompt, context, model) {
      if (!this.aiEnabled) return Promise.reject(new Error('The AI tutor is not switched on for this server.'));
      var chosen = model || (CFG.aiModels && CFG.aiModels[task]) || 'claude-haiku-4-5';
      return this.post(CFG.tutorUrl || '/api/tutor', {
        task: task, prompt: prompt, context: context, model: chosen
      });
    },

    onLocalWrite: function () { /* hook kept for future incremental sync */ }
  };

  Cloud.loadSession();
  global.Cloud = Cloud;

  /* Ask the server what it can do, then let the app re-render. */
  Cloud.probe();
})(window);

</script>
<script>
/* ============================================================
   SAT LockIn, question generation

   Goal: nobody runs out of practice, and every strategy and every trap
   type gets covered. When the student has worked through the built-in
   bank for some target, the app asks Claude for more of exactly that
   target, validates the result hard, and merges it into the bank.

   Nothing generated is trusted on arrival. A question only reaches the
   student if it passes every check in validate(): right shape, four
   choices, one answer in range, a real strategy id, one real trap id
   per wrong choice, sane lengths, and for fill-ins an answer that parses
   as a number. Anything that fails is dropped and reported.
   ============================================================ */
(function (global) {
    'use strict';

    var GKEY = 'decoy.generated.v1';
    var MAX_STORED = 400;

    /* the exact blueprint slots the SAT uses, so generated items stay in scope */
    var SKILL_DOMAIN = {};
    function indexSkills() {
      (global.RW_BANK || []).concat(global.MATH_BANK || []).forEach(function (q) {
          SKILL_DOMAIN[q.skill] = { domain: q.domain, section: q.section };
      });
    }

    var Generate = {
      busy: false,
      lastReport: null,

      stored: function () {
        try { return JSON.parse(localStorage.getItem(GKEY)) || []; }
        catch (e) { return []; }
      },
      save: function (list) {
        try { localStorage.setItem(GKEY, JSON.stringify(list.slice(-MAX_STORED))); } catch (e) {}
      },

      /* ---------- merge stored questions into the live bank ---------- */
      install: function () {
        indexSkills();
        var added = 0;
        this.stored().forEach(function (q) {
            if (!q || !q.id) return;
            var bank = q.section === 'rw' ? global.RW_BANK : global.MATH_BANK;
            if (bank.some(function (x) { return x.id === q.id; })) return;
            bank.push(q);
            global.TAGS[q.id] = { strat: q.strat, traps: q.trapTags || {} };
            added++;
        });
        return added;
      },

      /* ---------- prompt construction ---------- */
      exemplars: function (skill, n) {
        var pool = (global.RW_BANK || []).concat(global.MATH_BANK || [])
        .filter(function (q) { return q.skill === skill && !q.generated; });
        return pool.slice(0, n || 2).map(function (q) {
            return JSON.stringify({
                section: q.section, domain: q.domain, skill: q.skill, difficulty: q.difficulty,
                type: q.type, blurb: q.blurb || '', passage: q.passage || '', figure: q.figure || '',
                prompt: q.prompt, choices: q.choices || [], answer: q.answer == null ? -1 : q.answer,
                answers: q.answers || [], strat: global.tagsFor(q).strat,
                strategy: q.strategy, hint: q.hint, steps: q.steps,
                distractors: Object.keys(q.traps || {}).map(function (k) {
                    return { index: +k, trap: global.tagsFor(q).traps[k], why: q.traps[k] };
                })
              }, null, 1);
        }).join('\n\n');
      },

      buildPrompt: function (opts) {
        if (!Object.keys(SKILL_DOMAIN).length) indexSkills();
        var strat = global.STRATS[opts.strat];
        var traps = (opts.traps || []).filter(function (t) { return global.TRAPS[t]; });
        var skill = opts.skill;
        /* A habit strategy owns no questions, so there is no skill to look up.
           Fall back to any skill in the strategy's own section rather than
           sending "undefined" to the model. */
        if (!skill && strat) {
          var pool = Object.keys(SKILL_DOMAIN).filter(function (k) {
              return SKILL_DOMAIN[k].section === strat.section;
          });
          skill = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
        }
        var sd = SKILL_DOMAIN[skill] || {};
        var lines = [];
        lines.push('Write ' + (opts.count || 3) + ' new SAT questions to the specification below.');
        lines.push('');
        lines.push('section: ' + (sd.section || opts.section || (strat && strat.section)));
        lines.push('domain: ' + (sd.domain || opts.domain));
        lines.push('skill: ' + skill);
        lines.push('difficulty: ' + (opts.difficulty || 'M') + '  (E easier, M medium, H harder)');
        lines.push('type: ' + (opts.type || 'mc'));
        lines.push('');
        if (strat) {
          lines.push('THE MOVE BEING TESTED: "' + strat.name + '" (id: ' + opts.strat + ')');
          lines.push('What it means: ' + strat.move);
          lines.push('Use exactly this id in the strat field.');
          lines.push('');
          /* The per-strategy recipe. Generic instructions produce questions of
             the right shape that do not reliably test the intended move, so
             this says what the correct answer has to do and how this question
             type specifically goes wrong. */
          if (strat.gen) {
            lines.push('HOW A QUESTION FOR THIS MOVE MUST BE BUILT');
            lines.push('Shape: ' + strat.gen.shape);
            lines.push('The correct answer: ' + strat.gen.key);
            lines.push('Watch out: ' + strat.gen.avoid);
            lines.push('');
          }
        }
        if (traps.length) {
          lines.push('Build the wrong answers from these trap types. Use these exact ids in the');
          lines.push('trap field of each distractor, and make each distractor a real example of it:');
          traps.forEach(function (t) {
              lines.push('  ' + t + ' = ' + global.TRAPS[t].name + '. ' + global.TRAPS[t].tell);
          });
          lines.push('');
          if (opts.mustInclude) {
            lines.push('At least one distractor in EVERY question must use the trap "' +
              opts.mustInclude + '" (' + global.TRAPS[opts.mustInclude].name + '), because the');
            lines.push('student is practicing spotting that one specifically.');
            lines.push('');
          }
        }
        var ex = this.exemplars(opts.skill, 2);
        if (ex) {
          lines.push('Here are existing questions from this same skill. Match their format, their');
          lines.push('scope, and the level of detail in the explanation. Do not reuse their content,');
          lines.push('their topics, or their wording.');
          lines.push('');
          lines.push(ex);
        }
        return lines.join('\n');
      },

      /* ---------- validation ---------- */
      validate: function (q, opts) {
        var errs = [];
        var need = ['section', 'domain', 'skill', 'difficulty', 'type', 'prompt', 'strat', 'strategy', 'hint', 'steps'];
        need.forEach(function (k) { if (!q[k] && q[k] !== 0) errs.push('missing ' + k); });
        if (errs.length) return errs;

        if (q.section !== 'rw' && q.section !== 'math') errs.push('bad section');
        if (['E', 'M', 'H'].indexOf(q.difficulty) < 0) errs.push('bad difficulty');
        if (!global.STRATS[q.strat]) errs.push('unknown strategy id ' + q.strat);
        if (!Array.isArray(q.steps) || q.steps.length < 2) errs.push('needs at least 2 steps');
        if (String(q.prompt).length < 12) errs.push('prompt too short');
        if (q.section === 'rw' && q.type === 'mc') {
          var words = String(q.passage || '').replace(/<[^>]*>/g, ' ').trim().split(/\s+/).length;
          if (!q.passage) errs.push('reading question with no passage');
          else if (words < 25 || words > 190) errs.push('passage is ' + words + ' words, needs 25 to 190');
        }

        if (q.type === 'mc') {
          if (!Array.isArray(q.choices) || q.choices.length !== 4) errs.push('needs exactly 4 choices');
          if (typeof q.answer !== 'number' || q.answer < 0 || q.answer > 3) errs.push('answer must be 0 to 3');
          if (Array.isArray(q.choices)) {
            var seen = {};
            q.choices.forEach(function (c) {
                if (!String(c).trim()) errs.push('empty choice');
                if (seen[String(c).trim()]) errs.push('duplicate choice');
                seen[String(c).trim()] = 1;
            });
          }
          var ds = Array.isArray(q.distractors) ? q.distractors : [];
          if (ds.length !== 3) errs.push('needs exactly 3 distractor entries, got ' + ds.length);
          var covered = {};
          ds.forEach(function (d) {
              if (typeof d.index !== 'number' || d.index < 0 || d.index > 3) errs.push('distractor index out of range');
              if (d.index === q.answer) errs.push('a distractor points at the correct answer');
              if (!global.TRAPS[d.trap]) errs.push('unknown trap id ' + d.trap);
              if (!d.why || String(d.why).length < 15) errs.push('distractor explanation too short');
              covered[d.index] = 1;
          });
          [0, 1, 2, 3].forEach(function (i) {
              if (i !== q.answer && !covered[i]) errs.push('choice ' + i + ' has no trap assigned');
          });
          if (opts && opts.mustInclude && !ds.some(function (d) { return d.trap === opts.mustInclude; })) {
            errs.push('none of the distractors use the requested trap ' + opts.mustInclude);
          }
        } else if (q.type === 'spr') {
          if (!Array.isArray(q.answers) || !q.answers.length) errs.push('fill-in needs accepted answers');
          else if (!q.answers.every(function (a) { return /^-?[\d.\/]+$/.test(String(a).trim()); })) {
            errs.push('fill-in answers must be plain numbers or fractions');
          }
        } else {
          errs.push('type must be mc or spr');
        }
        return errs;
      },

      /* ---------- turn a validated item into a bank question ---------- */
      toQuestion: function (q, model) {
        var id = 'gen-' + q.section + '-' + Math.abs(hash(q.prompt + (q.choices || []).join('|'))).toString(36);
        var traps = {}, trapTags = {};
        (q.distractors || []).forEach(function (d) {
            traps[d.index] = d.why;
            trapTags[d.index] = d.trap;
        });
        return {
          id: id, section: q.section, domain: q.domain, skill: q.skill, difficulty: q.difficulty,
          type: q.type, blurb: q.blurb || '', figure: q.figure || '', figcap: q.figcap || '',
          passage: q.passage || '', prompt: q.prompt,
          choices: q.type === 'mc' ? q.choices : undefined,
          answer: q.type === 'mc' ? q.answer : undefined,
          answers: q.type === 'spr' ? q.answers : undefined,
          strategy: q.strategy, hint: q.hint, steps: q.steps, traps: traps,
          strat: q.strat, trapTags: trapTags,
          generated: true, model: model || null, createdAt: new Date().toISOString()
        };
      },

      /* ---------- the call ---------- */
      run: function (opts) {
        var self = this;
        if (!global.Cloud || !global.Cloud.aiEnabled) {
          return Promise.reject(new Error('Question writing needs the AI tutor switched on. See SETUP-CLOUD.md.'));
        }
        if (this.busy) return Promise.reject(new Error('Already writing questions.'));
        this.busy = true;
        indexSkills();

        var attempt = function (tries) {
          return global.Cloud.ask('generate', self.buildPrompt(opts), '', opts.model)
          .then(function (res) {
              var parsed = parseJSON(res.text);
              if (!parsed || !Array.isArray(parsed.questions)) throw new Error('The reply was not usable JSON.');
              var good = [], rejected = [];
              parsed.questions.forEach(function (raw) {
                  var errs = self.validate(raw, opts);
                  if (errs.length) rejected.push({ prompt: String(raw.prompt || '').slice(0, 60), errs: errs });
                  else good.push(self.toQuestion(raw, res.model));
              });
              if (!good.length && tries > 0) return attempt(tries - 1);
              var store = self.stored();
              var have = {};
              store.forEach(function (q) { have[q.id] = 1; });
              good = good.filter(function (q) { return !have[q.id]; });
              self.save(store.concat(good));
              self.install();
              self.lastReport = { added: good.length, rejected: rejected, model: res.model };
              if (global.Cloud.pushGenerated) global.Cloud.pushGenerated(good);
              return self.lastReport;
          });
        };

        return attempt(1).then(function (r) { self.busy = false; return r; },
          function (e) { self.busy = false; throw e; });
      },

      /* ---------- what still needs covering ---------- */
      /* The traps a strategy's recipe expects, so a strategy-targeted request
         asks for the distractor types that move actually produces. */
      trapsForStrat: function (stratId) {
        var st = global.STRATS[stratId];
        if (st && st.gen && st.gen.traps) {
          return st.gen.traps.filter(function (t) { return global.TRAPS[t]; });
        }
        var out = {};
        (global.RW_BANK || []).concat(global.MATH_BANK || []).forEach(function (q) {
          if (global.tagsFor(q).strat !== stratId) return;
          var t = global.tagsFor(q).traps;
          Object.keys(t).forEach(function (k) { out[t[k]] = 1; });
        });
        return Object.keys(out);
      },

      gapPlan: function () {
        var cov = global.Store.coverage();
        var plan = [];
        Object.keys(global.STRATS).forEach(function (id) {
            var c = cov.strats[id];
            if (!c || c.state !== 'mastered') plan.push({ kind: 'strat', id: id, state: c ? c.state : 'new' });
        });
        Object.keys(global.TRAPS).forEach(function (id) {
            var c = cov.traps[id];
            if (!c || c.state !== 'mastered') plan.push({ kind: 'trap', id: id, state: c ? c.state : 'new' });
        });
        return plan;
      },

      /* pick a skill that exercises a given strategy or trap */
      skillFor: function (kind, id) {
        var all = (global.RW_BANK || []).concat(global.MATH_BANK || []);
        var hits = all.filter(function (q) {
            var t = global.tagsFor(q);
            if (kind === 'strat') return t.strat === id;
            return Object.keys(t.traps).some(function (k) { return t.traps[k] === id; });
        });
        if (!hits.length) return null;
        return hits[Math.floor(Math.random() * hits.length)].skill;
      }
    };

    function hash(s) {
      var h = 5381;
      for (var i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
      return h | 0;
    }

    function parseJSON(text) {
      if (!text) return null;
      var t = String(text).trim();
      t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
      var a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a < 0 || b < a) return null;
      try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
    }

    global.Generate = Generate;
})(window);

</script>
<script>
/* ============================================================
   SAT LockIn: UI layer
   ============================================================ */
(function () {
    'use strict';

    var shell = document.getElementById('shell');
    var S = null;            // active Session
    var view = 'home';       // home | skills | progress | directions | break | exam | review
    var reviewData = null;   // attempt being reviewed
    var reviewFilter = 'all';
    var ALLQ = {};
    var scrollMemo = null;
    var LETTERS = ['A', 'B', 'C', 'D'];

    var PALETTES = [
      { id:'focus',  name:'Focus',  sw:['#0e7490','#ff7a5c','#e0f4fa'], ds:'Calm aqua with a warm accent. The default.' },
      { id:'arcade', name:'Arcade', sw:['#2563eb','#a3e635','#e6edfe'], ds:'Electric blue and lime. Most energy.' },
      { id:'sunset', name:'Sunset', sw:['#be185d','#fbbf24','#fce7f0'], ds:'Magenta and amber. Warmest.' },
      { id:'grove',  name:'Grove',  sw:['#047857','#fdba74','#e0f5ee'], ds:'Forest green and peach. Quietest.' },
      { id:'violet', name:'Violet', sw:['#4f46e5','#ffd166','#eef0fe'], ds:'Indigo and sunshine.' }

    function trapsForSkill(skill) {
      var counts = {};
      window.RW_BANK.concat(window.MATH_BANK).forEach(function (q) {
        if (q.skill !== skill) return;
        var t = window.tagsFor(q).traps;
        Object.keys(t).forEach(function (k) { counts[t[k]] = (counts[t[k]] || 0) + 1; });
      });
      return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    }

    /* ---------------- AI tutor plumbing ---------------- */
    function questionContext(q, st) {
      if (!q) return '';
      var lines = [];
      lines.push('Section: ' + (q.section === 'rw' ? 'Reading and Writing' : 'Math') + ' / ' + q.domain + ' / ' + q.skill);
      if (q.blurb) lines.push('Note: ' + stripTags(q.blurb));
      if (q.passage) lines.push('Passage: ' + stripTags(q.passage));
      if (q.figure) lines.push('Figure data: ' + stripTags(q.figure));
      lines.push('Question: ' + stripTags(q.prompt));
      if (q.type === 'spr') {
        lines.push('This is a fill-in question. Accepted answers: ' + (q.answers || []).join(' or '));
        if (st && st.text) lines.push('The student entered: ' + st.text);
      } else {
        (q.choices || []).forEach(function (c, i) { lines.push(LETTERS[i] + ') ' + stripTags(c)); });
        lines.push('Correct answer: ' + LETTERS[q.answer]);
        if (st && st.choice !== null && st.choice !== undefined) lines.push('The student chose: ' + LETTERS[st.choice]);
        var tg = window.tagsFor(q);
        if (st && st.choice !== null && tg.traps[st.choice] && window.TRAPS[tg.traps[st.choice]]) {
          lines.push('That wrong answer is an example of this trap type: ' + window.TRAPS[tg.traps[st.choice]].name +
            ' -- ' + window.TRAPS[tg.traps[st.choice]].tell);
        }
      }
      lines.push('The explanation the student already read: ' + q.steps.map(stripTags).join(' '));
      return lines.join('\n');
    }

    function mdLite(t) {
      return esc(t)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .split(/\n\n+/).map(function (p) { return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
    }

    function askTutor(task, prompt, context) {
      var box = document.getElementById('ai-thread');
      if (box) {
        box.innerHTML += '<div class="ai-you">' + esc(prompt) + '</div>' +
        '<div class="ai-wait" id="ai-wait">Thinking\u2026</div>';
        box.scrollTop = box.scrollHeight;
      }
      window.Cloud.ask(task, prompt, context).then(function (r) {
          var w = document.getElementById('ai-wait');
          if (w) {
            w.outerHTML = '<div class="ai-answer">' + mdLite(r.text) +
            '<div class="ai-meta">' + esc(r.model) +
            (r.remaining !== undefined ? ' \u00b7 ' + r.remaining + ' left today' : '') + '</div></div>';
          }
          var b2 = document.getElementById('ai-thread'); if (b2) b2.scrollTop = b2.scrollHeight;
      }).catch(function (e) {
          var w = document.getElementById('ai-wait');
          if (w) w.outerHTML = '<div class="ai-err">' + esc(e.message || 'The tutor could not answer.') + '</div>';
      });
    }



    /* ============================================================
       STRATEGY CARDS
       The moves have to be available under time pressure, which means
       recall practice, not rereading. Spaced repetition on a Leitner
       schedule: get one right and it comes back later, miss it and it
       comes back soon.

       The tone here is deliberately warm. Missing a card is the normal
       case and the point of the exercise, so nothing scolds.
       ============================================================ */
    var CKEY = 'decoy.cards.v1';
    var BOX_DAYS = { 1: 0, 2: 1, 3: 3, 4: 7, 5: 21 };
    var cards = { current: null, revealed: false, done: 0, streak: 0, justAdvanced: null };

    function cardState() {
      try { return JSON.parse(localStorage.getItem(CKEY)) || {}; } catch (e) { return {}; }
    }
    function saveCardState(d) {
      try { localStorage.setItem(CKEY, JSON.stringify(d)); } catch (e) {}
    }

    /* Which skills actually use this move, so the prompt is a real situation
       rather than an abstract definition. */
    function skillsForStrat(id) {
      var out = [];
      window.RW_BANK.concat(window.MATH_BANK).forEach(function (q) {
        if (window.tagsFor(q).strat !== id && !(window.SKILL_STRAT[q.skill] === id)) return;
        if (window.tagsFor(q).strat !== id) return;
        if (out.indexOf(q.skill) < 0) out.push(q.skill);
      });
      return out;
    }

    function cardDeck() {
      var st = cardState();
      var now = Date.now();
      return Object.keys(window.STRATS).map(function (id) {
        var c = st[id] || { box: 1, due: 0, seen: 0, right: 0 };
        return {
          id: id, box: c.box, due: c.due, seen: c.seen, right: c.right,
          isDue: !c.due || c.due <= now,
          locked: c.box >= 4
        };
      });
    }

    function dueCards() {
      return cardDeck().filter(function (c) { return c.isDue; })
        .sort(function (a, b) { return a.box - b.box; });
    }

    function lockedCount() {
      return cardDeck().filter(function (c) { return c.locked; }).length;
    }

    function cardsHTML() {
      var deck = cardDeck();
      var due = dueCards();
      var locked = lockedCount();
      var total = deck.length;
      var pct = Math.round(100 * locked / total);

      var h = '<div class="home"><div class="home-head"><div><div class="brand">Strategy cards</div>' +
        '<div class="tagline">Quick recall, so the moves are there when the clock is running. ' +
        'A few minutes beats an hour of rereading.</div></div>' +
        '<button class="btn subtle sm" onclick="APP.go(\'home\')">Back</button></div><div class="home-hr"></div>';

      /* progress, framed as how far along rather than how far short */
      h += '<div class="prog-wrap"><div class="ring" style="--pct:' + pct + '">' +
        '<div class="ring-in"><div class="ring-n">' + locked + '</div>' +
        '<div class="ring-of">of ' + total + '</div></div></div>' +
        '<div class="prog-text"><h3>' + progressLine(locked, total) + '</h3>' +
        '<p>A move counts as locked in once you have recalled it correctly a few times, spread out over days. ' +
        'That spacing is what makes it stick.</p>';
      if (cards.done) h += '<p class="prog-run">' + cards.done + ' reviewed just now' +
        (cards.streak > 1 ? ', ' + cards.streak + ' in a row' : '') + '.</p>';
      h += '</div></div>';

      if (!cards.current) {
        if (!due.length) {
          h += '<div class="card cheer"><h3>Nothing due right now</h3>' +
            '<p>Everything you have reviewed is still holding. Come back tomorrow and the ones that are ' +
            'starting to fade will be waiting. In the meantime, the useful thing is questions.</p>' +
            '<div class="card-actions"><button class="btn" onclick="APP.quickMix()">Do a 10-question set</button>' +
            '<button class="btn ghost" onclick="APP.cardsCram()">Review anyway</button></div></div>';
        } else {
          h += '<div class="card cheer"><h3>' + due.length + ' card' + (due.length === 1 ? '' : 's') + ' ready</h3>' +
            '<p>' + (locked === 0
              ? 'First time through. You are not expected to know these yet, so guess freely and let the app sort out what needs repeating.'
              : 'Some of these you will get instantly. Those are the ones that are working.') + '</p>' +
            '<div class="card-actions"><button class="btn" onclick="APP.cardsStart()">Start</button></div></div>';
        }
      } else {
        var meta = window.STRATS[cards.current.id];
        var sk = skillsForStrat(cards.current.id);
        var where = sk.length ? sk.slice(0, 2).join(' or ') : (meta.section === 'rw' ? 'Reading and Writing' : 'Math');
        h += '<div class="flash">';
        h += '<div class="flash-cue">You are on a <strong>' + esc(where) + '</strong> question.</div>';
        h += '<div class="flash-ask">What is the move?</div>';
        if (!cards.revealed) {
          h += '<div class="card-actions" style="justify-content:center;margin-top:26px">' +
            '<button class="btn big" style="max-width:280px" onclick="APP.cardsReveal()">Show me</button></div>' +
            '<p class="flash-hint">Say it out loud first, even roughly. Trying to retrieve it is what builds the habit; ' +
            'reading it again does not.</p>';
        } else {
          h += '<div class="flash-answer"><div class="fa-name">' + meta.name + '</div>' +
            '<p class="fa-move">' + meta.move + '</p>' +
            '<p class="fa-why">' + meta.why + '</p></div>';
          h += '<div class="flash-rate"><div class="fr-q">How did that go?</div>' +
            '<button class="fr-btn good" onclick="APP.cardsRate(\'good\')">I had it</button>' +
            '<button class="fr-btn mid" onclick="APP.cardsRate(\'mid\')">Nearly</button>' +
            '<button class="fr-btn no" onclick="APP.cardsRate(\'no\')">Not yet</button></div>';
          h += '<p class="flash-hint">Answer honestly. Marking something you half-knew as \u201chad it\u201d just means ' +
            'it comes back too late to help.</p>';
        }
        h += '</div>';
        if (cards.justAdvanced) {
          h += '<div class="cheer-toast">' + cards.justAdvanced + '</div>';
        }
      }

      /* the whole deck, so progress is visible rather than hidden in a counter */
      h += '<div class="section-title">Your deck</div><div class="card">';
      ['rw', 'math'].forEach(function (sec) {
        h += '<div class="deck-sec">' + (sec === 'rw' ? 'Reading and Writing' : 'Math') + '</div>';
        deck.filter(function (c) { return window.STRATS[c.id].section === sec; }).forEach(function (c) {
          var meta = window.STRATS[c.id];
          h += '<div class="deck-row"><div>' + meta.name + '</div>' +
            '<div class="boxes">' + [1, 2, 3, 4, 5].map(function (b) {
              return '<span class="bx' + (c.box >= b ? ' on' : '') + (c.locked && b <= c.box ? ' lock' : '') + '"></span>';
            }).join('') + '</div>' +
            '<div class="n">' + (c.locked ? 'locked in' : c.seen ? 'learning' : 'new') + '</div></div>';
        });
      });
      h += '</div></div>';
      return h;
    }

    function progressLine(locked, total) {
      if (locked === 0) return 'Let us find out what you already know';
      if (locked === total) return 'All ' + total + ' moves locked in';
      if (locked < 5) return locked + ' moves locked in, and that is a start';
      if (locked < total / 2) return locked + ' locked in, keep going';
      if (locked < total - 3) return 'Over halfway: ' + locked + ' of ' + total;
      return 'Nearly there, ' + (total - locked) + ' to go';
    }

        '<p>A blank and a wrong answer score the same, so a blank is strictly worse than a guess. Knowing that, ' +

      h += '<div class="section-title">What you learn here</div>';
      h += '<div class="card"><div class="two-col">' +
        '<div><h3>' + Object.keys(window.STRATS).length + ' strategies</h3><p>One named move per question type. Predict before you read the choices. ' +

      var h = '<div class="home"><div class="home-head"><div><div class="brand">Log a practice test</div>' +

        h += '<div class="card"><h3>Which test?</h3>' +
          '<label class="fld"><span>Name it however you like</span>' +
          '<input id="log-source" placeholder="Bluebook Practice Test 4" value="' + esc(log.source) + '"></label>' +
          '<label class="fld"><span>Which section were these misses in?</span></label>' +

          '<div class="tile spot"><div class="t-lbl">Ran out of time</div><div class="t-val">' + rushed +
          '</div><div class="t-sub">a pacing problem, not a knowledge one</div></div>' +

            '<span class="lo-name">' + t.name + '</span></button>';
        });
        h += '<button class="log-opt wide alt" onclick="APP.logCause(\'rushed\')">' +
          '<span class="lo-felt">I ran out of time and guessed</span>' +
          '<span class="lo-name">pacing, not a trap</span></button>';
        h += '<button class="log-opt wide alt" onclick="APP.logCause(\'gap\')">' +
          '<span class="lo-felt">I did not know how to do it at all</span>' +
          '<span class="lo-name">content gap, not a trap</span></button>';
        h += '</div>';
        if (!log.expanded) {
          h += '<div class="card-actions" style="margin-top:12px">' +
            '<button class="btn subtle sm" onclick="APP.logExpand()">None of these, show me all ' +
            Object.keys(window.TRAPS).length + '</button></div>';
        }
      }
      h += '</div>';
      h += '<div class="card-actions" style="margin-top:16px">' +
        '<button class="btn subtle sm" onclick="APP.logSkip()">Skip this one</button>' +
        (log.rows.length ? '<button class="btn ghost sm" onclick="APP.logFinish()">Stop here and see the summary</button>' : '') +
        '</div></div>';
      return h;
    }

    /* ============================================================
       DIRECTIONS / BREAK
       ============================================================ */

      var m = S.mod();
      var isRW = m.section === 'rw';
      var h = '<div class="exam"><div class="exam-top"><div><div class="sec-name">' + esc(m.label) + '</div>' +

      '<div class="dirs">';

        h += '<strong>Directions</strong><ul>' +
        '<li>The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which you should read before answering.</li>' +
        '<li>All questions are multiple choice with four answer choices. Each question has a single best answer.</li>' +
        '<li>There is no penalty for guessing, so answer every question.</li></ul>';
      } else {
        h += '<strong>Directions</strong><ul>' +
        '<li>Most questions are multiple choice. On the rest you type your answer straight in. Those are the student-produced response questions.</li>' +
        '<li>A calculator and the reference sheet are available for every question in this section, from the tools in the upper right.</li>' +
        '<li>For fill-in answers: no mixed numbers (enter 5/2, not 2 1/2), no symbols, and if an answer will not fit, give at least three digits, rounded or truncated.</li>' +
        '<li>There is no penalty for guessing, so answer every question.</li></ul>';

      h += '</div>';
      h += '<div class="dirs" style="background:var(--blue-soft);border-color:var(--blue)"><strong>Tools you can use, same as on test day</strong><ul>' +
      '<li><strong>Mark for Review</strong> flags a question so you can come back to it.</li>' +
      '<li><strong>ABC</strong> turns on the answer eliminator so you can cross out choices you have ruled out.</li>' +
      (isRW ? '<li><strong>Highlight</strong> marks up any text you have selected in the passage.</li>'
        : '<li><strong>Calculator</strong> and <strong>Reference</strong> are open as often as you like.</li>') +
      '<li>The <strong>question navigator</strong> at the bottom shows which questions are answered and which are flagged.</li></ul></div>';
      h += '<button class="btn" style="font-size:17px;padding:12px 34px" onclick="APP.beginModule()">Begin ' +
      (m.num === 2 ? 'Module 2' : 'this module') + '</button>';
      if (m.num === 2) {
        h += '<p class="note" style="margin-top:14px">Module 2 has been assembled at the <strong>' +
        (m.kind === 'hard' ? 'harder' : 'easier') + '</strong> difficulty, based on how Module 1 went. This is the adaptive step the real test takes.</p>';
      }
      h += '</div></div></div>';

    function breakHTML() {
      var m = S.mod();
      return '<div class="exam"><div class="exam-top"><div><div class="sec-name">Break</div>' +
      '<div class="sec-sub">Reading and Writing complete</div></div><div class="timer-wrap"></div><div class="tools"></div></div>' +
      '<div class="centered"><div class="box"><h2>Take a 10-minute break</h2>' +
      '<div class="bigtimer" id="timer">' + fmt(m.remaining) + '</div>' +

      '<div class="card-actions" style="justify-content:center;margin-top:22px">' +
      '<button class="btn" onclick="APP.skipBreak()">Resume testing now</button></div>' +
