    },

    coverageSummary: function () {
      var cov = this.coverage();
      function count(group, all) {
        var m = 0, l = 0;
        Object.keys(all).forEach(function (id) {
          var c = cov[group][id];
          if (!c) return;
          if (c.state === 'mastered') m++;
          else l++;
        });
        return { mastered: m, learning: l, total: Object.keys(all).length };
      }
      return {
        strats: count('strats', global.STRATS || {}),
        traps: count('traps', global.TRAPS || {})
      };
    },

    /* Days are the student's local calendar days, the same as Daily LockIn,
       so evening practice in the US is not filed under tomorrow. */
    streak: function () {
        var key = function (dt) {
          return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2);
        };
        var days = {};
        this.data().events.forEach(function (e) { if (e.t) days[key(new Date(e.t))] = true; });
        var n = 0, d = new Date();
        if (!days[key(d)]) { // today not done yet: start from yesterday
          d.setDate(d.getDate() - 1);
          if (!days[key(d)]) return 0;
        }
        while (days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
        return n;
      },

      answeredToday: function () {
        var t = new Date(), n = 0;
        this.data().events.forEach(function (e) {
            if (!e.t) return;
            var d = new Date(e.t);
            if (d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate()) n++;
        });
        return n;
      },

      /* Misses logged from an official practice test. Same event shape as
       everything else, so the diagnosis screens pick them up for free. */
    logMisses: function (session, rows) {
      var evs = rows.map(function (r, i) {
        return {
          key: 'log-' + session.id + '-' + i,
          attempt: 'log-' + session.id,
          kind: 'logged',
          source: session.label,
          t: new Date().toISOString(),
          qid: null,
          section: session.section,
          domain: r.domain || null,
          skill: r.skill || null,
          difficulty: null,
          strat: r.strat || null,
          trap: r.trap || null,
          cause: r.cause,
          correct: false,
          seconds: 0
        };
      });
      this.recordEvents(evs);
      return evs.length;
    },

    /* How the logged misses break down: trapped, rushed, or a content gap.
       Keeping those apart is the point, because they call for different work. */
    logSummary: function () {
      var out = { total: 0, trap: 0, rushed: 0, gap: 0, sessions: {} };
      this.data().events.forEach(function (e) {
        if (e.kind !== 'logged') return;
        out.total++;
        if (e.cause === 'rushed') out.rushed++;
        else if (e.cause === 'gap') out.gap++;
        else out.trap++;
        if (e.source) out.sessions[e.source] = (out.sessions[e.source] || 0) + 1;
      });
      return out;
    },

    seenCount: function () {
        var c = {};
        this.data().events.forEach(function (e) { c[e.qid] = (c[e.qid] || 0) + 1; });
        return c;
      }
    };


    global.SATP = {
      Session: Session, Store: Store, shuffle: shuffle, mulberry32: mulberry32,
      bankFor: bankFor
    };
    global.Store = Store;
})(window);

</script>
<script>
/* ============================================================
   DAILY LOCKIN
   One question a day, rotating through the strategies in order.

   Two properties matter more than cleverness here:

   1. It is the same question all day. Refreshing does not reroll it,
      because a daily that changes when you look away is not a daily.
   2. The rotation is a plain cycle over the moves, so over one pass
      every strategy comes up exactly once and a student can see that
      the app is working through the whole list rather than guessing.
      A student who picked a section gets that section's own cycle; it is
      still one daily question a day, so the streak counts either section.

   Everything is derived from the date, so nothing has to be scheduled
   and it works with the tab closed for a week.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- dates, in the student's own timezone ---------- */

  function localKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return y + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  /* Day count from a fixed local midnight. Built from the calendar date
     rather than from elapsed milliseconds so daylight saving cannot shift
     the rotation by a day. */
  function dayNumber(key) {
    var p = String(key).split('-');
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }

  function shiftKey(key, days) {
    var p = String(key).split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + days);
    return localKey(d);
  }

  /* A small deterministic hash, so the question chosen for a given day
     is the same on every device and every reload. */
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* ---------- the rotation ---------- */

  /* section: 'rw' | 'math', or nothing for both. */
  function sectionOf(s) { return s === 'rw' || s === 'math' ? s : ''; }
  var ORDER = {};
  function order(section) {
    var sec = sectionOf(section);
    if (!ORDER[sec]) {
      /* Habit strategies apply to every question rather than owning a set,
         so there is nothing to serve as a daily question for them. */
      ORDER[sec] = Object.keys(global.STRATS || {}).filter(function (id) {
          return !global.STRATS[id].meta && (!sec || global.STRATS[id].section === sec);
      });
    }
    return ORDER[sec];
  }

  function bank() {
    return (global.RW_BANK || []).concat(global.MATH_BANK || []);
  }

  var Daily = {
    /* ---------- state, kept inside the normal Store blob ---------- */

    all: function () {
      var d = global.Store.data();
      return (d.daily && typeof d.daily === 'object') ? d.daily : {};
    },

    _put: function (key, rec) {
      var d = global.Store.data();
      d.daily = (d.daily && typeof d.daily === 'object') ? d.daily : {};
      d.daily[key] = rec;
      /* One year of history is plenty and keeps the blob small. */
      var keys = Object.keys(d.daily).sort();
      if (keys.length > 400) {
        keys.slice(0, keys.length - 400).forEach(function (k) { delete d.daily[k]; });
      }
      global.Store._write(d);
    },

    todayKey: function () { return localKey(new Date()); },

    /* Which day of the rotation this is, 1-based, for display. */
    dayIndex: function (key, section) {
      var n = order(section).length;
      return (dayNumber(key || this.todayKey()) % n + n) % n + 1;
    },

    cycleLength: function (section) { return order(section).length; },

    stratFor: function (key, section) {
      var list = order(section);
      if (!list.length) return null;
      var n = dayNumber(key || this.todayKey());
      return list[((n % list.length) + list.length) % list.length];
    },

    /* Today's question. Stable for the whole day: once a question has been
       chosen for a date it is remembered, so a bank change mid-day cannot
       swap the question out from under a half-finished attempt. The one
       exception: a question claimed but not answered yet gives way when the
       student switches section, so the daily always matches their pick. */
    pick: function (key, section) {
      key = key || this.todayKey();
      var sec = sectionOf(section);
      var rec = this.all()[key];
      var strat = this.stratFor(key, sec);
      if (!strat) return null;

      var had = rec && rec.qid ? byId(rec.qid) : null;
      if (had && (rec.answered || !sec || had.section === sec)) {
        return { date: key, strat: rec.strat || strat, qid: rec.qid, done: !!rec.answered };
      }

      var pool = bank().filter(function (q) {
          return global.tagsFor(q).strat === strat && (!sec || q.section === sec);
      });
      if (!pool.length) return null;

      /* Prefer something she has never answered, then something no previous
         daily has used, then anything rather than nothing. */
      var seen = global.Store.seenCount();
      /* Questions named in a session count as seen too. */
      if (global.Spot) global.Spot.reps().forEach(function (r) { if (r.qid) seen[r.qid] = (seen[r.qid] || 0) + 1; });
      var usedByDaily = {};
      var hist = this.all();
      Object.keys(hist).forEach(function (k) { if (hist[k].qid) usedByDaily[hist[k].qid] = 1; });

      var tiers = [
        pool.filter(function (q) { return !seen[q.id] && !usedByDaily[q.id]; }),
        pool.filter(function (q) { return !usedByDaily[q.id]; }),
        pool
      ];
      var tier = tiers.filter(function (t) { return t.length; })[0];
      var q = tier[hash(key + '|' + strat) % tier.length];
      return { date: key, strat: strat, qid: q.id, done: false };
    },

    isDone: function (key) {
      var rec = this.all()[key || this.todayKey()];
      return !!(rec && rec.answered);
    },

    resultFor: function (key) {
      return this.all()[key || this.todayKey()] || null;
    },

    /* Remember the question as soon as it is served, so a reload mid-attempt
       does not hand her a different one. */
    claim: function (pickd) {
      if (!pickd) return;
      var existing = this.all()[pickd.date];
      if (existing && existing.qid === pickd.qid) return;
      this._put(pickd.date, { qid: pickd.qid, strat: pickd.strat, answered: false, correct: null });
    },

    record: function (key, qid, strat, correct) {
      this._put(key || this.todayKey(), {
          qid: qid, strat: strat, answered: true, correct: !!correct,
          at: new Date().toISOString()
      });
    },

    /* A day answered on another device, carried by a synced naming rep.
       Never overwrites a day already answered here. */
    restore: function (rep) {
      if (!rep || !/^\d{4}-\d{2}-\d{2}$/.test(String(rep.daily || ''))) return;
      var have = this.all()[rep.daily];
      if (have && have.answered) return;
      this._put(rep.daily, {
          qid: rep.qid, strat: rep.strat, answered: true, correct: !!rep.right, at: rep.t
      });
    },

    /* Consecutive days answered, counting back from today. Yesterday still
       counts as an unbroken streak until today is over. */
    streak: function () {
      var hist = this.all();
      var k = this.todayKey();
      if (!(hist[k] && hist[k].answered)) k = shiftKey(k, -1);
      var n = 0;
      while (hist[k] && hist[k].answered) { n++; k = shiftKey(k, -1); }
      return n;
    },

    answeredCount: function () {
      var hist = this.all();
      return Object.keys(hist).filter(function (k) { return hist[k].answered; }).length;
    },

    /* The last n days, oldest first, for the little strip on the home screen. */
    recent: function (n) {
      var hist = this.all();
      var out = [];
      for (var i = n - 1; i >= 0; i--) {
        var k = shiftKey(this.todayKey(), -i);
        var rec = hist[k];
        out.push({
            date: k,
            today: i === 0,
            answered: !!(rec && rec.answered),
            correct: rec && rec.answered ? !!rec.correct : null
        });
      }
      return out;
    }
  };

  function byId(id) {
    var all = bank();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  Daily.question = byId;
  global.Daily = Daily;
})(window);

</script>
<script>
/* ============================================================
   NAME THE MOVE

   On test day nobody tells you which strategy a question wants. Every
   other surface in the app names the move first and then hands over a
   question, which trains the move but never the recognition. This is the
   recognition half: read the question, name the move, then work it.

   The hard part is fairness. Reading and Writing question types are
   pinned down by their wording, so any other strategy from that section
   makes an honest wrong option. Math is not like that: a radical
   equation can be graphed, solved by hand, or back-solved from the
   choices, and a student who names any of those is not wrong. So in math
   the wrong options always come from a different family of problems
   (algebra, data, geometry), never from the question's own family, never
   a universal tool, and never a known look-alike. That makes math
   recognition coarser than reading, and it is the honest version.

   Pure logic and storage, no DOM, so scripts/verify.js can exercise it.
   ============================================================ */
(function (global) {
  'use strict';

  var KEY = 'lockin.spot.v1';
  var RECENT_MAX = 60;
  var REPS_MAX = 5000;
  var MEMO = null;   // { raw, out }: data() for the stored log as it last was

  /* Moves that apply to nearly every math question. Never offered as a
     wrong option, because they are never really wrong. */
  var UNIVERSAL = { 'desmos-first': 1, 'choice-tactics': 1 };

  function mathFamily(domain) {
    var d = String(domain || '').toLowerCase();
    if (d.indexOf('geometry') >= 0) return 'geometry';
    if (d.indexOf('data') >= 0) return 'data';
    return 'algebra';
  }

  function bank() {
    return (global.RW_BANK || []).concat(global.MATH_BANK || []);
  }

  function stratOf(q) { return global.tagsFor(q).strat; }

  function usable(q) {
    var s = stratOf(q);
    return !!(s && global.STRATS[s] && !global.STRATS[s].meta && q.steps && q.steps.length);
  }

  /* Where each strategy lives: the domain most of its questions sit in, and
     for math the family that domain belongs to. */
  var HOME = null;
  function homes() {
    if (!HOME) {
      var tally = {};
      bank().forEach(function (q) {
          var s = stratOf(q);
          if (!s) return;
          tally[s] = tally[s] || {};
          tally[s][q.domain] = (tally[s][q.domain] || 0) + 1;
      });
      HOME = {};
      Object.keys(tally).forEach(function (s) {
          HOME[s] = Object.keys(tally[s]).sort(function (a, b) { return tally[s][b] - tally[s][a]; })[0];
      });
    }
    return HOME;
  }
  function homeDomain(stratId) { return homes()[stratId] || null; }
  function homeFamily(stratId) {
    var d = homeDomain(stratId);
    return d ? mathFamily(d) : null;
  }

  function shuffle(arr, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function lookAlikes(id) {
    var out = [];
    Object.keys(global.STRAT_VS || {}).forEach(function (k) {
        var p = k.split('|');
        if (p[0] === id) out.push(p[1]);
        else if (p[1] === id) out.push(p[0]);
    });
    return out;
  }

  /* The ids that may be offered as wrong options for this question. */
  function distractorPool(q) {
    var right = stratOf(q);
    var ids = Object.keys(global.STRATS).filter(function (id) {
        var s = global.STRATS[id];
        return id !== right && !s.meta && s.section === q.section;
    });
    if (q.section !== 'math') return ids;
    var fam = mathFamily(q.domain);
    var near = lookAlikes(right);
    return ids.filter(function (id) {
        return !UNIVERSAL[id] && near.indexOf(id) < 0 && homeFamily(id) !== fam;
    });
  }

  var Spot = {
    UNIVERSAL: UNIVERSAL,
    mathFamily: mathFamily,
    distractorPool: distractorPool,

    /* ---------- storage ----------
       The unit of record is one rep: one question, the move it wanted, the
       move the student named. Each rep has its own key, so two devices can
       merge their logs without double counting, and the per-move totals and
       the confusion pairs are always derived from the log, never stored. */
    _raw: function () {
      try { return global.localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
    },
    _read: function () {
      var d = null;
      try { d = JSON.parse(this._raw()); } catch (e) {}
      d = d || {};
      d.reps = Array.isArray(d.reps) ? d.reps : [];
      return d;
    },
    _write: function (d) {
      MEMO = null;
      try { global.localStorage.setItem(KEY, JSON.stringify({ reps: d.reps })); } catch (e) {}
    },
    reset: function () { this._write({ reps: [] }); },

    reps: function () { return this._read().reps; },

    /* Totals per move, confusion pairs, and recently seen questions.
       The Strategies list asks once per row, so the result is kept until
       the stored log changes (here, or in another tab). */
    data: function () {
      var raw = this._raw();
      if (MEMO && MEMO.raw === raw) return MEMO.out;
      var out = this._derive();
      MEMO = { raw: raw, out: out };
      return out;
    },
    _derive: function () {
      var out = { strats: {}, confusions: {}, recent: [] };
      this._read().reps.forEach(function (r) {
          var s = out.strats[r.strat] || (out.strats[r.strat] = { seen: 0, right: 0 });
          s.seen++;
          if (r.right) s.right++;
          if (!s.last || r.t > s.last) s.last = r.t;
          if (r.picked && !r.right) {
            var k = r.strat + '>' + r.picked;
            out.confusions[k] = (out.confusions[k] || 0) + 1;
          }
          if (r.qid && r.qid !== 'pasted') {
            out.recent = out.recent.filter(function (id) { return id !== r.qid; });
            out.recent.push(r.qid);
          }
      });
      out.recent = out.recent.slice(-RECENT_MAX);
      return out;
    },

    /* Adds reps from another device. Returns how many were new. */
    merge: function (incoming) {
      var d = this._read();
      var have = {};
      d.reps.forEach(function (r) { have[r.k] = 1; });
      var added = 0;
      (incoming || []).forEach(function (r) {
          if (!r || !r.k || have[r.k] || !r.strat) return;
          have[r.k] = 1;
          d.reps.push({ k: r.k, t: r.t, qid: r.qid || null, strat: r.strat,
            picked: r.picked || null, right: !!r.right, daily: r.daily || null });
          added++;
      });
      if (added) {
        d.reps.sort(function (a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; });
        d.reps = d.reps.slice(-REPS_MAX);
        this._write(d);
      }
      return added;
    },

    /* ---------- the four options for one question ---------- */
    options: function (q, rnd) {
      rnd = rnd || Math.random;
      var right = stratOf(q);
      var pool = distractorPool(q);
      /* In reading, a look-alike is the most useful wrong option, because
         telling the pair apart is exactly the skill. */
      var picks = [];
      var add = function (id) { if (picks.length < 3 && picks.indexOf(id) < 0) picks.push(id); };
      if (q.section !== 'math') {
        shuffle(lookAlikes(right).filter(function (id) { return pool.indexOf(id) >= 0; }), rnd)
          .slice(0, 2).forEach(add);
        /* Then neighbors from the same domain: telling apart two conventions
           rules is the skill, ruling out a data move on a comma question is not. */
        shuffle(pool.filter(function (id) { return homeDomain(id) === q.domain; }), rnd).forEach(add);
      }
      shuffle(pool, rnd).forEach(add);
      return shuffle([right].concat(picks), rnd);
    },

    /* ---------- building a round ----------
       opts.section: 'rw' | 'math' | undefined for mixed
       opts.focus:   a strategy id, to drill one move against its look-alikes
       opts.qids:    exact question ids, in order (Daily LockIn uses one)
       opts.count:   default 8 */
    build: function (opts, rnd) {
      opts = opts || {};
      rnd = rnd || Math.random;
      var self = this;
      var count = opts.count || 8;
      var all = bank().filter(usable);
      var chosen = [];

      if (opts.qids) {
        opts.qids.forEach(function (id) {
            var q = all.filter(function (x) { return x.id === id; })[0];
            /* An exact id can name a question no longer in the banks (a pool
               question retired after its session was prepared). */
            if (!q && global.questionById) { q = global.questionById(id); if (q && !usable(q)) q = null; }
            if (q) chosen.push(q);
        });
      } else {
        var d = this.data();
        var recent = {};
        d.recent.forEach(function (id) { recent[id] = 1; });
        var pool = all.filter(function (q) { return !opts.section || q.section === opts.section; });

        var strats;
        if (opts.focus) {
          var near = lookAlikes(opts.focus).filter(function (id) { return !global.STRATS[id].meta; });
          var mates = Object.keys(global.STRATS).filter(function (id) {
              return id !== opts.focus && !global.STRATS[id].meta &&
                global.STRATS[id].section === global.STRATS[opts.focus].section && near.indexOf(id) < 0;
          });
          var half = Math.ceil(count / 2);
          strats = [];
          for (var i = 0; i < half; i++) strats.push(opts.focus);
          strats = strats.concat(shuffle(near, rnd), shuffle(mates, rnd)).slice(0, count);
        } else {
          /* Unseen moves first, then the ones named least reliably, with a
             little noise so two rounds in a row are not identical. */
          var have = {};
          pool.forEach(function (q) { have[stratOf(q)] = 1; });
          strats = Object.keys(have).map(function (id) {
              var s = d.strats[id] || { seen: 0, right: 0 };
              var acc = (s.right + 1) / (s.seen + 2);
              return { id: id, key: (s.seen ? 1 : 0) + acc + rnd() * 0.25 };
          }).sort(function (a, b) { return a.key - b.key; })
            .slice(0, count).map(function (x) { return x.id; });
        }

        var used = {};
        strats.forEach(function (sid) {
            var cands = pool.filter(function (q) { return stratOf(q) === sid && !used[q.id]; });
            var fresh = cands.filter(function (q) { return !recent[q.id]; });
            var list = shuffle(fresh.length ? fresh : cands, rnd);
            if (list.length) { used[list[0].id] = 1; chosen.push(list[0]); }
        });
        chosen = shuffle(chosen, rnd);
      }

      return {
        items: chosen.map(function (q) {
            return { qid: q.id, strat: stratOf(q), options: self.options(q, rnd), picked: null, right: null };
        }),
        i: 0,
        opts: opts
      };
    },

    /* ---------- recording an answer ----------
       picked is a strategy id, or null for "I do not know". daily is the
       Daily LockIn date when this rep was the day's question, so the streak
       can follow a signed-in student to another device. */
    record: function (item, picked, daily) {
      item.picked = picked;
      item.right = picked === item.strat;
      var t = new Date().toISOString();
      var rep = {
        k: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        t: t, qid: item.qid || null, strat: item.strat,
        picked: picked || null, right: item.right, daily: daily || null
      };
      var d = this._read();
      d.reps.push(rep);
      d.reps = d.reps.slice(-REPS_MAX);
      this._write(d);
      if (global.Cloud && global.Cloud.pushNaming) global.Cloud.pushNaming([rep]);
      return item.right;
    },

    /* ---------- reading the record back ---------- */
    statFor: function (id) {
      return this.data().strats[id] || null;
    },

    /* Moves named reliably: seen at least three times, and the last
       pattern holds at 80 percent or better. */
    summary: function () {
      var d = this.data();
      var ids = Object.keys(global.STRATS).filter(function (id) { return !global.STRATS[id].meta; });
      var seen = 0, solid = 0;
      ids.forEach(function (id) {
          var s = d.strats[id];
          if (!s || !s.seen) return;
          seen++;
          if (s.seen >= 3 && s.right / s.seen >= 0.8) solid++;
      });
      return { total: ids.length, seen: seen, solid: solid };
    },

    /* "You read X as Y" pairs, most frequent first, with the tell-apart. */
    confusions: function (n) {
      var d = this.data();
      return Object.keys(d.confusions).map(function (k) {
          var p = k.split('>');
          return { strat: p[0], as: p[1], n: d.confusions[k], vs: global.stratVs ? global.stratVs(p[0], p[1]) : null };
      }).filter(function (c) { return global.STRATS[c.strat] && global.STRATS[c.as]; })
        .sort(function (a, b) { return b.n - a.n; })
        .slice(0, n || 5);
    }
  };

  global.Spot = Spot;
})(window);

</script>
<script>
/* ============================================================
   SAT LockIn: accounts, sync, and the AI tutor (browser side)

   Talks to this app's own API, served by server.js and backed by Postgres.
   No third party service and no SDK: plain fetch, so the app stays a folder
   of files you can double-click.

   Offline first by design. Local storage is the source of truth for the
   student in front of the screen and the server is a mirror. If the network
   is down, or there is no database, everything still works and nothing is
   lost. Unsynced rows queue up and go out later.

   Zero configuration: on boot the app asks the server what it supports. Open
   index.html from disk and there is no server, so it stays offline. Deploy it
   with a database attached and accounts appear on their own.
   ============================================================ */
(function (global) {
  'use strict';

  var CFG = global.CONFIG || {};
  var API = (CFG.apiUrl || '').replace(/\/+$/, '');
  var SKEY = 'decoy.session.v2';
  var QKEY = 'decoy.queue.v2';
  var FKEY = 'lockin.feedback.v1';

  var Cloud = {
    enabled: false,      // set true once the server reports a working database
    aiEnabled: false,    // set true once the server reports a tutor key
    session: null,       // { token, user }
    profile: null,       // { id, email, display_name, paid }
    lastError: null,
    ready: false,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function () {
      this.listeners.forEach(function (f) { try { f(); } catch (e) {} });
    },

    /* ---------------- plumbing ---------------- */
    url: function (p) { return API + p; },

    saveSession: function (s) {
      this.session = s;
      this.profile = s ? s.user : null;
      try {
        if (s) localStorage.setItem(SKEY, JSON.stringify(s));
        else localStorage.removeItem(SKEY);
      } catch (e) {}
    },

    loadSession: function () {
      try {
        var s = JSON.parse(localStorage.getItem(SKEY));
        if (s && s.token) { this.session = s; this.profile = s.user || null; }
      } catch (e) {}
    },

    signedIn: function () { return !!(this.session && this.session.token); },

    post: function (path, body, opts) {
      var self = this;
      var headers = { 'Content-Type': 'application/json' };
      if (this.signedIn()) headers.Authorization = 'Bearer ' + this.session.token;
      return fetch(this.url(path), {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body || {})
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401 && self.signedIn() && !(opts && opts.noLogout)) {
            self.saveSession(null);
            self.emit();
          }
          if (!r.ok || d.error) {
            var err = new Error(d.error || 'That did not work.');
            err.status = r.status;
            err.purchase = !!d.purchase;
            throw err;
          }
          return d;
        });
      });
    },

    /* ---------------- what does this server support? ---------------- */
    probe: function () {
      var self = this;
      /* Opened straight from disk with no API configured, there is no server
         to ask. Skip the request rather than log a CORS error every load. */
      if (global.location && global.location.protocol === 'file:' && !CFG.apiUrl) {
        self.ready = true;
        self.emit();
        return Promise.resolve(false);
      }
      return fetch(this.url('/healthz'), { method: 'GET' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          self.ready = true;
          if (!d) return false;
          self.enabled = !!d.accounts;
          self.aiEnabled = !!(d.tutor && d.accounts) || !!(d.tutor && CFG.allowAnonTutor);
          self.mail = !!d.mail;
          self.payments = !!d.payments;
          self.coach = !!d.coach;
          if (self.enabled && self.signedIn()) {
            return self.afterSignIn().then(function () { return true; });
          }
          self.emit();
          return true;
        })
        .catch(function () { self.ready = true; return false; });
    },

    /* ---------------- sign in ---------------- */
    sendCode: function (email) {
      return this.post('/api/auth/request', { email: email });
    },

    verifyCode: function (email, code) {
      var self = this;
      return this.post('/api/auth/verify', { email: email, code: code }, { noLogout: true })
        .then(function (d) {
          self.saveSession({ token: d.token, user: d.user });
          return self.afterSignIn();
        });
    },

    signOut: function () {
      var self = this;
      var p = this.signedIn() ? this.post('/api/auth/signout', {}).catch(function () {}) : Promise.resolve();
      return p.then(function () { self.saveSession(null); self.emit(); });
    },

    afterSignIn: function () {
      var self = this;
      return this.pullAll()
        .then(function () { return self.flushQueue(); })
        .then(function () { self.emit(); return true; });
    },

    /* ---------------- profile ---------------- */
    updateProfile: function (patch) {
      var self = this;
      return this.post('/api/me/update', patch).then(function (d) {
        self.profile = d.user;
        if (self.session) { self.session.user = d.user; self.saveSession(self.session); }
        self.emit();
        return d.user;
      });
    },

    /* Has this account paid? Only the server can say, and only a signed
       webhook from the payment provider can make it true. */
    paid: function () { return !!(this.profile && this.profile.paid); },

    /* ---------------- outbound sync ---------------- */
    queue: function (kind, rows) {
      try {
        var q = this.readQueue();
        q[kind] = (q[kind] || []).concat(rows);
        if (q.events.length > 4000) q.events = q.events.slice(-4000);
        localStorage.setItem(QKEY, JSON.stringify(q));
      } catch (e) {}
    },
    readQueue: function () {
      var q = null;
      try { q = JSON.parse(localStorage.getItem(QKEY)); } catch (e) {}
      q = q || {};
      ['events', 'attempts', 'generated', 'naming'].forEach(function (k) { q[k] = q[k] || []; });
      return q;
    },
    clearQueue: function () { try { localStorage.removeItem(QKEY); } catch (e) {} },

    pushEvents: function (list) {
      var self = this;
      var real = (list || []).filter(function (e) {
        return e.correct !== null && e.correct !== undefined;
      });
      if (!real.length) return;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/sync/events', { events: real }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('events', real);
      });
    },

    pushAttempt: function (a) {
      var self = this;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/sync/attempt', { attempt: a }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('attempts', [a]);
      });
    },

    pushNaming: function (reps) {
      var self = this;
      if (!reps || !reps.length) return;
      if (!this.enabled || !this.signedIn()) return;
      this.post('/api/sync/naming', { reps: reps }).catch(function (err) {
        self.lastError = String(err.message || err);
        self.queue('naming', reps);
      });
    },

    /* ---------------- feedback ----------------
       A student's thumbs up or down on a question, and which move helped
       most in a session. Kept on this device in its own store (not the sync
       queue, which a successful flush clears whole) until the server says
       saved or dropped. "retry" means send again later: usually the answer
       itself has not reached the server yet.
       One store per account, so a second student on the same browser never
       sees, or sends, the first one's votes. */
    _fkey: function () {
      var u = this.session && this.session.user;
      return u && u.id ? FKEY + ':' + u.id : null;
    },
    feedbackData: function (key) {
      key = key || this._fkey();
      var d = null;
      if (key) { try { d = JSON.parse(localStorage.getItem(key)); } catch (e) {} }
      d = d && typeof d === 'object' ? d : {};
      d.q = d.q || {}; d.m = d.m || {};
      return d;
    },
    _writeFeedback: function (d, key) {
      key = key || this._fkey();
      if (!key) return;
      /* Bounded: past 600, the oldest votes the server already has go.
         A vote not yet sent is never dropped. */
      ['q', 'm'].forEach(function (k) {
        var sent = Object.keys(d[k]).filter(function (x) { return d[k][x].sent; });
        var over = Object.keys(d[k]).length - 600;
        if (over > 0) {
          sent.sort(function (a, b) { return d[k][a].t < d[k][b].t ? -1 : 1; })
            .slice(0, over).forEach(function (x) { delete d[k][x]; });
        }
      });
      try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {}
    },
    questionVote: function (qid) { var v = this.feedbackData().q[qid]; return v && v.r ? v : null; },
    moveVote: function (sid) { var v = this.feedbackData().m[sid]; return v && v.s ? v.s : null; },
    /* r: 1, -1, or 0 to clear. why: a reason for a thumbs down, or null. */
    rateQuestion: function (qid, r, why) {
      this._fbTries = 0;   // a new tap gets a fresh set of retries
      var d = this.feedbackData();
      d.q[qid] = { r: r, why: r === -1 ? (why || null) : null, t: new Date().toISOString(), sent: false };
      this._writeFeedback(d);
      this._soonFeedback(1500);
    },
    /* strat '' clears the vote. */
    rateMove: function (sid, strat) {
      this._fbTries = 0;
      var d = this.feedbackData();
      d.m[sid] = { s: strat || '', t: new Date().toISOString(), sent: false };
      this._writeFeedback(d);
      this._soonFeedback(1500);
    },
    _soonFeedback: function (ms) {
      var self = this;
      clearTimeout(this._fbTimer);
      this._fbTimer = setTimeout(function () { self.flushFeedback(); }, ms);
    },
    flushFeedback: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      /* One request at a time; a tap made meanwhile gets its own pass after. */
      if (this._fbBusy) { this._fbAgain = true; return this._fbBusy; }
      var key = this._fkey();
      var d = this.feedbackData(key);
      var qs = Object.keys(d.q).filter(function (k) { return !d.q[k].sent; }).slice(0, 100);
      var ms = Object.keys(d.m).filter(function (k) { return !d.m[k].sent; }).slice(0, 100);
      if (!qs.length && !ms.length) return Promise.resolve();
      var sentAt = {};
      qs.forEach(function (k) { sentAt['q' + k] = d.q[k].t; });
      ms.forEach(function (k) { sentAt['m' + k] = d.m[k].t; });
      this._fbBusy = this.post('/api/feedback', {
        questions: qs.map(function (k) { return { qid: k, rating: d.q[k].r, reason: d.q[k].why, t: d.q[k].t }; }),
        moves: ms.map(function (k) { return { session: k, strat: d.m[k].s, t: d.m[k].t }; })
      }).then(function (res) {
        /* Re-read: a tap made while this was in flight must not be marked sent. */
        var now = self.feedbackData(key);
        var again = false;
        function settle(group, key, status) {
          var v = now[group][key];
          if (!v || v.t !== sentAt[group + key]) return;
          if (status === 'saved' || status === 'dropped') v.sent = true;
          else again = true;
        }
        qs.forEach(function (k) { settle('q', k, (res.questions || {})[k]); });
        ms.forEach(function (k) { settle('m', k, (res.moves || {})[k]); });
        self._writeFeedback(now, key);
        if (again && (self._fbTries = (self._fbTries || 0) + 1) <= 3) self._soonFeedback(8000 * self._fbTries);
        else if (!again) self._fbTries = 0;
      }).catch(function (err) { self.lastError = String(err.message || err); })
        .then(function () {
          self._fbBusy = null;
          if (self._fbAgain) { self._fbAgain = false; self.flushFeedback(); }
        });
      return this._fbBusy;
    },

    flushQueue: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      /* After this flush's events land, so a vote's answer is already there.
         Not waited on: the coach waits for this flush, and should not also
         wait for feedback. */
      var after = function () { self._fbTries = 0; self.flushFeedback(); };
      return this._flushQueue().then(after, after);
    },
    _flushQueue: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      var q = this.readQueue();
      /* Naming reps made while signed out were never queued, so send the
         whole local log on every flush. The server skips keys it already
         has, so this is cheap and makes the first sign-in on a device carry
         that device's history up. */
      var reps = global.Spot ? global.Spot.reps() : q.naming;
      if (!q.events.length && !q.attempts.length && !reps.length) return Promise.resolve();
      var jobs = [];
      for (var i = 0; i < reps.length; i += 2000) {
        jobs.push(this.post('/api/sync/naming', { reps: reps.slice(i, i + 2000) }));
      }
      if (q.events.length) jobs.push(this.post('/api/sync/events', { events: q.events }));
      (q.attempts || []).forEach(function (a) {
        jobs.push(self.post('/api/sync/attempt', { attempt: a }));
      });
      return Promise.all(jobs).then(function () { self.clearQueue(); })
        .catch(function (err) { self.lastError = String(err.message || err); });
    },

    /* ---------------- inbound sync ---------------- */
    pullAll: function () {
      var self = this;
      if (!this.enabled || !this.signedIn()) return Promise.resolve();
      return this.post('/api/sync/pull', {}).then(function (d) {
        var store = global.Store.data();
        var have = {};
        store.events.forEach(function (e) { have[e.key] = true; });
        (d.events || []).forEach(function (row) {
          if (have[row.key]) return;
          store.events.push({
            key: row.key, attempt: row.attempt, t: row.t, qid: row.qid,
            section: row.section, domain: row.domain, skill: row.skill,
            difficulty: row.difficulty, strat: row.strat, trap: row.trap,
            correct: row.correct, seconds: row.seconds, hints: row.hints
          });
        });
        store.events.sort(function (a, b) { return (a.t < b.t) ? -1 : 1; });

        var seen = {};
        store.attempts.forEach(function (a) { seen[a.id] = true; });
        (d.attempts || []).forEach(function (a) { if (a && !seen[a.id]) store.attempts.push(a); });
        store.attempts.sort(function (a, b) { return (a.finishedAt < b.finishedAt) ? 1 : -1; });

        if (Array.isArray(d.retired_pool)) self.retiredPool = d.retired_pool;
        if (d.user && d.user.display_name) store.name = d.user.display_name;
        if (d.user) {
          self.profile = d.user;
          if (self.session) { self.session.user = d.user; self.saveSession(self.session); }
        }
        global.Store._write(store);

        /* The naming record, and the Daily LockIn days it carries. */
        if ((d.naming || []).length && global.Spot) {
          global.Spot.merge(d.naming);
          if (global.Daily && global.Daily.restore) {
            d.naming.forEach(function (r) { if (r.daily) global.Daily.restore(r); });
          }
        }

        return true;
      }).catch(function (err) { self.lastError = String(err.message || err); });
    },


    /* ---------------- AI tutor ---------------- */
    ask: function (task, prompt, context, model) {
      if (!this.aiEnabled) return Promise.reject(new Error('The AI tutor is not switched on for this server.'));
      var chosen = model || (CFG.aiModels && CFG.aiModels[task]) || 'claude-haiku-5-5';
      return this.post(CFG.tutorUrl || '/api/tutor', {
        task: task, prompt: prompt, context: context, model: chosen
      });
    },

    /* ---------------- the coach ---------------- */
    /* section: 'rw' | 'math'; each has its own sessions. */
    coachToday: function (today, section) {
      return this.post('/api/coach/today', { today: today, section: section || null });
    },
    /* The coach prepares the next session in the background. */
    coachPrepare: function (today, section) {
      return this.post('/api/coach/prepare', { today: today, section: section || null });
    },

    onLocalWrite: function () { /* hook kept for future incremental sync */ }
  };

  Cloud.loadSession();
  global.Cloud = Cloud;

  /* Ask the server what it can do, then let the app re-render. */
  Cloud.probe();
})(window);

</script>
<script>
/* ============================================================
   THE CALCULATOR PANEL

   Bluebook puts Desmos on every math question, so practice should too.
   The panel lives outside #shell: the app redraws the shell on every
   step, and a graph the student built must survive that.

   The script comes from /calculator.js, which the server sends on to
   Desmos with the site's key. No key, no network, or the app opened from

(function (global) {

  var LOAD_MS = 15000;
  var OPTIONS = {
    border: false,
    images: false,          // no uploads: nothing a student needs on the SAT
    folders: false,
    notes: false,
    links: false,
    pasteGraphLink: false

  var LINK = '<p><a class="btn primary sm" href="' + DESMOS_URL + '" target="_blank" rel="noopener noreferrer">Open desmos.com in a new tab</a></p>';
  var CLOSE_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var root = null, host = null, note = null;
  var calc = null;        // the Desmos instance once loaded
  var loading = null;     // the script request while it is out
  var slow = null;        // timer for the "taking a while" note
  var open = false;
  var scope = null;       // the session the saved graphs belong to
  var cur = null;         // the question whose graph is on screen
  var saved = {};         // question id -> Desmos state, this session only

    if (root) return;

    root.id = 'calc';

        '<a class="link-btn quiet" href="' + DESMOS_URL + '" target="_blank" rel="noopener noreferrer">Open desmos.com</a>' +

      };
      s.onerror = function () { s.onload = s.onerror = null; reject(new Error('load failed')); };

    say('<p class="muted">Loading the calculator\u2026</p>');
    clearTimeout(slow);

      say('<p>The calculator is taking a while. It will appear here when it arrives.</p>' + LINK, true);
    }, LOAD_MS);

      clearTimeout(slow);

      clearTimeout(slow);

  /* Remember the graph on screen, then show the one for `key`. */
  function swap(key) {
    if (key === cur) return;
    if (calc && cur) saved[cur] = calc.getState();
    cur = key;
    if (!calc) return;
    if (key && saved[key]) calc.setState(saved[key]);

  }

  function mark() {
    document.documentElement.classList.toggle('calc-open', open);
    var btns = document.querySelectorAll('[data-calc-btn]');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', open ? 'true' : 'false');
  }

  function show() {
    build();

    root.hidden = false;
    mark();
    if (calc) { say(''); calc.resize(); }
    else if (!loading) start();
    try { root.focus({ preventScroll: true }); } catch (e) { root.focus(); }
  }

  function close() {
    if (!open) return;
    open = false;
    if (root) root.hidden = true;
    mark();
    var b = document.querySelector('[data-calc-btn]');
    if (b && root && root.contains(document.activeElement)) b.focus();
  }

  global.Calc = {
    /* Called after every render. session: the session's id; qid: the math
       question on screen, or null when there is none (the panel closes). */
    sync: function (session, qid) {
      if (!qid) {
        close();
        /* The session is over: its graphs go with it. */
        if (!session && scope !== null) { scope = null; saved = {}; cur = null; if (calc) calc.setBlank(); }
        mark();
        return;
      }
      if (session !== scope) { scope = session; saved = {}; cur = null; if (calc) calc.setBlank(); }

    toggle: function () { if (open) close(); else show(); },
    close: close,

    owns: function (el) { return !!(root && el && root.contains(el)); }
  };

</script>
<script>
/* ============================================================

   strategy a question wants, so you practice naming the move, then
   working it.

   - Home: one big Start button, a streak, and one progress bar.
   - Today's session: Daily LockIn plus eight questions the coach picked.
   - All 30 moves: the guide to each one.
   - Paste a Bluebook miss.
   The coach is an agent on the server. It reads the student's record and
   prepares the questions in the background; the student just presses
   Start.

   payments: a copy opened from disk, or a server without checkout, stays

(function () {

          if (q.type === 'spr' ? !(Array.isArray(q.answers) && q.answers.length) : !Array.isArray(q.choices)) return;

             retired: it renders (ALLQ), but never joins the banks a round is
             built from, and is not kept. */
          var bank = q.section === 'math' ? window.MATH_BANK : window.RW_BANK;
          if (!ALLQ[q.id]) ALLQ[q.id] = q;

             device dropped it. */

          window.TAGS[q.id] = { strat: q.tags.strat, traps: q.tags.traps || {} };

    }

      if (s.seen >= 3 && s.right / s.seen >= 0.8) return { key: 'locked', label: 'Locked in' };

    }
    function progressHTML(compact, sec) {

      var strats = window.Spot.data().strats;
      var met = ids.filter(function (id) { return strats[id] && strats[id].seen; }).length;
      var h = '<div class="progress-card' + (compact ? ' compact' : '') + '">' +

        '<div class="pc-side">' + (n === total ? (sec && Object.keys(lockedSet()).length < moveIds().length

          n ? (total - n) + ' to go' : met ? 'You have met ' + met + ' so far' : 'Your first session starts the count') + '</div></div>' +
        '<div class="bar"><div class="bar-fill" style="width:' + Math.round(100 * n / total) + '%"></div></div>';
      if (!compact) h += '<p class="pc-help">A move locks in once you name it right almost every time, at least three tries.</p>';
      return h + '</div>';
    }
    function weekHTML() {
      var h = '<div class="week">';
      var names = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      window.Daily.recent(7).forEach(function (x) {
          var d = new Date(x.date + 'T12:00:00');
          var cls = x.answered ? 'on' : x.today ? 'today' : '';
          h += '<div class="wk ' + cls + '"><span class="wk-dot">' + (x.answered ? ic('check') : '') + '</span>' +
            '<span class="wk-d">' + names[d.getDay()] + '</span></div>';
      });

    /* ============================================================
       THE COACH (behind the scenes)
       On the first visit of the day the server's coach reads this
       student's record and prepares a session of eight questions. The app
       uses it when the student presses Start and asks for the next one in
       the background. If it is not ready, or the server has no coach, the
       round is built here from the same record, so Start never waits.
       Each section has its own sessions, kept apart in coach.by.
       ============================================================ */
    var coach = { day: null, by: {} };
    /* A prepare in flight, per section. Kept outside coach.by so a reset
       (sign-in, purchase, a new day) cannot start a second one meanwhile. */
    var coachBusy = {};
    function coachSlot(sec) {
      return coach.by[sec] || (coach.by[sec] = { session: null, left: 0, loaded: false, ready: false, want: false, seq: 0 });
    }
    function coachOn() {
      var C = window.Cloud;
      return !!(C && C.coach && C.enabled && C.signedIn() && full());
    }
    function coachUsed() { return store(COACH_USED) || []; }
    function coachReady(sec) {
      if (!sec || coach.day !== window.Daily.todayKey()) return null;
      var s = coachSlot(sec).session;
      return s && s.qids && s.qids.length && coachUsed().indexOf(s.id) < 0 ? s : null;
    }
    /* Loads today's session for a section (the chosen one by default), once
       per section a day; that read costs nothing. Preparing a new session is
       a model call, so it happens only for a section the student is using:
       the one they came back to (prepare), or one they pressed Start in
       (wantNext). Tapping a section just to look never prepares one. */
    function ensureCoach(sec, prepare) {
      sec = sec || section();
      if (!coachOn() || !sec) return false;
      var today = window.Daily.todayKey();
      if (coach.day !== today) { coach.day = today; coach.by = {}; }
      var c = coachSlot(sec);
      if (prepare) c.want = true;
      if (c.loaded) {
        if (prepare && c.ready && !coachReady(sec)) prepareNext(sec);
        return true;
      }
      c.loaded = true;
      var seq = ++c.seq;   // only the newest load's answer counts
      window.Cloud.coachToday(today, sec).then(function (d) {
          if (coach.by[sec] !== c || c.seq !== seq) return;   // reset or reloaded since
          if (d.session) installPool(d.session.questions, true);
          c.session = d.session; c.left = d.left; c.ready = true;
          if (!coachReady(sec)) { if (c.want) prepareNext(sec); }
          else if (view === 'home') render();
      }).catch(function () { if (coach.by[sec] === c && c.seq === seq) c.loaded = false; });
      return true;
    }
    /* The student is practicing this section: have the next session ready. */
    function wantNext(sec) {
      if (!sec) return;
      ensureCoach(sec, true);
      var c = coach.by[sec];
      if (c && c.ready) prepareNext(sec);
    }
    function prepareNext(sec) {
      if (!sec || !coachOn()) return;
      var c = coachSlot(sec);
      if (coachBusy[sec] || c.left <= 0) return;
      coachBusy[sec] = true;
      /* Done, either way. If the slots were reset while this ran, its result
         may belong to another sign-in, so it is not used and the section
         reloads instead (the new slot could not start its own meanwhile). */
      function settle() {
        coachBusy[sec] = false;
        if (coach.by[sec] === c) return true;
        if (coach.by[sec]) coach.by[sec].loaded = false;
        ensureCoach(sec);
        return false;
      }
      window.Cloud.flushQueue().then(function () {
          return window.Cloud.coachPrepare(window.Daily.todayKey(), sec);
      }).then(function (d) {
          if (!settle()) return;
          if (d.session) installPool(d.session.questions, true);
          c.session = d.session; c.left = d.left;
          if (view === 'home') render();
      }).catch(function (e) {
          /* 429: the day's sessions are used up, so stop asking until tomorrow. */
          if (settle() && e && e.status === 429) c.left = 0;
      });
    }
    /* Eight question ids for the next round in the chosen section: the
       coach's, or built here. */
    function nextRoundQids(exclude) {
      var sec = section();
      var s = coachReady(sec);
      if (s) {
        var used = coachUsed(); used.push(s.id); store(COACH_USED, used.slice(-50));
        var qids = s.qids.filter(function (id) { return id !== exclude; });
        /* The coach may have picked today's daily question; fill its place. */
        if (qids.length < s.qids.length) {
          window.Spot.build({ section: sec, count: 9 }).items.forEach(function (x) {
              if (qids.length < s.qids.length && x.qid !== exclude && qids.indexOf(x.qid) < 0) qids.push(x.qid);
          });
        }
        return { qids: qids, line: s.line, coach: true };
      }
      var r = window.Spot.build({ section: sec || undefined, count: 9 });
      return { qids: r.items.map(function (x) { return x.qid; }).filter(function (id) { return id !== exclude; }), line: '', coach: false };
    }

    /* ============================================================
       HOME
       ============================================================ */
    /* Today's session is done per section. A record from before sections
       (no "sections") counts as done for both. */
    function todayDone(sec) {
      sec = sec || section();
      var t = store(TODAY_KEY);
      if (!t || t.day !== window.Daily.todayKey()) return false;
      if (!t.sections) return true;
      return !!(sec && t.sections[sec]);
    }
    function markTodayDone(sec, day) {
      var today = window.Daily.todayKey();
      /* A session that began before midnight belongs to a day that is over. */
      if (day && day !== today) return;
      var t = store(TODAY_KEY);
      var secs = t && t.day === today && t.sections ? t.sections : {};
      if (sec) secs[sec] = 1;
      store(TODAY_KEY, { day: today, sections: secs });
    }

            'onclick="APP.setSection(\'' + s[0] + '\')">' + s[1] + '</button>';

          '<button class="btn primary xl" onclick="APP.startToday()">Start today\u2019s question ' + ic('arrow') + '</button>';
      } else {

        var otherOpen = paid && !todayDone(other);
        h += '<div class="hc-done">' + ic('check') + '</div>' +
          '<h1>' + (otherOpen ? 'Done with ' + secName + ' today' : 'Done for today') + '</h1>' +
          '<p class="hc-sub">' + (streak > 1 ? 'That is ' + streak + ' days in a row. Come back tomorrow to make it ' + (streak + 1) + '.' :
            streak === 1 ? 'Day one is in the books. Come back tomorrow to make it two in a row.' :
            'Come back tomorrow and start a streak.') +
          (otherOpen ? ' ' + sectionName(other) + ' has its own session if you want more today.' : '') + '</p>' +
          (otherOpen ? '<button class="btn primary xl" onclick="APP.setSection(\'' + other + '\')">Switch to ' + sectionName(other) + ' ' + ic('arrow') + '</button>' : '') +
          (paid ? '<button class="btn soft" onclick="APP.practiceMore()">Practice more</button>' : '');

      h += weekHTML();

      /* ---- the upgrade, only for someone who has not bought it ---- */
      if (!paid) h += unlockCardHTML();

      h += progressHTML(true, sec);

      h += '<div class="tiles">' +
        '<button class="tile" onclick="APP.go(\'moves\')"><span class="tile-ic">' + ic('book') + '</span>' +
        '<span class="tile-name">All ' + moveIds().length + ' moves</span><span class="tile-sub">How to spot each one</span></button>' +
        '<button class="tile" onclick="APP.openPaste()"><span class="tile-ic">' + ic(paid ? 'scope' : 'lock') + '</span>' +
        '<span class="tile-name">Missed one in Bluebook?</span><span class="tile-sub">Paste it, get the move and the trap</span></button>' +
        (window.DESMOS ? '<button class="tile wide" onclick="APP.calcTips()"><span class="tile-ic">' + ic('calc') + '</span>' +

      }
      h += '</footer></div>';
      return h;
    }

    function unlockCardHTML() {

        '<h2>Train every day, not just one question</h2>' +

    /* ============================================================
       SESSION: name the move, then work it
       One flow for everything: today's session, a single daily question,
       more practice, and a focused round on one move.
       ============================================================ */
    var sess = null; // { kind, round, phase, step, choice, typed, t0, id, dailyIdx, dailyDate, line, focus, before, run, best }

    function startRound(kind, qids, opts) {
      opts = opts || {};
      var round = opts.focus ? window.Spot.build({ focus: opts.focus }) : window.Spot.build({ qids: qids });
      if (!round.items.length) { toast('No questions available for that right now'); return; }
      sess = {
        kind: kind, round: round, phase: 'ask', step: 0, choice: null, typed: '', t0: 0,
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        dailyIdx: opts.dailyDate ? 0 : -1, dailyDate: opts.dailyDate || null,

          h += '<span class="dot ' + cls + '"></span>';
      });

    }

    /* mode: null shows the question, 'pick' lets the student answer it,

    function questionHTML(q, mode, chosen) {

        if (q.figure) h += '<div class="figure">' + q.figure + (q.figcap ? '<div class="cap">' + q.figcap + '</div>' : '') + '</div>';
        if (q.passage) h += q.passage;

      h += '<div class="stem">' + q.prompt + '</div>';
      if (q.type === 'spr') {
        if (mode === 'pick') {

            '<input id="spr-ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="like 12, -3 or 3/2" ' +
            'value="' + esc(sess && sess.typed || '') + '" oninput="APP.sprType(this.value)" ' +
            'onkeydown="if(event.key===\'Enter\'&&!event.isComposing)APP.sprCheck()">' +
            '<button class="btn primary sm" onclick="APP.sprCheck()">Check</button></div>';
        } else {
          h += reveal
            ? '<p class="spr">Answer: <strong>' + q.answers.map(esc).join('</strong> or <strong>') + '</strong>' +
              (typeof chosen === 'string' && !sprMatch(chosen, q.answers) ? '<span class="spr-you">You typed ' + esc(chosen) + '</span>' : '') + '</p>'
            : '<p class="spr">You type the answer in on this one.</p>';

        q.choices.forEach(function (c, i) {

              (ok ? '<span class="tag">' + ic('check') + 'Answer</span>' : bad ? '<span class="tag no">Your pick</span>' : '');
            h += mode === 'pick'
              ? '<li><button type="button" class="choice pick" onclick="APP.choose(' + i + ')">' + inner + '</button></li>'
              : '<li class="choice' + (ok ? ' correct' : bad ? ' wrong' : '') + '">' + inner + '</li>';
        });
        h += '</ul>';
      }
      return h + '</div>';
    }

    function cuesHTML(id) {
      var st = window.STRATS[id];
      if (!st || !st.cues) return '';
      return '<ul class="cues">' + st.cues.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
    }

    var PRAISE = ['Nice spot.', 'That is the move.', 'Locked on.', 'Exactly right.', 'Good eye.'];

    function sessionHTML() {
      if (!sess) { view = 'home'; return homeHTML(); }
      if (sess.phase === 'done') return sessionDoneHTML();

      var r = sess.round;
      var it = r.items[r.i];
      var q = ALLQ[it.qid];
      var st = window.STRATS[it.strat];
      var isDaily = r.i === sess.dailyIdx;

      var h = '<div class="page session">';
      h += '<header class="s-top"><button class="icon-btn" aria-label="Exit" onclick="APP.exitSession()">' + ic('close') + '</button>' +
        progressDots() +

        (q.section === 'math' && window.Calc ? '<button type="button" class="icon-btn calc-btn" data-calc-btn aria-label="Calculator" aria-pressed="' +
          (window.Calc.isOpen() ? 'true' : 'false') + '" onclick="APP.calc()">' + ic('calc') + '<span>Calculator</span></button>' : '') +
        '</header>';
      h += '<div class="s-label">' + (isDaily ? '<span class="pill daily">' + ic('flame') + 'Daily LockIn</span>' : '') +

        return h + '</div>';
      }

      /* work: the student answers it. Steps come one at a time as hints

      var done = sess.choice !== null;
      h += '<div class="stack"><div class="panel move"><h3>' + esc(st.name) + '</h3><p class="move-txt">' + esc(st.move) + '</p>' +

        }

        return h + '</div>';
      }

      /* answered: the verdict, the trap behind a wrong pick, the full solution */
      var it2 = sess.round.items[sess.round.i];
      var tg = window.tagsFor(q);
      var key = q.type === 'spr' ? esc(q.answers[0]) : LETTERS[q.answer] + ', ' + q.choices[q.answer];
      h += '<section class="verdict ans-verdict ' + (it2.ans ? 'ok' : 'no') + '"><div class="v-ic">' + ic(it2.ans ? 'check' : 'bulb') + '</div><div>' +
        '<div class="v-title">' + (it2.ans ? 'Right, it is ' + dot(key) : sess.choice === -1 ? 'Here is how it works.' : 'Not quite. The answer is ' + dot(key)) + '</div>' +
        (it2.ans && !it2.solo ? '<div class="v-sub">You saw every step first, so this one does not count as solved yet.</div>'
          : it2.ans && sess.step ? '<div class="v-sub">With ' + sess.step + ' step' + (sess.step === 1 ? '' : 's') + ' shown. Next time, try it with fewer.</div>' : '') +
        '</div></section>';
      if (!it2.ans && typeof sess.choice === 'number' && sess.choice >= 0 &&
          ((tg.traps && window.TRAPS[tg.traps[sess.choice]]) || (q.traps && q.traps[sess.choice]))) {
        var tp = tg.traps && tg.traps[sess.choice] ? window.TRAPS[tg.traps[sess.choice]] : null;
        h += '<div class="panel warm"><h3>The trap you fell for</h3>' +
          '<p>' + (tp ? '<b>' + esc(tp.name) + '.</b> ' : '') + 'You picked ' + LETTERS[sess.choice] + ', ' + dot(q.choices[sess.choice]) + ' ' +
          (q.traps && q.traps[sess.choice] ? q.traps[sess.choice] : '') + '</p>' +
          (tp ? '<p class="trap-fix"><b>Next time:</b> ' + esc(tp.fix) + '</p>' : '') + '</div>';
      }
      var gm = it2.ans ? null : gridMiss(q, sess.choice);
      if (gm) {
        var gt = window.TRAPS[gm.trap] || null;
        h += '<div class="panel warm"><h3>The trap you fell for</h3>' +
          '<p>' + (gt ? '<b>' + esc(gt.name) + '.</b> ' : '') + gm.explanation + '</p>' +
          (gt ? '<p class="trap-fix"><b>Next time:</b> ' + esc(gt.fix) + '</p>' : '') + '</div>';
      }
      h += '<div class="panel"><h3>The full solution</h3><ol class="steps">';
      q.steps.forEach(function (s) { h += '<li>' + s + '</li>'; });
      h += '</ol></div>';
      if (q.traps && Object.keys(q.traps).length) {
        h += '<div class="panel traps"><h3>Why the wrong answers look right</h3>';
        Object.keys(q.traps).forEach(function (k) {
            if (+k === sess.choice && !it2.ans) return;
            var t = tg.traps[k] ? window.TRAPS[tg.traps[k]] : null;
            h += '<div class="trap"><b>' + LETTERS[+k] + '</b><div>' +
              (t ? '<span class="trap-name">' + esc(t.name) + '</span>' : '') + q.traps[k] +
              (t ? '<span class="trap-fix"><b>Next time:</b> ' + esc(t.fix) + '</span>' : '') + '</div></div>';
        });
        h += '</div>';
      }
      h += rateHTML(it2.qid);
      var last = r.i === r.items.length - 1;
      h += '</div><div class="actions"><button class="btn primary xl" onclick="APP.next()">' +

    /* Grid-in grading uses the SAT rules in engine.js: 3/2 or 1.5, a rounded
       or cut-off decimal like .666 or .667 for 2/3, and $ % , ignored. */
    function sprMatch(v, answers) { return window.SATP.Session.checkSPR(v, answers); }
    /* The likely wrong answer a typed grid-in matches, if the question has
       them (pool grid-ins do). checkSPR is one-way, so both directions. */
    function gridMiss(q, typed) {
      if (!q || q.type !== 'spr' || typeof typed !== 'string' || !Array.isArray(q.wrong_answers)) return null;
      for (var i = 0; i < q.wrong_answers.length; i++) {
        var w = q.wrong_answers[i];
        if (w && w.value && (sprMatch(typed, [w.value]) || sprMatch(w.value, [typed]))) return w;
      }
      return null;
    }

    /* One answer, saved as a practice event: right or wrong, the trap behind
       a wrong pick, how long it took, and how many steps were shown first.
       The coach reads these to plan the next session. A right answer given
       only after every step was shown is saved as not yet solved, so walking
       through the whole solution does not count toward a move's accuracy. */
    function logAnswer(right) {
      var r = sess.round, it = r.items[r.i], q = ALLQ[it.qid];
      var tg = window.tagsFor(q);
      /* Saved as solved only when some step was still hidden. */
      var solved = right && (!q.steps.length || sess.step < q.steps.length);
      it.ans = right; it.solo = solved; it.hints = sess.step;
      var gm = right ? null : gridMiss(q, sess.choice);
      var trap = !right && typeof sess.choice === 'number' && sess.choice >= 0 && tg.traps ? (tg.traps[sess.choice] || null)
        : gm && window.TRAPS[gm.trap] ? gm.trap : null;
      window.Store.recordEvents([{
        key: 'lk-' + sess.id + '|' + r.i + '|' + it.qid, attempt: 'lockin-' + sess.id, t: new Date().toISOString(),
        qid: it.qid, section: q.section, domain: q.domain || null, skill: q.skill || null, difficulty: q.difficulty || null,
        strat: it.strat, trap: trap, correct: solved,
        seconds: Math.round((Date.now() - (sess.t0 || Date.now())) / 1000), hints: sess.step
      }]);
      sess.justAnswered = true;
      render();
    }

    /* ---------- feedback: optional, one tap, never in the way ---------- */
    var RATE_WHY = [['wrong', 'Answer looks wrong'], ['confusing', 'Confusing'], ['easy', 'Too easy'], ['hard', 'Too hard']];
    function canRate() {
      var C = window.Cloud;
      return !!(C && C.enabled && C.signedIn() && C.rateQuestion);
    }
    function rateHTML(qid) {
      if (!canRate()) return '';
      var v = window.Cloud.questionVote(qid);

      var h = '<div class="rate" role="group" aria-label="Rate this question"><span class="rate-q">Was this a good question?</span>' +
        '<button type="button" class="rate-btn" aria-pressed="' + (r === 1) + '" aria-label="Good question" onclick="APP.rateQ(1)">' + ic('thumbUp') + '</button>' +
        '<button type="button" class="rate-btn down" aria-pressed="' + (r === -1) + '" aria-label="Not a good question" onclick="APP.rateQ(-1)">' + ic('thumbDown') + '</button></div>';
      if (r === -1) {
        h += '<div class="rate-why" role="group" aria-label="What was off with it? Optional"><span>What was off? Optional.</span>' +
          RATE_WHY.map(function (w) {

          }).join('') + '</div>';

    /* Which move helped most: only when the session had more than one. */
    function helpedHTML() {

    function currentQid() {

    function sessionDoneHTML() {
      var r = sess.round;

      var after = lockedSet();

          h += '<button class="btn primary xl" onclick="APP.go(\'home\'); APP.setSection(\'' + other + '\')">Switch to ' + sectionName(other) + ' ' + ic('arrow') + '</button>' +
            '<button class="btn soft" onclick="APP.practiceMore()">Keep going</button>' +
            '<button class="link-btn" onclick="APP.go(\'home\')">Back home</button>';
        } else {
          h += '<button class="btn primary xl" onclick="APP.go(\'home\')">Done for today</button>' +
            '<button class="btn soft" onclick="APP.practiceMore()">Keep going</button>';

      } else {
        h += '<button class="btn primary xl" onclick="APP.practiceMore()">Another round</button>' +
          '<button class="btn soft" onclick="APP.go(\'home\')">Back home</button>';
      }
      h += '</div></div>';
      return h;

    function catalogContext() {
      var out = ['STRATEGY IDS. Choose exactly one.'];
      Object.keys(window.STRATS).forEach(function (id) {
          out.push('  ' + id + ' [' + window.STRATS[id].section + '] = ' + window.STRATS[id].name + '. ' + window.STRATS[id].move);
      });

          out.push('  ' + id + ' = ' + window.TRAPS[id].name + '. ' + window.TRAPS[id].tell);
      });
      return out.join('\n');
    }
    function azParse(text) {
      var t = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      var a = t.indexOf('{'), b = t.lastIndexOf('}');
      if (a < 0 || b < a) return null;
      try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
    }
    /* Ids not in the catalog are dropped: a made-up label is worse than none. */
    function azClean(res) {
      var out = {
        section: res.section === 'math' ? 'math' : 'rw',
        skill: typeof res.skill === 'string' ? res.skill : null,
        strategy: window.STRATS[res.strategy] ? res.strategy : null,
        strategyWhy: typeof res.strategyWhy === 'string' ? res.strategyWhy : '',
        correct: res.correct == null ? '' : String(res.correct),
        walkthrough: Array.isArray(res.walkthrough) ? res.walkthrough.filter(function (x) { return typeof x === 'string' && x.trim(); }) : [],
        traps: [],
        picked: null,
        confidence: ['high', 'medium', 'low'].indexOf(res.confidence) >= 0 ? res.confidence : 'medium'

      (Array.isArray(res.traps) ? res.traps : []).forEach(function (t) {

    /* ============================================================
       LANDING: what this is, in one screen and a demo

    var demo = { picked: null, qid: 'm024' };

      var h = '<div class="demo"><div class="eyebrow">Try one</div><div class="stem">' + q.prompt + '</div><div class="demo-choices">';
      q.choices.forEach(function (c, i) {

      });
      h += '</div>';
      if (demo.picked === null) {
        h += '<p class="small muted">Pick one. Nothing is saved.</p>';

        /* A first-time visitor does not know our words yet, so the reveal
           teaches them: the trap (why a wrong answer looked right, and how to
           dodge it) and the move (the strategy the question tests), each in

        h += '<div class="demo-reveal">' +
          '<p class="demo-verdict"><b>' + (right ? 'Right, it is ' : 'Not quite. The answer is ') +

            '<p class="demo-fix"><b>Next time:</b> ' + esc(tp.fix) + '</p></div>' +
          '<div class="demo-part"><div class="demo-label">The move <span>the strategy this question tests</span></div>' +
