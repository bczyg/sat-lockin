<style>
/* ============================================================
   SAT LockIn: styles

   Direction: warm paper, deep iris, a tangerine spark.
   - One confident brand color (iris) carries every primary action.
   - Tangerine is energy: streaks, the daily flame, celebration.
   - Green means "you named it"; amber means "here is the move", never
     a scolding red.
   - Display type is Bricolage Grotesque, body is Figtree, and passages
     are set in Source Serif 4 so reading feels like reading.
   Mobile first. Everything sits in one centered column.
   ============================================================ */

/* ---------------- tokens ---------------- */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

:root{
  color-scheme: light;

  /* surfaces and ink */
  --bg:#f7f4ee;
  --surface:#ffffff;
  --surface-2:#f2eee6;
  --surface-3:#e9e4da;
  --ink:#17152b;
  --ink-2:#47445d;
  --ink-3:#625f78;
  --line:#e6e0d5;
  --line-2:#d2cbbd;

  /* brand */
  --brand:#4b3bdb;
  --brand-fill:#4b3bdb;
  --brand-deep:#3424b0;
  --brand-ink:#3a2bc4;
  --brand-soft:#ecebff;
  --brand-line:#cdc8ff;
  --on-brand:#ffffff;
  --hero-a:#3a2bcf;
  --hero-b:#5b3ce6;
  --hero-c:#7b4cf0;

  /* energy and states */
  --accent:#ff6a3d;
  --accent-ink:#b23c10;
  --accent-soft:#ffece3;
  --ok:#12a26a;
  --ok-ink:#0a7a4e;
  --ok-soft:#e2f6ec;
  --ok-line:#a9e3c8;
  --warn:#e59a12;
  --warn-ink:#93560a;
  --warn-soft:#fff3dc;
  --warn-line:#f3d397;
  --bad:#c8322b;
  --bad-soft:#fdecea;
  --gold:#f5b700;

  /* paper for figures: question SVGs are drawn in dark ink */
  --paper:#ffffff;
  --paper-ink:#17152b;

  /* shape */
  --r-xs:8px;
  --r-sm:12px;
  --r:18px;
  --r-lg:26px;
  --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(23,21,43,.06), 0 1px 1px rgba(23,21,43,.04);
  --shadow:0 1px 2px rgba(23,21,43,.05), 0 6px 20px -8px rgba(23,21,43,.14);
  --shadow-lg:0 2px 4px rgba(23,21,43,.06), 0 24px 48px -18px rgba(38,26,120,.35);
  --focus:#2f6bff;

  /* spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:48px;

  /* type */
  --display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-xs:12.5px;
  --fs-sm:14px;
  --fs-md:16px;
  --fs-lg:18px;
  --fs-xl:21px;
  --fs-2xl:clamp(25px,5.6vw,30px);
  --fs-3xl:clamp(30px,7.4vw,44px);
  --fs-4xl:clamp(38px,10vw,64px);

  --col:680px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#100f1c;
    --surface:#1a1929;
    --surface-2:#222136;
    --surface-3:#2c2a44;
    --ink:#f3f1fb;
    --ink-2:#c9c6dc;
    --ink-3:#a29fba;
    --line:#2d2b45;
    --line-2:#3e3b5c;

    --brand:#9d94ff;
    --brand-fill:#5d4ef0;
    --brand-deep:#3b2cc0;
    --brand-ink:#b8b1ff;
    --brand-soft:#26224a;
    --brand-line:#433c85;
    --hero-a:#3326b8;
    --hero-b:#4f33d6;
    --hero-c:#6a3fe0;

    --accent:#ff7d55;
    --accent-ink:#ffa585;
    --accent-soft:#3a2219;
    --ok:#2fc285;
    --ok-ink:#6fdcaa;
    --ok-soft:#14302a;
    --ok-line:#22594a;
    --warn:#f0ad35;
    --warn-ink:#f6c46e;
    --warn-soft:#352a14;
    --warn-line:#5e4920;
    --bad:#ff7a70;
    --bad-soft:#3a1c1e;
    --gold:#ffc933;

    --paper:#f7f5ef;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -10px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.7);
    --focus:#8fb0ff;
  }
}

/* ---------------- base ---------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:var(--sans);
  font-size:var(--fs-md);
  line-height:1.55;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;line-height:1.2;font-family:var(--display);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
img,svg{max-width:100%}
hr{border:0;border-top:1px solid var(--line);margin:var(--s5) 0}
.hidden{display:none !important}
::selection{background:var(--brand-soft);color:var(--ink)}

:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-xs)}

.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}

.muted{color:var(--ink-3)}
.small{font-size:var(--fs-sm);line-height:1.5}
.err{color:var(--bad);font-weight:600;font-size:var(--fs-sm);margin-top:var(--s3)}
.eyebrow{
  font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brand-ink);margin-bottom:var(--s2);
}

/* ---------------- page frame ---------------- */
#shell{min-height:100vh}
.page{
  max-width:calc(var(--col) + 2 * var(--s4));
  margin:0 auto;
  padding:var(--s3) var(--s4) var(--s8);
  animation:page-in .38s var(--ease) both;
}
@media (min-width:720px){
  .page{padding:var(--s5) var(--s6) 72px;max-width:calc(var(--col) + 2 * var(--s6))}
}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------------- buttons ---------------- */
.btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:46px;padding:0 var(--s5);
  border:1.5px solid transparent;border-radius:var(--r-sm);
  font-family:var(--sans);font-size:var(--fs-md);font-weight:700;line-height:1.2;
  text-decoration:none;white-space:nowrap;
  transition:transform .12s var(--ease), box-shadow .15s var(--ease), background-color .15s, border-color .15s, color .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn .ic{width:19px;height:19px;vertical-align:0;transition:transform .2s var(--ease)}
.btn:hover .ic{transform:translateX(2px)}
.btn.primary{
  background:var(--brand-fill);color:var(--on-brand);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 var(--brand-deep), 0 10px 22px -10px rgba(52,36,176,.7);
}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 1px 0 var(--brand-deep), 0 4px 10px -6px rgba(52,36,176,.6)}
.btn.soft{
  background:var(--surface);color:var(--ink);border-color:var(--line-2);
  box-shadow:0 2px 0 var(--line);
}
.btn.soft:hover{border-color:var(--brand-line);color:var(--brand-ink)}
.btn.soft:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 #8f1f1a}
.btn.danger:active{transform:translateY(2px);box-shadow:0 1px 0 #8f1f1a}
.btn.xl{min-height:56px;padding:0 var(--s6);font-size:var(--fs-lg);border-radius:var(--r)}
.btn.sm{min-height:44px;padding:0 var(--s4);font-size:var(--fs-sm)}
.btn:disabled,.btn[disabled]{opacity:.55;filter:saturate(.6);transform:none;box-shadow:none}
.btn:focus-visible{outline-offset:3px;border-radius:var(--r-sm)}

.icon-btn{
  display:inline-grid;place-items:center;flex:none;
  width:44px;height:44px;padding:0;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--ink-2);
  transition:background-color .15s, transform .12s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.round{border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.icon-btn .ic{width:20px;height:20px;vertical-align:0}

.link-btn{
  display:inline-flex;align-items:center;min-height:44px;padding:0 2px;
  background:none;border:0;
  color:var(--brand-ink);font-weight:600;font-size:inherit;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;
  text-decoration-color:var(--brand-line);
}
.link-btn:hover{text-decoration-color:currentColor}
.link-btn.quiet{color:var(--ink-3);text-decoration-color:var(--line-2);font-weight:600}
.link-btn.quiet:hover{color:var(--ink)}
p .link-btn,.small .link-btn{min-height:0;padding:6px 2px}

.actions{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s6)}
.actions .btn{width:100%}
.actions.left,.actions.center{flex-direction:row;flex-wrap:wrap}
.actions.left .btn{width:auto}
.actions.center{justify-content:center}
@media (min-width:560px){
  .actions{flex-direction:row;flex-wrap:wrap}
  .actions .btn{width:auto}
  .actions .btn.xl{flex:1 1 auto}
  .actions.center .btn.xl{flex:0 1 auto;min-width:240px}
  .actions.left .btn.xl{flex:0 1 auto}
}

/* ---------------- top bar ---------------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:52px;margin-bottom:var(--s3)}
.wordmark{
  display:inline-flex;align-items:center;gap:0;min-height:44px;padding:0;
  background:none;border:0;
  font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
}
.wordmark::before{
  content:"";width:26px;height:26px;margin-right:9px;border-radius:8px;
  background:
    radial-gradient(circle at 50% 50%, var(--surface) 0 3px, transparent 3.5px),
    radial-gradient(circle at 50% 50%, transparent 0 6.5px, var(--surface) 7px 8.5px, transparent 9px),
    linear-gradient(135deg,var(--hero-a),var(--hero-c));
  box-shadow:0 2px 0 var(--brand-deep);
}
.wordmark span{color:var(--brand);margin-left:.2em}
.tb-right{display:flex;align-items:center;gap:var(--s2)}
.streak-chip{
  display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 9px;
  border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);
  font-weight:800;font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums;
  box-shadow:var(--shadow-sm);
}
.streak-chip .ic{width:18px;height:18px;vertical-align:0}
.streak-chip.hot{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.streak-chip.hot .ic{color:var(--accent);fill:var(--accent)}

/* ---------------- home ---------------- */
.hello{font-family:var(--display);font-size:var(--fs-lg);font-weight:600;color:var(--ink-3);margin:var(--s2) 0 var(--s3);letter-spacing:-.01em}

.hero-card{
  position:relative;overflow:hidden;isolation:isolate;
  padding:var(--s6) var(--s5) var(--s5);
  border-radius:var(--r-lg);
  color:#fff;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(255,140,90,.38), transparent 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);
  box-shadow:var(--shadow-lg);
}
.hero-card::after{
  content:"";position:absolute;z-index:-1;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(255,255,255,.07);
  box-shadow:0 0 0 34px rgba(255,255,255,.04);
}
.hero-card h1{color:#fff;font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.03em;margin:var(--s2) 0 var(--s2);text-wrap:balance}
.hc-kicker{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.16);font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.hc-kicker .ic{width:16px;height:16px;vertical-align:0}
.hc-sub{font-size:var(--fs-md);line-height:1.5;color:rgba(255,255,255,.88);max-width:46ch;text-wrap:pretty}
.hc-meta{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0 var(--s5)}
.hc-meta span{
  font-size:var(--fs-sm);font-weight:600;padding:4px 10px;border-radius:var(--r-pill);
  background:rgba(10,6,40,.22);color:rgba(255,255,255,.95);
}
.hero-card .btn.primary{
  width:100%;margin-top:var(--s5);
  background:#fff;color:var(--hero-a);
  box-shadow:0 4px 0 rgba(18,10,80,.45), 0 14px 26px -12px rgba(10,5,50,.7);
}
.hc-meta + .btn.primary{margin-top:0}
.hero-card .btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(18,10,80,.45)}
.hero-card .btn.primary:focus-visible{outline-color:#fff}
.hero-card .btn.soft{
  margin-top:var(--s5);background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none;
}
.hero-card .btn.soft:hover{background:rgba(255,255,255,.22);color:#fff}
.hero-card .link-btn{color:#fff}
.hc-pick{display:grid;gap:var(--s3);margin-top:var(--s5)}
.hero-card .hc-pick .btn.primary{margin-top:0;width:100%;min-width:0}

/* Reading and Writing | Math, above the hero card */
.sec-switch{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 var(--s4);
  border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.sec-switch button{
  min-height:44px;padding:0 var(--s3);border:0;border-radius:var(--r-pill);background:transparent;
  color:var(--ink-2);font:inherit;font-weight:700;font-size:var(--fs-sm);line-height:1.2;cursor:pointer;
}
.sec-switch button:hover{color:var(--ink)}
.sec-switch button.on{background:var(--ink);color:var(--bg)}
.sec-switch button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:560px){
  .hero-card{padding:var(--s7) var(--s7) var(--s6)}
  .hero-card .btn.primary{width:auto;min-width:260px}
}

.hc-done{
  display:grid;place-items:center;width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;margin-bottom:var(--s3);
  animation:pop .5s var(--spring) both;
}
.hc-done .ic{width:30px;height:30px;stroke-width:2.4}
.hc-done.spin .ic{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* the 7-day strip */
.week{
  display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1);
  margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid rgba(255,255,255,.18);
}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk-dot{
  display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1.5px dashed rgba(255,255,255,.35);color:var(--hero-a);
}
.wk.on .wk-dot{background:#fff;border:0;box-shadow:0 2px 0 rgba(10,5,60,.35)}
.wk.on .wk-dot .ic{width:18px;height:18px;stroke-width:3;vertical-align:0}
.wk.today .wk-dot{border:2px solid #fff;background:rgba(255,255,255,.2)}
.wk-d{font-size:var(--fs-xs);font-weight:700;color:rgba(255,255,255,.75)}
.wk.today .wk-d{color:#fff}

/* unlock card (home, landing, end of a free session) */
.unlock-card{
  position:relative;margin-top:var(--s5);padding:var(--s6) var(--s5);
  border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--brand-line);
  box-shadow:var(--shadow);
}
.unlock-card h2{font-size:var(--fs-2xl);margin:var(--s3) 0 var(--s4);letter-spacing:-.025em;text-wrap:balance}
.uc-tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:var(--r-pill);
  background:var(--accent-soft);color:var(--accent-ink);
  font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
.uc-tag .ic{width:16px;height:16px;vertical-align:0;fill:var(--accent);color:var(--accent)}
.uc-note{margin-top:var(--s3);font-size:var(--fs-sm);color:var(--ink-3)}
.unlock-card .btn.primary{margin-top:var(--s5);width:100%}
@media (min-width:560px){.unlock-card{padding:var(--s7)}.unlock-card .btn.primary{width:auto}}
.unlock-card.plain{border-color:var(--line)}
.unlock-card h2 .was{color:var(--ink-3);font-weight:700;text-decoration-thickness:.08em;margin-right:.25em}
.unlock-card h2:has(+ .uc-sub){margin-bottom:var(--s2)}
.uc-sub{margin:0 0 var(--s4);color:var(--ink-2);font-weight:600}

.ticks{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.ticks li{display:flex;gap:var(--s3);align-items:flex-start;line-height:1.45;color:var(--ink-2)}
.ticks .ic{
  width:22px;height:22px;padding:4px;margin-top:0;border-radius:50%;
  background:var(--ok-soft);color:var(--ok-ink);stroke-width:3;vertical-align:0;
}

/* progress */
.progress-card{
  margin-top:var(--s5);padding:var(--s5);
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.pc-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.pc-num{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.pc-num span{font-size:20px;color:var(--ink-3);font-weight:700;letter-spacing:-.02em;margin-left:2px}
.pc-lbl{font-size:var(--fs-sm);font-weight:600;color:var(--ink-3);margin-top:4px}
.pc-side{font-size:var(--fs-sm);font-weight:600;color:var(--brand-ink);text-align:right;max-width:22ch;line-height:1.35}
.bar{height:12px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(23,21,43,.08)}
.bar-fill{
  height:100%;border-radius:inherit;
  background:linear-gradient(90deg,var(--ok),#3fd09a);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
  animation:fill 1s .15s var(--ease) both;
}
@keyframes fill{from{width:0}}
.pc-help{margin-top:var(--s3);font-size:var(--fs-sm);color:var(--ink-3)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  min-height:124px;padding:var(--s4);
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .15s var(--ease), box-shadow .15s, border-color .15s;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand-line)}
.tile:active{transform:translateY(0) scale(.98)}
.tile-ic{
  display:grid;place-items:center;width:40px;height:40px;margin-bottom:auto;border-radius:12px;
  background:var(--brand-soft);color:var(--brand-ink);
}
.tile + .tile .tile-ic{background:var(--accent-soft);color:var(--accent-ink)}
.tile-ic .ic{vertical-align:0}
.tile-name{font-family:var(--display);font-weight:700;font-size:var(--fs-md);line-height:1.25;color:var(--ink);margin-top:var(--s4);letter-spacing:-.01em}
.tile-sub{font-size:var(--fs-xs);color:var(--ink-3);line-height:1.4}
@media (min-width:560px){.tile-name{font-size:var(--fs-lg)}.tile-sub{font-size:var(--fs-sm)}}

.foot{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 var(--s2);
  margin-top:var(--s7);font-size:var(--fs-sm);color:var(--ink-3);
}
.foot .link-btn{color:var(--ink-3);text-decoration-color:var(--line-2)}
.foot .link-btn:hover{color:var(--ink)}

/* ---------------- page header (moves, paste, unlock) ---------------- */
.page-head{display:flex;align-items:flex-start;gap:var(--s2);margin:var(--s2) 0 var(--s5)}
.page-head .icon-btn{margin-left:-8px;margin-top:-2px}
.page-head h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.03em;margin-top:6px}
.page-head p{color:var(--ink-3);margin-top:var(--s2);max-width:52ch}

/* ---------------- session ---------------- */
.s-top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:var(--s3);
  margin:0 calc(-1 * var(--s4)) var(--s3);padding:var(--s2) var(--s4);
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
}
@media (min-width:720px){.s-top{margin:0 calc(-1 * var(--s6)) var(--s3);padding:var(--s2) var(--s6)}}
.s-top .icon-btn{margin-left:-10px}
.s-count{font-weight:800;font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.dots{flex:1;display:flex;gap:5px;align-items:center}
.dot{
  flex:1;height:10px;border-radius:var(--r-pill);background:var(--surface-3);
  transition:background-color .3s, flex-grow .35s var(--ease);
}
.dot.now{flex-grow:2.2;background:var(--brand-fill);box-shadow:0 0 0 3px var(--brand-soft)}
.dot.ok{background:var(--ok)}
.dot.miss{background:var(--warn)}

.s-label{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-bottom:var(--s3);font-size:var(--fs-sm);font-weight:700;color:var(--ink-3)}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 8px;border-radius:var(--r-pill);
  font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;
}
.pill .ic{width:15px;height:15px;vertical-align:0}
.pill.daily{background:var(--accent-soft);color:var(--accent-ink)}
.pill.daily .ic{color:var(--accent);fill:var(--accent)}
.pill.run{background:var(--ok-soft);color:var(--ok-ink);animation:pop .45s var(--spring) both}

/* the question itself */
.q-card{
  padding:var(--s5) var(--s4);
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
@media (min-width:560px){.q-card{padding:var(--s6)}}

.passage{
  font-family:var(--serif);font-size:17.5px;line-height:1.68;color:var(--ink);
  padding-bottom:var(--s5);margin-bottom:var(--s5);border-bottom:1px dashed var(--line-2);
  overflow-wrap:break-word;
}
.passage p{margin:0 0 var(--s4)}
.passage p:last-child{margin-bottom:0}
.passage .blurb,.blurb{font-family:var(--sans);font-style:normal;font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:var(--s3)}
.passage .cite{font-size:var(--fs-sm);color:var(--ink-3)}
.passage u{text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px}

.figure{
  margin:0 0 var(--s4);padding:var(--s3);
  border-radius:var(--r-sm);background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);
  text-align:center;font-family:var(--sans);overflow-x:auto;
}
.figure:last-child{margin-bottom:0}
.figure svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.figure .cap{font-size:var(--fs-xs);font-weight:600;color:#55526a;margin-top:var(--s2)}
.figure table.data{margin:0 auto;color:var(--paper-ink)}
.figure table.data th,.figure table.data td{border-color:#d9d4c9}
.figure table.data th{background:#f2eee6}

table.data{
  border-collapse:separate;border-spacing:0;margin:var(--s4) auto;
  font-family:var(--sans);font-size:var(--fs-sm);line-height:1.35;
  font-variant-numeric:tabular-nums;max-width:100%;
}
table.data th,table.data td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line)}
table.data th{background:var(--surface-2);font-weight:700;font-size:var(--fs-xs);letter-spacing:.01em}
table.data tr:first-child th:first-child{border-top-left-radius:var(--r-xs)}
table.data tr:first-child th:last-child{border-top-right-radius:var(--r-xs)}
table.data td:first-child{text-align:left;font-weight:600}
.passage table.data,.stem table.data{display:block;overflow-x:auto;width:max-content}

.stem{font-size:var(--fs-lg);line-height:1.55;font-weight:500;color:var(--ink);overflow-wrap:break-word}
.stem p{margin:0 0 var(--s3)}
.stem p:last-child{margin-bottom:0}
.stem .quote{font-family:var(--serif);background:var(--surface-2);border-left:3px solid var(--brand-line);padding:var(--s3) var(--s4);margin:0 0 var(--s3);border-radius:0 var(--r-xs) var(--r-xs) 0}
.spr{
  display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4);padding:var(--s3) var(--s4);
  border-radius:var(--r-sm);background:var(--surface-2);border:1.5px dashed var(--line-2);
  font-size:var(--fs-sm);color:var(--ink-2);
}
.spr strong{font-family:var(--mono);font-size:var(--fs-lg);color:var(--ok-ink);padding:0 2px}

.choices{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:var(--s2)}
.choice{
  position:relative;display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s3) var(--s4) var(--s3) var(--s3);
  border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  font-size:var(--fs-md);line-height:1.45;color:var(--ink-2);
}
.choice .ltr{
  flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--line-2);font-size:var(--fs-sm);font-weight:800;color:var(--ink-2);margin-top:-2px;
}
.choice .txt{flex:1;min-width:0;padding-top:1px;overflow-wrap:break-word}
.choice.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);animation:pop .4s var(--spring) both}
.choice.correct .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.choice .tag{
  position:absolute;right:12px;top:-12px;display:inline-flex;align-items:center;gap:3px;box-shadow:0 2px 6px -2px rgba(10,122,78,.5);
  padding:3px 9px 3px 6px;border-radius:var(--r-pill);background:var(--ok);color:#fff;
  font-size:var(--fs-xs);font-weight:800;
}
@media (prefers-color-scheme: dark){.choice.correct .ltr,.choice .tag{color:#08251a}}
.choice .tag .ic{width:14px;height:14px;stroke-width:3;vertical-align:0}
/* answering: the choices are buttons until the first pick */
.choices li{list-style:none}
.choice.pick{width:100%;text-align:left;font:inherit;cursor:pointer;
  box-shadow:0 2px 0 var(--line);transition:border-color .15s,transform .08s,box-shadow .08s}
.choice.pick:hover{border-color:var(--brand)}
.choice.pick:hover .ltr{border-color:var(--brand);color:var(--brand)}
.choice.pick:active{transform:translateY(2px);box-shadow:none}
.choice.pick:focus-visible{outline:3px solid var(--brand-line);outline-offset:2px}
.choice.wrong{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.choice.wrong .ltr{background:var(--warn);border-color:var(--warn);color:#3a2400}
.choice .tag.no{background:var(--warn);box-shadow:none;color:#3a2400}
.spr-in{flex-wrap:wrap;border-style:solid;border-color:var(--brand-line);background:var(--surface)}
.spr-in label{font-weight:700;color:var(--ink)}
.spr-in input{flex:1;min-width:120px;height:44px;padding:0 12px;border-radius:var(--r-xs);border:1.5px solid var(--line-2);
  font:inherit;font-family:var(--mono);font-size:var(--fs-lg);background:var(--surface);color:var(--ink)}
.spr-in input:focus{outline:none;border-color:var(--brand)}
.spr-you{margin-left:auto;color:var(--warn-ink, var(--ink-2));font-weight:600}
.verdict .v-sub{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.ans-verdict{scroll-margin-top:76px}

.mathwork{
  font-family:var(--mono);font-size:var(--fs-sm);line-height:1.7;white-space:pre-wrap;
  background:var(--surface-2);border-radius:var(--r-xs);padding:var(--s2) var(--s3);margin:var(--s2) 0;overflow-x:auto;
}

/* asking for the move */
.ask{margin-top:var(--s6)}
.ask h2{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em}
.ask-sub{color:var(--ink-3);font-size:var(--fs-sm);margin-top:var(--s1)}
.opts{display:grid;gap:var(--s3);margin:var(--s4) 0 var(--s2)}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;align-items:center;gap:var(--s3);text-align:left;
  min-height:64px;padding:var(--s3) var(--s4) var(--s3) var(--s3);
  border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface);
  box-shadow:0 3px 0 var(--line-2);
  font-weight:700;font-size:var(--fs-md);line-height:1.3;color:var(--ink);
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), border-color .15s, background-color .15s;
  animation:rise .4s var(--ease) both;
}
.opt:nth-child(2){animation-delay:.04s}
.opt:nth-child(3){animation-delay:.08s}
.opt:nth-child(4){animation-delay:.12s}
.opt:hover{border-color:var(--brand);box-shadow:0 3px 0 var(--brand-line);background:color-mix(in srgb, var(--brand-soft) 45%, var(--surface))}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--line-2)}
.opt:focus-visible{border-radius:var(--r)}
.opt-k{
  flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;
  background:var(--surface-2);color:var(--ink-3);font-size:var(--fs-sm);font-weight:800;
  transition:background-color .15s,color .15s;
}
.opt:hover .opt-k{background:var(--brand-fill);color:#fff}
.opt-t{flex:1;min-width:0}
.ask .link-btn{margin-top:var(--s1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* the verdict */
.verdict{
  display:flex;align-items:center;gap:var(--s4);margin-top:var(--s5);padding:var(--s4) var(--s5);
  border-radius:var(--r);border:1.5px solid;
  animation:verdict-pop .5s var(--spring) both;
}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.verdict.no{background:var(--warn-soft);border-color:var(--warn-line)}
.v-ic{
  flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:#fff;
  animation:pop .55s .1s var(--spring) both;
}
.verdict.ok .v-ic{background:var(--ok);box-shadow:0 3px 0 var(--ok-ink)}
.verdict.no .v-ic{background:var(--warn);box-shadow:0 3px 0 var(--warn-ink)}
.v-ic .ic{width:26px;height:26px;stroke-width:2.6;vertical-align:0}
@media (prefers-color-scheme: dark){.v-ic{color:#14120a}.verdict.ok .v-ic{color:#06251a}}
.v-title{font-weight:700;font-size:var(--fs-sm);line-height:1.35}
.verdict.ok .v-title{color:var(--ok-ink)}
.verdict.no .v-title{color:var(--warn-ink)}
.v-move{font-family:var(--display);font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--ink);margin-top:2px}
.v-sub{font-size:var(--fs-sm);color:var(--ink-2);margin-top:var(--s1)}
@keyframes verdict-pop{0%{opacity:0;transform:scale(.94) translateY(6px)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

/* panels */
.stack{display:grid;gap:var(--s3);margin-top:var(--s4)}
.panel{
  padding:var(--s5);border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  animation:rise .4s var(--ease) both;
}
.stack .panel:nth-child(2){animation-delay:.06s}
.stack .panel:nth-child(3){animation-delay:.12s}
.panel h3{
  display:flex;align-items:center;gap:var(--s2);
  font-family:var(--sans);font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:var(--s3);
}
.panel h3 .ic{width:18px;height:18px;vertical-align:0}
.panel p{color:var(--ink-2);line-height:1.6}
.panel p + p{margin-top:var(--s3)}
.panel.warm{background:var(--warn-soft);border-color:var(--warn-line)}
.panel.warm h3{color:var(--warn-ink)}
.panel.warm p{color:var(--ink)}
.panel.move{border:1.5px solid var(--brand-line);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%)}
.panel.move h3{
  font-family:var(--display);font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;text-transform:none;color:var(--ink);
}
.move-txt{font-size:var(--fs-md);font-weight:600;color:var(--ink) !important;line-height:1.5}
.move-q{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--brand-line);font-size:var(--fs-sm)}

.cues{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.cues li{position:relative;padding-left:26px;line-height:1.5;color:var(--ink)}
.cues li::before{
  content:"";position:absolute;left:4px;top:.45em;width:10px;height:10px;border-radius:3px;transform:rotate(45deg);
  background:var(--brand);opacity:.85;
}

.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:var(--s3)}
.steps li{
  position:relative;counter-increment:st;padding-left:40px;line-height:1.55;color:var(--ink);
  animation:rise .35s var(--ease) both;overflow-wrap:break-word;min-width:0;
}
.steps li::before{
  content:counter(st);position:absolute;left:0;top:-1px;
  display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--brand-soft);color:var(--brand-ink);font-size:var(--fs-sm);font-weight:800;
}

.trap{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-top:1px solid var(--line);line-height:1.5;color:var(--ink-2)}
.trap:first-of-type{border-top:0;padding-top:0}
.trap > b{
  flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--surface-2);border:1.5px solid var(--line-2);font-size:var(--fs-sm);color:var(--ink-2);
}
.trap > div{flex:1;min-width:0;overflow-wrap:break-word}
.trap-name{
  display:inline-block;margin-right:6px;padding:1px 8px;border-radius:var(--r-pill);
  background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-xs);font-weight:800;vertical-align:1px;
}
.trap-fix{display:block;margin-top:4px;color:var(--ink-2);font-size:var(--fs-sm)}

/* ---------------- done ---------------- */
.done-hero{text-align:center;padding:var(--s6) 0 var(--s2)}
.done-hero h1{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.03em;margin-top:var(--s5);text-wrap:balance}
.done-hero .hc-sub{color:var(--ink-2);margin:var(--s2) auto 0}
.ring{
  position:relative;width:168px;height:168px;margin:0 auto;border-radius:50%;
  background:
    conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-3) 0);
  animation:ring 1.2s .1s var(--ease) both;
  box-shadow:0 10px 30px -12px rgba(18,162,106,.55);
}
.ring-in{
  position:absolute;inset:16px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-in b{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;letter-spacing:-.04em}
.ring-in span{font-size:var(--fs-sm);font-weight:700;color:var(--ink-3);margin-top:2px}
@keyframes ring{from{--p:0}}

.done-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s6)}
.ds{
  flex:1 1 0;min-width:96px;max-width:160px;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--s4) var(--s2);
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  animation:rise .45s var(--ease) both;
}
.ds:nth-child(2){animation-delay:.08s}.ds:nth-child(3){animation-delay:.16s}
.ds b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.ds > span:last-child{font-size:var(--fs-xs);font-weight:600;color:var(--ink-3);text-align:center;line-height:1.3}
.ds-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);margin-bottom:var(--s1)}
.ds-ic .ic{vertical-align:0}
.ds-ic.hot{background:var(--accent-soft);color:var(--accent)}
.ds-ic.hot .ic{fill:var(--accent)}
.ds:last-child .ds-ic{background:var(--ok-soft);color:var(--ok-ink)}

.done .panel{margin-top:var(--s4)}
.panel.celebrate{
  text-align:center;border:1.5px solid var(--ok-line);
  background:
    radial-gradient(80% 120% at 50% 0%, var(--ok-soft), var(--surface) 75%);
}
.panel.celebrate h3{justify-content:center;color:var(--ok-ink);font-size:var(--fs-sm)}
.panel.celebrate h3 .ic{color:var(--gold);fill:var(--gold);width:22px;height:22px;animation:pop .6s .3s var(--spring) both}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2)}
.chips li{
  padding:8px 14px;border-radius:var(--r-pill);background:var(--ok);color:#fff;font-weight:700;font-size:var(--fs-sm);
  box-shadow:0 2px 0 var(--ok-ink);animation:pop .5s var(--spring) both;
}
@media (prefers-color-scheme: dark){.chips li{color:#06251a}}
.chips li:nth-child(2){animation-delay:.1s}.chips li:nth-child(3){animation-delay:.2s}

.miss{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.miss:first-of-type{border-top:0;padding-top:0}
.miss > div{flex:1;min-width:0}
.miss b{display:block;font-weight:700;color:var(--ink)}
.miss-said{
  display:inline-block;margin-top:4px;padding:2px 9px;border-radius:var(--r-pill);
  background:var(--warn-soft);color:var(--warn-ink);font-size:var(--fs-xs);font-weight:700;line-height:1.5;
}
.miss p{font-size:var(--fs-sm);color:var(--ink-3);margin-top:6px;line-height:1.45}
.miss .btn{flex:none}
.done .unlock-card{margin-top:var(--s5)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:300}
.confetti i{
  position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;opacity:0;
  animation-name:confetti;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards;
}
.confetti i:nth-child(3n){width:7px;height:7px;border-radius:50%}
.confetti i:nth-child(4n){width:12px;height:6px}
@keyframes confetti{
  0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}
  25%{transform:translate3d(18px,25vh,0) rotate(160deg)}
  50%{transform:translate3d(-14px,52vh,0) rotate(320deg)}
  80%{opacity:1}
  100%{opacity:0;transform:translate3d(10px,108vh,0) rotate(560deg)}
}

/* ---------------- moves ---------------- */
.moves .progress-card{margin-top:0}
.sec-title{
  font-family:var(--sans);font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:var(--s7) 0 var(--s3) var(--s1);
}
.move-list{
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;
}
.move-row{
  display:flex;align-items:center;gap:var(--s3);width:100%;min-height:58px;padding:var(--s3) var(--s4);
  background:none;border:0;border-top:1px solid var(--line);text-align:left;
  transition:background-color .15s;
}
.move-row:first-child{border-top:0}
.move-row:hover{background:var(--surface-2)}
.move-row:active{background:var(--surface-3)}
.move-row:focus-visible{outline-offset:-3px;border-radius:0}
.move-row::after{
  content:"";flex:none;width:8px;height:8px;margin-left:var(--s1);
  border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg);opacity:.6;
}
.mr-dot{
  flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--line-2);color:#fff;
}
.mr-dot.learning{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%, transparent 0)}
.mr-dot.locked{border-color:var(--ok);background:var(--ok)}
.mr-dot.locked .ic{width:14px;height:14px;stroke-width:3.2;vertical-align:0}
@media (prefers-color-scheme: dark){.mr-dot.locked{color:#06251a}}
.mr-dot.habit{border-color:var(--brand);background:var(--brand-soft)}
.mr-name{flex:1;min-width:0;font-weight:600;line-height:1.35;color:var(--ink)}
.mr-state{flex:none;font-size:var(--fs-xs);font-weight:700;color:var(--ink-3);white-space:nowrap}
.mr-state.learning{color:var(--warn-ink)}
.mr-state.locked{color:var(--ok-ink)}
.mr-state.habit{color:var(--brand-ink)}

/* guide (inside the modal) */
.g-move{
  font-size:var(--fs-md);font-weight:600;line-height:1.55;color:var(--ink) !important;
  padding:var(--s4);border-radius:var(--r-sm);background:var(--brand-soft);margin-bottom:var(--s3);letter-spacing:-.005em;
}
.modal-body .panel{margin-top:var(--s3);box-shadow:none;animation:none}
.modal-body .panel.warm p b{color:var(--warn-ink)}
.modal-body .sheet-foot{position:sticky;z-index:1;bottom:calc(-1 * var(--s5));margin:var(--s5) calc(-1 * var(--s5)) calc(-1 * var(--s5));padding:var(--s6) var(--s5) var(--s4);background:linear-gradient(color-mix(in srgb, var(--surface) 0%, transparent),var(--surface) 45%)}
details.trick{border-top:1px solid var(--line)}
details.trick:first-of-type{margin-top:var(--s3)}
details.trick summary{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:48px;padding:var(--s2) 0;
  font-weight:700;color:var(--ink);cursor:pointer;list-style:none;
}
details.trick summary::-webkit-details-marker{display:none}
details.trick summary::after{
  content:"";flex:none;width:8px;height:8px;margin-right:6px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s var(--ease);
}
details.trick[open] summary::after{transform:rotate(-135deg)}
details.trick summary:focus-visible{outline-offset:2px}
details.trick > *:not(summary){margin-bottom:var(--s3)}
details.trick[open] > *:not(summary){animation:rise .25s var(--ease) both}
.type{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.type span{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.type code{
  font-family:var(--mono);font-size:var(--fs-sm);padding:4px 10px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);overflow-wrap:anywhere;
  white-space:pre-wrap;
}

/* ---------------- forms (paste, unlock) ---------------- */
.panel.form{padding:var(--s5)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4);min-width:0}
.fld > span{font-size:var(--fs-sm);font-weight:700;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{
  width:100%;min-height:48px;padding:var(--s3) var(--s4);
  border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-size:var(--fs-md);line-height:1.45;
  transition:border-color .15s, box-shadow .15s;
}
.fld textarea{resize:vertical;min-height:180px;font-size:var(--fs-sm)}
.fld select{
  appearance:none;-webkit-appearance:none;padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;
}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-3);opacity:.8}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);outline:none}
.fld-row{display:grid;gap:0 var(--s3)}
@media (min-width:560px){.fld-row{grid-template-columns:1fr 1.6fr}}
.panel.form .btn.xl{width:100%;margin-top:var(--s2)}
#auth-code{font-family:var(--mono);font-size:24px;letter-spacing:.35em;text-align:center}

.note-warn{
  padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--warn-soft);border:1px solid var(--warn-line);
  color:var(--warn-ink);font-size:var(--fs-sm);font-weight:600;line-height:1.5;margin:var(--s3) 0;
}
.working{display:flex;align-items:center;gap:var(--s3);justify-content:center;min-height:56px;font-weight:700;color:var(--brand-ink)}
.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite;
}
.paste .verdict{margin-top:0;margin-bottom:var(--s3)}
.paste .panel.move .actions{margin-top:var(--s4)}

/* ---------------- unlock ---------------- */
.unlock-box{
  padding:var(--s6) var(--s5);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
}
@media (min-width:560px){.unlock-box{padding:var(--s7)}}
.unlock-box .hc-done{background:var(--ok-soft);color:var(--ok-ink);margin:0 auto var(--s4)}
.unlock-box .hc-done.spin{background:var(--brand-soft);color:var(--brand-ink)}
.unlock-box > h2{font-size:var(--fs-2xl);text-align:center;margin-bottom:var(--s2)}
.unlock-box > h2 ~ .muted{text-align:center}
.unlock-box > h2 ~ .btn{display:flex;margin:var(--s5) auto 0}
.price-tag{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s5)}
.price-tag b{font-family:var(--display);font-size:var(--fs-4xl);font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--ink)}
.price-tag span{font-weight:600;color:var(--ink-3)}
.unlock-box .ticks{padding-bottom:var(--s6);margin-bottom:var(--s6);border-bottom:1px solid var(--line)}
.step-lbl{font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:var(--s3)}
.step-lbl:empty{display:none}
.unlock-box .btn.xl{width:100%;margin:var(--s2) 0 var(--s3)}
.unlock-box .muted + .btn.xl{margin-top:var(--s4)}
.unlock-box .muted + .fld{margin-top:var(--s4)}
.unlock-box .small{text-align:center;color:var(--ink-3)}
.unlock-box .small + .small{margin-top:var(--s1)}

/* account modal */
.acct-email{display:flex;align-items:center;gap:var(--s2);color:var(--ink)}
.acct-email .ic{color:var(--ink-3)}
.owned{display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s3);padding:6px 12px 6px 8px;border-radius:var(--r-pill);background:var(--ok-soft);color:var(--ok-ink);font-weight:700;font-size:var(--fs-sm)}
.owned .ic{width:18px;height:18px;stroke-width:3;vertical-align:0}
.modal-body .actions.left{margin-top:var(--s3)}

/* ---------------- landing ---------------- */
.landing{max-width:calc(720px + 2 * var(--s4))}
@media (min-width:720px){.landing{max-width:calc(760px + 2 * var(--s6))}}
.land-hero{padding:var(--s6) 0 var(--s7)}
.land-hero h1{font-size:var(--fs-4xl);font-weight:800;letter-spacing:-.045em;line-height:1.02;text-wrap:balance}
.land-hero h1 span{
  background:linear-gradient(100deg,var(--brand) 10%,var(--accent) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{font-size:var(--fs-lg);line-height:1.55;color:var(--ink-2);margin-top:var(--s5);max-width:40ch;text-wrap:pretty}
.land-hero .actions{margin-top:var(--s6)}
@media (max-width:559px){.land-hero .actions.left{flex-direction:column}.land-hero .actions.left .btn{width:100%}}

.demo{
  position:relative;padding:var(--s6) var(--s5);border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
@media (min-width:560px){.demo{padding:var(--s7)}}
.demo .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-ink);margin-bottom:var(--s4)}
.demo-choices{display:grid;gap:var(--s2);margin:var(--s5) 0 var(--s3)}
@media (min-width:560px){.demo-choices{grid-template-columns:1fr 1fr}}
.demo-choice{
  display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) var(--s4) var(--s2) var(--s2);text-align:left;
  border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface);box-shadow:0 3px 0 var(--line-2);
  font-weight:700;font-size:var(--fs-lg);color:var(--ink);
  transition:transform .12s var(--ease),box-shadow .12s,border-color .15s,background-color .15s,opacity .2s;
}
.demo-choice:hover{border-color:var(--brand)}
.demo-choice:active{transform:translateY(3px);box-shadow:none}
.demo-choice .ltr{
  flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  background:var(--surface-2);font-size:var(--fs-sm);font-weight:800;color:var(--ink-3);
}
.demo-choice.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok-line);animation:pop .4s var(--spring)}
.demo-choice.right .ltr{background:var(--ok);color:#fff}
.demo-choice.wrong{border-color:var(--warn);background:var(--warn-soft);box-shadow:0 3px 0 var(--warn-line)}
.demo-choice.wrong .ltr{background:var(--warn);color:#3a2400}
.demo-choice.dim{opacity:.5}
.demo-reveal{
  margin-top:var(--s4);padding:var(--s4) var(--s5);border-radius:var(--r);
  background:var(--brand-soft);border:1px solid var(--brand-line);animation:verdict-pop .45s var(--spring) both;
}
.demo-reveal p{color:var(--ink);line-height:1.6}
.demo-reveal p + p{margin-top:var(--s3);color:var(--ink-2)}
.demo-steps{margin:var(--s3) 0 0;padding-left:1.25em;color:var(--ink);line-height:1.6}
.demo-steps li + li{margin-top:var(--s2)}
.demo-part{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.demo-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:var(--s2)}
.demo-label span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:6px}
.demo-reveal .demo-fix{margin-top:var(--s2);color:var(--ink)}
.demo-reveal .demo-why{margin-top:var(--s4);color:var(--ink-2)}

.how{margin-top:var(--s8)}
.how h2,.landing .unlock-card h2{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.03em}
.how-list{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:var(--s3);counter-reset:how}
@media (min-width:720px){.how-list{grid-template-columns:repeat(3,1fr)}}
.how-list li{
  counter-increment:how;position:relative;padding:var(--s5);padding-top:64px;
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  color:var(--ink-2);line-height:1.55;font-size:var(--fs-sm);
}
.how-list li::before{
  content:counter(how);position:absolute;left:var(--s5);top:var(--s5);
  display:grid;place-items:center;width:34px;height:34px;border-radius:11px;
  background:var(--brand-fill);color:#fff;font-family:var(--display);font-weight:800;font-size:var(--fs-md);
  box-shadow:0 2px 0 var(--brand-deep);
}
.how-list li:nth-child(2)::before{background:var(--accent);box-shadow:0 2px 0 var(--accent-ink);color:#2a0d02}
.how-list li:nth-child(3)::before{background:var(--ok);box-shadow:0 2px 0 var(--ok-ink);color:#04281a}
.how-list b{display:block;font-family:var(--display);font-size:var(--fs-lg);color:var(--ink);margin-bottom:var(--s1);letter-spacing:-.01em}
.landing .unlock-card{margin-top:var(--s7)}
.fine{margin:var(--s7) auto 0;max-width:56ch;text-align:center;font-size:var(--fs-xs);line-height:1.6;color:var(--ink-3)}

/* ---------------- modal ---------------- */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-backdrop{position:absolute;inset:0;background:rgba(16,12,40,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s ease both}
.modal-card{
  position:relative;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-lg);
  animation:sheet-up .38s var(--ease) both;
}
.modal-card::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line-2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s5) var(--s3) var(--s2) var(--s5)}
.modal-head h2{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em}
.modal-body{padding:var(--s2) var(--s5) var(--s5);overflow-y:auto;overscroll-behavior:contain;line-height:1.6;color:var(--ink-2)}
.modal-body > p{margin-bottom:var(--s3)}
.modal-body .actions{margin-top:var(--s4)}
@media (min-width:640px){
  .modal-root{align-items:center;padding:var(--s6)}
  .modal-card{width:min(640px,100%);max-height:86vh;border-radius:var(--r-lg);border-bottom:1px solid var(--line);animation:modal-in .3s var(--ease) both}
  .modal-card::before{display:none}
  .modal-head{padding:var(--s5) var(--s4) var(--s2) var(--s6)}
  .modal-body{padding:var(--s2) var(--s6) var(--s6)}
  .modal-body .sheet-foot{bottom:calc(-1 * var(--s6));margin-left:calc(-1 * var(--s6));margin-right:calc(-1 * var(--s6));margin-bottom:calc(-1 * var(--s6));padding:var(--s6) var(--s6) var(--s5)}
}
@keyframes fade{from{opacity:0}}
@keyframes sheet-up{from{transform:translateY(40px);opacity:0}}
@keyframes modal-in{from{transform:translateY(12px) scale(.98);opacity:0}}

/* ---------------- toast ---------------- */
.toast{
  position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));z-index:200;
  max-width:calc(100% - 32px);padding:12px 20px;border-radius:var(--r-pill);
  background:var(--ink);color:var(--bg);font-weight:600;font-size:var(--fs-sm);text-align:center;
  box-shadow:var(--shadow-lg);pointer-events:none;
  transform:translateX(-50%);
  animation:toast-in .35s var(--spring) both, toast-out .3s ease 2.1s forwards;
}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
@keyframes toast-out{to{opacity:0;transform:translate(-50%,8px)}}

/* a re-render of the same screen (next step, the answer) stays still */
.static .page,.static .panel:not(.traps),.static .opt,.static .verdict,.static .v-ic,
.static .pill.run,.static .steps li:not(:last-child){animation:none}
.verdict,.q-card .stem,.q-card .choices,.q-card .spr{scroll-margin-top:76px}
/* Keyboard focus never lands a choice under the sticky session bar. */
html:has(.s-top){scroll-padding-top:76px}
.page > .actions{scroll-margin-bottom:var(--s5)}

/* ---------------- reduced motion ---------------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
  .confetti{display:none}
}

/* ---------------- calculator ----------------
   A bottom sheet on phones, a docked panel beside the question on wide
   screens. The page makes room for it rather than hiding under it. */
.s-top .calc-btn{
  margin-left:0;width:auto;gap:6px;padding:0 10px;display:inline-flex;align-items:center;
  font:inherit;font-weight:700;font-size:var(--fs-sm);color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface);
}
.s-top .calc-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.s-top .calc-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:479px){.s-top .calc-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.s-top .calc-btn{padding:0;width:44px}}

.calc{
  --calc-h:min(56vh, 520px);
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--calc-h);
  display:flex;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line-2);box-shadow:var(--shadow-lg);
  padding-bottom:env(safe-area-inset-bottom);
}
.calc[hidden],.calc-note[hidden],.calc-host[hidden]{display:none}
.calc:focus{outline:none}
.calc-head{display:flex;align-items:center;gap:var(--s3);padding:2px var(--s2) 2px var(--s4);border-bottom:1px solid var(--line)}
.calc-head h2{flex:1;font-size:var(--fs-md);font-weight:800}
.calc-head .link-btn{font-size:var(--fs-sm)}
.calc-note{padding:var(--s4);color:var(--ink-2)}
.calc-note p{margin:0 0 var(--s3)}
.calc-host{flex:1;min-height:0;position:relative;background:#fff}
/* scroll-padding too, so a scroll to the buttons lands above the sheet, not behind it */
html.calc-open{scroll-padding-bottom:min(56vh, 520px)}
html.calc-open #shell{padding-bottom:min(56vh, 520px)}
.calc.calc-bare{height:auto}
html.calc-open.calc-bare{scroll-padding-bottom:240px}
html.calc-open.calc-bare #shell{padding-bottom:240px}

@media (min-width:960px){
  .calc{
    top:0;left:auto;width:min(460px, 40vw);height:auto;
    border-top:0;border-left:1px solid var(--line-2);padding-bottom:0;
  }
  html.calc-open,html.calc-open.calc-bare{scroll-padding-bottom:0}
  html.calc-open #shell,html.calc-open.calc-bare #shell{padding-bottom:0;margin-right:min(460px, 40vw)}
}

.tips-group{margin-top:var(--s5)}
.tips-group h4{font-size:var(--fs-md);font-weight:800;margin-bottom:var(--s1)}
.tips-group > p.muted{margin:0 0 var(--s2);font-size:var(--fs-sm)}
.tile.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:var(--s4)}
.tile.wide .tile-ic{margin-bottom:0}
.tile.wide .tile-name{margin-top:0}
.tile-txt{display:flex;flex-direction:column;gap:2px}
.tile.wide .tile-ic{background:var(--brand-soft);color:var(--brand-ink)}

/* ---------------- feedback ----------------
   Quiet on purpose: under the solution, one tap, easy to skip. */
.rate{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:var(--s2) 0 0}
.rate-q{flex:1;min-width:12ch;font-size:var(--fs-sm);font-weight:600;color:var(--ink-3)}
.rate-btn{

  rw093:{strat:'verb-time', traps:{0:'sounds-right',2:'wrong-tense',3:'wrong-tense'}},
  rw094:{strat:'apostrophe-count', traps:{0:'possessive-count',1:'possessive-count',3:'possessive-count'}},
  rw095:{strat:'apostrophe-count', traps:{1:'possessive-count',2:'possessive-count',3:'pronoun-ref'}},
  rw096:{strat:'modifier-attach', traps:{1:'dangling',2:'comma-splice',3:'dangling'}},
  rw097:{strat:'modifier-attach', traps:{1:'dangling',2:'dangling',3:'comma-splice'}},
  rw098:{traps:{0:'one-sided',1:'misread-data',3:'misread-data'}},
  rw099:{strat:'subject-verb', traps:{0:'agreement-by-ear',2:'agreement-by-ear',3:'wrong-tense'}},
  rw100:{traps:{0:'too-narrow',1:'extreme',2:'contradicts'}}
};

/* resolve the tags for a question */
window.tagsFor = function (q) {
  var t = window.TAGS[q.id] || {};
  return {
    strat: t.strat || window.SKILL_STRAT[q.skill] || null,
    traps: t.traps || {}
  };
};

<script>
/* ============================================================
   SAT LockIn, practice engine

   One untimed practice set at a time, always anchored to a move or a
   trap, plus the event log every list in the app is derived from.

   There is no full test. The adaptive module routing and score curves
   that used to live here went with it: Bluebook is the real test and the
   only score worth trusting.
   ============================================================ */
(function (global) {
    'use strict';

    /* ---------------- deterministic RNG (so an attempt can be replayed) ---- */
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, rnd) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    /* ---------------- question selection ---------------------------------- */
    function bankFor(sec) {
      if (sec === 'both') return (global.RW_BANK || []).concat(global.MATH_BANK || []);
      return sec === 'rw' ? global.RW_BANK : global.MATH_BANK;
    }

    /* ---------------- practice set ----------------------------------------
       config: {section: 'rw'|'math'|'both', filter, count, label, seed} */
    function Session(config) {
      this.cfg = config;
      this.cfg.kind = 'drill';
      this.seed = config.seed || (Date.now() % 2147483647);
      this.rnd = mulberry32(this.seed);
      this.mi = 0; // kept so the question screen can address mod()
      this.qi = 0; // question index
      this.startedAt = new Date().toISOString();
      this.id = 'a' + Date.now() + '-' + Math.floor(this.seed % 9973);
      this.finished = false;
      this.abcOn = false;
      this.listeners = {};

      var pool = bankFor(config.section || 'both').filter(config.filter || function () { return true; });
      pool = shuffle(pool, this.rnd).slice(0, config.count || 10);
      this.modules = [{
          section: config.section === 'both' || !config.section ? 'mixed' : config.section,
          kind: 'drill', num: 1,
          label: config.label || 'Practice set',
          questions: pool,
          state: pool.map(function () {
              return { choice: null, text: '', marked: false, struck: [], seconds: 0, visited: false, checked: false };
          }),
          done: false
      }];
      if (pool.length) this.modules[0].state[0].visited = true;
      this._qClock = Date.now();
    }

    Session.prototype.on = function (evt, fn) {
      (this.listeners[evt] = this.listeners[evt] || []).push(fn); return this;
    };
    Session.prototype.emit = function (evt, data) {
      (this.listeners[evt] || []).forEach(function (f) { f(data); });
    };

    Session.prototype.mod = function () { return this.modules[this.mi]; };
    Session.prototype.q = function () { return this.mod().questions[this.qi]; };
    Session.prototype.st = function () { return this.mod().state[this.qi]; };
    Session.prototype.isDrill = function () { return true; };
    Session.prototype.paneSection = function () {
      var m = this.mod();
      return m.section === 'mixed' ? (this.q() ? this.q().section : 'math') : m.section;
    };

    Session.prototype._chargeTime = function () {
      var now = Date.now();
      var st = this.mod().state[this.qi];
      if (st && this._qClock) st.seconds += Math.round((now - this._qClock) / 1000);
      this._qClock = now;
    };

    /* ---- answering ---- */
    Session.prototype.select = function (i) {
      var st = this.st(); if (!st) return;
      if (this.isDrill() && st.checked) return;
      st.choice = (st.choice === i) ? null : i;
      if (st.choice !== null && st.struck.indexOf(i) >= 0) {
        st.struck = st.struck.filter(function (x) { return x !== i; });
      }
      this.emit('change');
    };
    Session.prototype.setText = function (v) {
      var st = this.st(); if (!st) return;
      if (this.isDrill() && st.checked) return;
      st.text = v;
    };
    Session.prototype.toggleStrike = function (i) {
      var st = this.st(); var k = st.struck.indexOf(i);
      if (k >= 0) st.struck.splice(k, 1);
      else { st.struck.push(i); if (st.choice === i) st.choice = null; }
      this.emit('change');
    };
    Session.prototype.toggleMark = function () { this.st().marked = !this.st().marked; this.emit('change'); };
    Session.prototype.toggleAbc = function () { this.abcOn = !this.abcOn; this.emit('change'); };

    /* ---- navigation ---- */
    Session.prototype.goto = function (i) {
      var m = this.mod();
      if (i < 0 || i >= m.questions.length) return;
      this._chargeTime();
      this.qi = i; m.state[i].visited = true;
      this.emit('change');
    };
    Session.prototype.next = function () {
      if (this.qi < this.mod().questions.length - 1) this.goto(this.qi + 1);
      else this.finish();
    };
    Session.prototype.prev = function () { this.goto(this.qi - 1); };

    /* ---- grading ---- */
    Session.prototype.gradeQuestion = function (mod, i) {
      var q = mod.questions[i], st = mod.state[i];
      if (q.type === 'spr') {
        if (!st.text || !st.text.trim()) return null;
        return Session.checkSPR(st.text, q.answers || [q.answer]) ? true : false;
      }
      if (st.choice === null || st.choice === undefined) return null;
      return st.choice === q.answer;
    };
    Session.prototype.moduleRaw = function (mod) {
      var self = this, right = 0;
      mod.questions.forEach(function (q, i) { if (self.gradeQuestion(mod, i) === true) right++; });
      return right;
    };

    /* ---- results ---- */
    Session.prototype.finish = function () {
      if (this.finished) return this.result;
      this._chargeTime();
      this.finished = true;
      this.result = this.buildResult();
      var self = this, evs = [];
      this.modules.forEach(function (m) {
          m.questions.forEach(function (q, i) { evs.push(self.eventFor(m, i)); });
      });
      global.Store.recordEvents(evs);
      global.Store.saveAttempt(this.result);
      this.emit('finished', this.result);
      this.emit('change');
      return this.result;
    };

    Session.prototype.buildResult = function () {
      var self = this;
      var out = {
        id: this.id, kind: this.cfg.kind, seed: this.seed,
        startedAt: this.startedAt, finishedAt: new Date().toISOString(),
        label: this.cfg.label || null,
        sections: {}, items: []
      };
      /* Right and total per section, for the review filters. No score: a
         ten-question set says nothing honest about one. */
      this.modules.forEach(function (m) {
          m.questions.forEach(function (q, i) {
              var sec = out.sections[q.section] || (out.sections[q.section] = { raw: 0, total: 0, answered: 0 });
              sec.total++;
              var g = self.gradeQuestion(m, i);
              if (g === true) sec.raw++;
              if (g !== null) sec.answered++;
          });
      });
      this.modules.forEach(function (m) {
          m.questions.forEach(function (q, i) {
              var st = m.state[i], g = self.gradeQuestion(m, i);
              var tg = global.tagsFor ? global.tagsFor(q) : { strat: null, traps: {} };
              out.items.push({
                  qid: q.id, section: q.section,
                  domain: q.domain, skill: q.skill, difficulty: q.difficulty,
                  choice: st.choice, text: st.text, marked: st.marked,
                  correct: g, seconds: st.seconds,
                  strat: tg.strat,
                  trap: (g === false && st.choice !== null && st.choice !== undefined) ? (tg.traps[st.choice] || null) : null
              });
          });
      });
      return out;
    };

    Session.prototype.eventFor = function (mod, i) {
      var q = mod.questions[i], st = mod.state[i], g = this.gradeQuestion(mod, i);
      var tg = global.tagsFor ? global.tagsFor(q) : { strat: null, traps: {} };
      return {
        key: this.id + '|' + q.id,
        attempt: this.id, kind: this.cfg.kind, t: new Date().toISOString(),
        qid: q.id, section: q.section, domain: q.domain, skill: q.skill,
        difficulty: q.difficulty, strat: tg.strat,
        trap: (g === false && st.choice !== null && st.choice !== undefined) ? (tg.traps[st.choice] || null) : null,
        correct: g, seconds: st.seconds, marked: !!st.marked
      };
    };

    /* ---- student-produced response checking (SAT rules) ---- */
    /* Spaces and $ are ignored, as is a leading +. A comma only counts as
       a thousands separator (1,000 or 12,500.5); anything else, like a
       decimal comma in 1,5, is left in and does not read as a number. */
    function sprNorm(s) {
      return String(s).replace(/[\u2212\u2013]/g, '-').replace(/[$\s]/g, '').replace(/(\d),(?=\d{3}(?!\d))/g, '$1').replace(/^\+/, '');
    }
    function sprToNum(s) {
      if (!s) return null;
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {
        var p = s.split('/'); var d = parseFloat(p[1]);
        if (!d) return null;
        return parseFloat(p[0]) / d;
      }
      if (/^-?(\d+\.?\d*|\.\d+)%?$/.test(s)) return parseFloat(s);
      return null;
    }
    /* True when a typed grid-in answer reads as a number at all. */
    Session.sprReadable = function (raw) {
      /* "1 1/2" would read as 11/2; ask for 3/2 or 1.5 instead of grading it. */
      if (/\d\s+\d/.test(String(raw))) return false;
      return sprToNum(sprNorm(raw)) !== null;
    };
    Session.checkSPR = function (raw, accepted) {
      var norm = sprNorm, toNum = sprToNum;
      var s = norm(raw);
      if (!s) return false;
      var list = [].concat(accepted);
      for (var i = 0; i < list.length; i++) if (s === norm(list[i])) return true;
      var v = toNum(s);
      if (v === null) return false;
      var decimals = (s.split('.')[1] || '').length;
      for (var j = 0; j < list.length; j++) {
        var av = toNum(norm(list[j]));
        if (av === null) continue;
        if (Math.abs(v - av) < 1e-9) return true;
        if (decimals >= 3) { // SAT: 3+ digits, truncated or rounded
          var f = Math.pow(10, decimals);
          if (Math.abs(Math.trunc(av * f) / f - v) < 1e-9) return true;
          if (Math.abs(Math.round(av * f) / f - v) < 1e-9) return true;
        }
      }
      return false;
    };

    /* ---------------- persistence -----------------------------------------
       One event per answered question is the unit of record. Skill, strategy,
       and trap statistics are all derived from that log, which means there is
       only ever one thing to keep correct -- and it maps directly onto a row
       in the cloud database when the app is signed in. */
    var KEY = 'satprepme.v2';
    var MAX_EVENTS = 6000;

    var Store = {
      _read: function () {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
        catch (e) { return {}; }
      },
      _write: function (d) {
        try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
        if (global.Cloud && global.Cloud.onLocalWrite) global.Cloud.onLocalWrite(d);
      },
      data: function () {
        var d = this._read();
        d.name = d.name || 'Student';
        d.attempts = d.attempts || [];
        d.events = d.events || [];
        if (d.skills && !d._migrated) { d._migrated = true; }
        return d;
      },
      setName: function (n) { var d = this.data(); d.name = n; this._write(d); },

      /* upsert by key so re-recording the same question is idempotent */
      recordEvents: function (list) {
        if (!list || !list.length) return;
        var d = this.data();
        var idx = {};
        d.events.forEach(function (e, i) { idx[e.key] = i; });
        list.forEach(function (e) {
            if (e.correct === null || e.correct === undefined) return; // unanswered
            if (idx[e.key] !== undefined) d.events[idx[e.key]] = e;
            else { idx[e.key] = d.events.length; d.events.push(e); }
        });
        if (d.events.length > MAX_EVENTS) d.events = d.events.slice(-MAX_EVENTS);
        this._write(d);
        if (global.Cloud && global.Cloud.pushEvents) global.Cloud.pushEvents(list);
      },

      saveAttempt: function (res) {
        var d = this.data();
        d.attempts = d.attempts.filter(function (a) { return a.id !== res.id; });
        d.attempts.unshift(res);
        d.attempts = d.attempts.slice(0, 60);
        this._write(d);
        if (global.Cloud && global.Cloud.pushAttempt) global.Cloud.pushAttempt(res);
      },
      attempt: function (id) {
        return this.data().attempts.filter(function (a) { return a.id === id; })[0];
      },
      reset: function () { this._write({}); },

      /* ---------- aggregates, all derived from the event log ---------- */
      agg: function (events) {
        var evs = events || this.data().events;
        var out = { skills: {}, strats: {}, traps: {}, fams: {}, sections: {}, total: { seen: 0, right: 0 } };
        evs.forEach(function (e) {
            if (e.correct === null || e.correct === undefined) return;
            out.total.seen++; if (e.correct) out.total.right++;

            var sk = e.section + '|' + e.domain + '|' + e.skill;
            var s = out.skills[sk] || (out.skills[sk] = { key: sk, section: e.section, domain: e.domain, skill: e.skill, seen: 0, right: 0 });
            s.seen++; if (e.correct) s.right++;

            var sec = out.sections[e.section] || (out.sections[e.section] = { seen: 0, right: 0 });
            sec.seen++; if (e.correct) sec.right++;

            if (e.strat) {
              var st = out.strats[e.strat] || (out.strats[e.strat] = { id: e.strat, seen: 0, right: 0, recent: [] });
              st.seen++; if (e.correct) st.right++;
              st.recent.push(e.correct ? 1 : 0);
            }
            if (e.trap) {
              var tr = out.traps[e.trap] || (out.traps[e.trap] = { id: e.trap, n: 0, last: null, qids: [] });
              tr.n++; tr.last = e.t; if (tr.qids.indexOf(e.qid) < 0) tr.qids.push(e.qid);
              var fam = (global.TRAPS && global.TRAPS[e.trap]) ? global.TRAPS[e.trap].fam : 'other';

            }

        return out;
      },

      /* accuracy on the most recent n attempts of a strategy vs the n before */
      trend: function (stratId, n) {
        n = n || 8;
        var evs = this.data().events.filter(function (e) { return e.strat === stratId && e.correct !== null; });
        if (evs.length < n + 3) return null;
        var recent = evs.slice(-n), prior = evs.slice(-2 * n, -n);
        if (!prior.length) return null;
        var pctOf = function (a) { return a.filter(function (e) { return e.correct; }).length / a.length; };
        return Math.round(100 * (pctOf(recent) - pctOf(prior)));
      },

      weakestStrats: function (n, minSeen) {
        var a = this.agg().strats, out = [];
        Object.keys(a).forEach(function (k) { if (a[k].seen >= (minSeen || 3)) out.push(a[k]); });
        out.sort(function (x, y) { return (x.right / x.seen) - (y.right / y.seen); });
        return out.slice(0, n || 5);
      },
      topTraps: function (n) {
        var a = this.agg().traps, out = [];
        Object.keys(a).forEach(function (k) { out.push(a[k]); });
        out.sort(function (x, y) { return y.n - x.n; });
        return out.slice(0, n || 6);
      },
      weakest: function (n) { // by skill, kept for the older screens
        var a = this.agg().skills, out = [];
        Object.keys(a).forEach(function (k) { if (a[k].seen >= 3) out.push(a[k]); });
        out.sort(function (x, y) { return (x.right / x.seen) - (y.right / y.seen); });
        return out.slice(0, n || 5);
      },

      /* questions she has missed and has not since got right -- the retry queue */
      missedQueue: function (n) {
        /* Only questions from this app can be retried. A miss logged from an
           official practice test has no question here to come back to. */
        var evs = this.data().events.filter(function (e) { return e.correct !== null && e.qid; });
        var last = {};
        evs.forEach(function (e) { last[e.qid] = e; });
        var out = [];
        Object.keys(last).forEach(function (q) { if (last[q].correct === false) out.push(last[q]); });
        out.sort(function (a, b) { return (a.t < b.t) ? 1 : -1; });
        return out.slice(0, n || 20);
      },

      /* Coverage answers the real question: has she met all of this, and can she
       now beat it? A strategy or a trap counts as mastered once she has met it
       at least 3 times and got the most recent 3 right. "Meeting" a trap means
       answering a question that had that trap sitting among its choices, which
       is why this walks the bank rather than only the recorded misses. */
    coverage: function () {
      var bank = {};
      (global.RW_BANK || []).concat(global.MATH_BANK || []).forEach(function (q) { bank[q.id] = q; });
      var out = { strats: {}, traps: {} };

      function note(group, id, correct) {
        var c = out[group][id] || (out[group][id] = { id: id, seen: 0, right: 0, recent: [] });
        c.seen++;
        if (correct) c.right++;
        c.recent.push(correct ? 1 : 0);
        if (c.recent.length > 6) c.recent.shift();
      }

      this.data().events.forEach(function (e) {
        if (e.correct === null || e.correct === undefined) return;
        /* Questions made for this student live in TAGS, not the banks. */
        var q = bank[e.qid] || (e.qid && global.TAGS && global.TAGS[e.qid] ? { id: e.qid, skill: e.skill } : null);
        var tg = (q && global.tagsFor) ? global.tagsFor(q) : null;
        var strat = e.strat || (tg && tg.strat);
        if (strat) note('strats', strat, e.correct);
        if (tg && String(e.attempt).indexOf('lockin-') === 0) {
          /* A practice answer is one pick: a right one dodged every trap, a
             wrong one fell for at most the trap it picked. A right answer
             after steps were shown, "stuck", or seeing every step first
             says nothing about the traps: the steps may have ruled them out. */
          if (e.correct && !e.hints) {
            var dodged = {};
            Object.keys(tg.traps).forEach(function (k) { dodged[tg.traps[k]] = 1; });
            Object.keys(dodged).forEach(function (t) { note('traps', t, true); });
          }
          else if (e.trap) note('traps', e.trap, false);
        } else if (tg) {
          var ids = {};
          Object.keys(tg.traps).forEach(function (k) { ids[tg.traps[k]] = 1; });
          Object.keys(ids).forEach(function (t) { note('traps', t, e.correct); });
        } else if (e.trap) {
          note('traps', e.trap, false);
        }
      });

      ['strats', 'traps'].forEach(function (g) {
        Object.keys(out[g]).forEach(function (id) {
          var c = out[g][id];
          var last3 = c.recent.slice(-3);
          var clean = last3.length === 3 && last3.every(function (x) { return x === 1; });
          c.state = (c.seen >= 3 && clean) ? 'mastered' : 'learning';
        });
      });
