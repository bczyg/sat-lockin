<title>SAT LockIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* ============================================================
   SAT PrepMe \002014 styling modeled on the Bluebook digital test UI
   ============================================================ */
:root{
  --ink:#1e1e1e;
  --ink-soft:#4a4a4a;
  --line:#d4d4d4;
  --line-strong:#8f8f8f;
  --bg:#ffffff;
  --bg-soft:#f4f5f7;
  --blue:#1a4f8b;
  --blue-dark:#123a68;
  --blue-soft:#e8effa;
  --green:#0f7a4d;
  --green-soft:#e6f4ed;
  --red:#b3261e;
  --red-soft:#fbeae9;
  --amber:#8a6100;
  --amber-soft:#fdf3dc;
  --radius:8px;
  --shadow:0 2px 10px rgba(0,0,0,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg-soft);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.hidden{display:none !important}
h1,h2,h3,h4{line-height:1.25;margin:0}
a{color:var(--blue)}

/* ---------- generic buttons ---------- */
.btn{
  border:1px solid var(--blue);background:var(--blue);color:#fff;
  padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;
}
.btn:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.subtle{background:#fff;color:var(--ink);border-color:var(--line-strong)}
.btn.subtle:hover{background:var(--bg-soft)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{
  background:none;border:none;font-size:16px;color:var(--ink-soft);
  padding:6px 8px;border-radius:6px;line-height:1;
}
.icon-btn:hover{background:var(--bg-soft)}
.link-btn{background:none;border:none;color:var(--blue);text-decoration:underline;padding:0;font-size:inherit}

/* ============================================================
   HOME
   ============================================================ */
.home{max-width:1000px;margin:0 auto;padding:36px 24px 80px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--blue)}
.tagline{color:var(--ink-soft);font-size:15px;margin-top:4px}
.home-hr{height:1px;background:var(--line);margin:22px 0 26px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.card h3{font-size:17px}
.card p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5}
.card .spacer{flex:1}
.card .meta{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark);
}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--bg-soft);color:var(--ink-soft)}
.pill.soft{background:var(--brand-soft);color:var(--brand-ink)}

.section-title{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin:34px 0 14px}

/* progress bars */
.bar{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.good>i{background:var(--green)}
.bar.mid>i{background:#c99700}
.bar.bad>i{background:var(--red)}
.skill-row{display:grid;grid-template-columns:1fr 90px 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.skill-row:last-child{border-bottom:none}
.skill-row .n{color:var(--ink-soft);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

table.plain{border-collapse:collapse;width:100%;font-size:14px}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
table.plain th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft)}
table.data{border-collapse:collapse;margin:14px 0;font-size:15px}
table.data th,table.data td{border:1px solid var(--line-strong);padding:6px 14px;text-align:center}
table.data th{background:var(--bg-soft);font-weight:700}

/* ============================================================
   TEST RUNNER
   ============================================================ */
.exam{display:flex;flex-direction:column;height:100vh;background:#fff}
.exam-top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:10px 22px 8px;border-bottom:2px dashed var(--line-strong);gap:12px;
}
.exam-top .sec-name{font-weight:700;font-size:15px}
.exam-top .sec-sub{font-size:12.5px;color:var(--ink-soft)}
.timer-wrap{text-align:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.warn{color:var(--red)}
.timer-hidden{font-size:15px;color:var(--ink-soft);letter-spacing:.5px}
.timer-actions{display:flex;gap:6px;justify-content:center;margin-top:2px}
.timer-actions button{font-size:11.5px;color:var(--blue);background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.tools{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.tool{
  background:#fff;border:1px solid transparent;border-radius:6px;padding:6px 9px;
  font-size:12.5px;color:var(--ink);display:flex;gap:5px;align-items:center;
}
.tool:hover{background:var(--bg-soft)}
.tool.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark);font-weight:600}

/* body: two-pane for RW, single for math */
.exam-body{flex:1;display:flex;min-height:0}
.pane{padding:22px 30px;overflow-y:auto}
.pane-left{width:50%;border-right:2px solid var(--line-strong)}
.pane-right{width:50%}
.exam-body.single .pane-right{width:100%;max-width:780px;margin:0 auto}
.passage{font-family:var(--serif);font-size:17px;line-height:1.62}
.passage p{margin:0 0 14px}
.passage .blurb{font-style:italic;color:var(--ink-soft);font-size:15px}
.passage .cite{font-size:14px;color:var(--ink-soft);margin-top:-4px}

.qhead{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border-radius:4px;padding:6px 10px;margin-bottom:16px}
.qnum{background:var(--ink);color:#fff;font-weight:700;font-size:14px;width:26px;height:26px;border-radius:4px;display:grid;place-items:center}
.qhead .mark{margin-left:auto}
.qhead .abc{font-size:12.5px}
.stem{font-size:16.5px;line-height:1.55;margin-bottom:18px}
.stem p{margin:0 0 12px}
.stem .quote{font-family:var(--serif);background:var(--bg-soft);border-left:3px solid var(--line-strong);padding:10px 14px;margin:0 0 14px}
.figure{margin:0 0 18px;text-align:center}
.figure svg{max-width:100%;height:auto}
.figure .cap{font-size:13px;color:var(--ink-soft);margin-top:6px}

.choices{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.choice{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  border:2px solid var(--line-strong);border-radius:var(--radius);background:#fff;
  padding:11px 13px;font-size:16px;line-height:1.45;color:var(--ink);position:relative;
}
.choice:hover{background:var(--bg-soft)}
.choice .ltr{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);
  display:grid;place-items:center;font-size:13.5px;font-weight:700;
}
.choice.sel{border-color:var(--blue);background:var(--blue-soft)}
.choice.sel .ltr{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.struck{opacity:.5}
.choice.struck .txt{text-decoration:line-through}
.choice .strike-btn{
  position:absolute;right:-34px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);
  background:#fff;font-size:11px;font-weight:700;color:var(--ink-soft);display:none;place-items:center;
}
.abc-on .choice .strike-btn{display:grid}
.abc-on .choices{padding-right:38px}
.choice.correct{border-color:var(--green);background:var(--green-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice .tag{position:absolute;right:10px;top:-11px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.choice.correct .tag{background:var(--green);color:#fff}
.choice.wrong .tag{background:var(--red);color:#fff}

.spr{margin-top:6px}
.spr input{
  font-size:20px;padding:10px 14px;border:2px solid var(--line-strong);border-radius:var(--radius);
  width:230px;font-family:var(--mono);
}
.spr input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.spr .rules{font-size:13px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
.spr .preview{font-size:13.5px;color:var(--ink-soft);margin-top:8px}

.exam-bottom{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:12px 22px;border-top:1px solid var(--line);gap:12px;background:#fff;
}
.exam-bottom .who{font-weight:700;font-size:14px}
.nav-btn{
  background:var(--blue);color:#fff;border:none;border-radius:999px;padding:10px 26px;font-weight:700;font-size:15px;
}
.nav-btn:hover{background:var(--blue-dark)}
.nav-btn.gray{background:#fff;color:var(--blue);border:1px solid var(--line-strong)}
.navigator-toggle{
  background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-weight:600;font-size:14px;
}
.bottom-right{display:flex;gap:10px;justify-content:flex-end}

/* navigator popup */
.navpop{
  position:fixed;left:50%;transform:translateX(-50%);bottom:66px;width:min(560px,92vw);
  background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 18px;z-index:40;
}
.navpop h4{text-align:center;font-size:15px;margin-bottom:6px}
.navpop .legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.navpop .legend i{font-style:normal}
.qgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.qcell{
  position:relative;border:1px dashed var(--blue);background:#fff;color:var(--blue);
  border-radius:3px;height:32px;font-size:13.5px;font-weight:600;
}
.qcell.answered{background:var(--blue);color:#fff;border-style:solid}
.qcell.cur::after{content:"\0025BE";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--ink);font-size:13px}
.qcell.marked::before{content:"\002691";position:absolute;top:-8px;right:-4px;color:var(--red);font-size:12px}
.navpop .foot{display:flex;gap:10px;justify-content:center;margin-top:14px}

/* highlighter */
.hl{background:#ffe98a;border-radius:2px}
.note-bubble{
  position:fixed;background:#fff;border:1px solid var(--line-strong);border-radius:6px;
  box-shadow:var(--shadow);padding:8px;z-index:60;display:flex;gap:6px;
}

/* break screen / transitions */
.centered{
  flex:1;display:grid;place-items:center;text-align:center;padding:40px;
}
.centered .box{max-width:620px}
.centered h2{font-size:26px;margin-bottom:10px}
.centered p{color:var(--ink-soft);font-size:16px;line-height:1.6}
.bigtimer{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin:18px 0}
.dirs{text-align:left;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:20px 0;font-size:14.5px;line-height:1.6}
.dirs ul{margin:8px 0 0 18px;padding:0}
.dirs li{margin-bottom:6px}

/* ============================================================
   TEACHING LAYER (drill mode + review)
   ============================================================ */
.help-stack{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.help-btns{display:flex;gap:8px;flex-wrap:wrap}
.help-card{border:1px solid var(--line);border-left:4px solid var(--blue);background:#fff;border-radius:6px;padding:14px 16px}
.help-card h4{font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.help-card.strategy{border-left-color:#7a3fa5}
.help-card.strategy h4{color:#7a3fa5}
.help-card.steps{border-left-color:var(--green)}
.help-card.steps h4{color:var(--green)}
.help-card.traps{border-left-color:var(--red)}
.help-card.traps h4{color:var(--red)}
.help-card p{margin:0 0 10px;font-size:15px;line-height:1.6}
.help-card p:last-child{margin-bottom:0}
.help-card ol,.help-card ul{margin:0;padding-left:22px;font-size:15px;line-height:1.65}
.help-card ol li,.help-card ul li{margin-bottom:8px}
.help-card ol li:last-child,.help-card ul li:last-child{margin-bottom:0}
.trap-row{display:flex;gap:10px;font-size:14.5px;line-height:1.55;margin-bottom:9px}
.trap-row:last-child{margin-bottom:0}
.trap-row b{flex:none;width:20px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin:16px 0 4px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.mathwork{font-family:var(--mono);font-size:14.5px;background:var(--bg-soft);border-radius:4px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;line-height:1.7}

/* review list */
.review-wrap{max-width:1060px;margin:0 auto;padding:28px 24px 80px}
.score-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:18px 0 8px}
.score-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center}
.score-box .big{font-size:40px;font-weight:800;letter-spacing:-1px}
.score-box .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft)}
.score-box .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.qlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.qrow{
  display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;text-align:left;font-size:14px;width:100%;
}
.qrow:hover{border-color:var(--blue)}
.qrow .badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.qrow .badge.ok{background:var(--green)}
.qrow .badge.no{background:var(--red)}
.qrow .badge.skip{background:var(--line-strong)}
.qrow .skill{color:var(--ink-soft);font-size:12.5px}
.filters{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}

/* modal */
.modal-root{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal-card{
  position:relative;background:#fff;border-radius:10px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:18px}
.modal-body{padding:20px;overflow-y:auto;font-size:15px;line-height:1.6}
.modal-body h3{font-size:15px;margin:18px 0 8px}
.modal-body h3:first-child{margin-top:0}
.modal-body ul,.modal-body ol{padding-left:22px;margin:0 0 12px}
.modal-body li{margin-bottom:7px}
.modal-body p{margin:0 0 12px}

/* calculator + reference */
.calc{width:250px}
.calc .screen{
  font-family:var(--mono);font-size:22px;text-align:right;padding:12px;background:#111;color:#0f0;
  border-radius:6px;margin-bottom:10px;min-height:52px;word-break:break-all;
}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{padding:12px 0;border:1px solid var(--line-strong);background:#fff;border-radius:6px;font-size:15px}
.calc .keys button:hover{background:var(--bg-soft)}
.calc .keys button.op{background:var(--bg-soft);font-weight:700}
.calc .keys button.eq{background:var(--blue);color:#fff;border-color:var(--blue)}
.refsheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;font-size:14px}
.refsheet .item{border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;background:#fff}
.refsheet .item b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:700}
.refsheet .item .f{font-family:var(--serif);font-size:16px}

.strat-list details{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:0 14px}
.strat-list summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:15px}
.strat-list summary::marker{color:var(--blue)}
.strat-list .inner{padding:0 0 14px;font-size:14.5px;line-height:1.65}
.strat-list .inner ol{padding-left:20px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:200;box-shadow:var(--shadow);
}
.note{font-size:13px;color:var(--ink-soft);line-height:1.55}
kbd{font-family:var(--mono);font-size:12px;background:var(--bg-soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}

@media (max-width:820px){
  .exam-body{flex-direction:column}
  .pane-left,.pane-right{width:100% !important;border-right:none}
  .pane-left{border-bottom:2px solid var(--line-strong);max-height:44vh}
  .exam-top,.exam-bottom{grid-template-columns:1fr;gap:8px;text-align:center}
  .tools{justify-content:center}
  .bottom-right{justify-content:center}
  .score-hero{grid-template-columns:1fr}
  .qgrid{grid-template-columns:repeat(6,1fr)}
}

/* ============================================================
   DECOY \002014 shell redesign
   ------------------------------------------------------------
   Deliberate split: everything INSIDE a timed module keeps the austere
   Bluebook styling above, because test fidelity is the point. Everything
   AROUND it \002014 home, diagnosis, sign-in, class \002014 is warmer and built for
   a 16-year-old to want to open it.

   Palette: flat indigo brand (no gradients), spotlight yellow for wins,
   cool-biased neutrals. The exam blue above is intentionally a different
   blue so the test still looks like the test.
   ============================================================ */
:root{
  --brand:#4f46e5;
  --brand-dark:#3730a3;
  --brand-soft:#eef0fe;
  --brand-ink:#211d5c;
  --spot:#ffd166;
  --spot-dark:#8a6100;
  --shell-bg:#f5f6fb;
  --shell-card:#ffffff;
  --shell-line:#e3e5f0;
  --shell-ink:#14161f;
  --shell-soft:#5b6072;
  --display:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-lg:18px;
  --r-md:12px;
}

/* ---- shell typography & ground ---- */
.home,.review-wrap,.auth-wrap{font-family:var(--body);color:var(--shell-ink)}
.home,.review-wrap{background:var(--shell-bg)}
body{background:var(--shell-bg)}
.home h1,.home h2,.home h3,.review-wrap h1,.review-wrap h2,.review-wrap h3,
.auth-card h1,.brand,.score-box .big,.leak h3{font-family:var(--display);letter-spacing:-.02em}
.home h3,.review-wrap h3{text-wrap:balance}

.brand{font-size:34px;font-weight:800;letter-spacing:-.035em}
.brand span{color:var(--brand)}
.tagline{color:var(--shell-soft);font-size:15.5px;max-width:62ch;line-height:1.5}
.home-hr{background:var(--shell-line)}
.section-title{color:var(--shell-soft);font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em}

/* ---- greeting row ---- */
.greet{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.greet .hi{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--shell-line);color:var(--shell-soft);
  font-variant-numeric:tabular-nums;
}
.chip.streak{background:#fff8e6;border-color:#f3dfa4;color:var(--spot-dark)}
.chip.up{background:var(--green-soft);border-color:#bfe3d0;color:var(--green)}
.chip.down{background:var(--red-soft);border-color:#f3c9c6;color:var(--red)}
.chip.flat{background:var(--shell-bg)}
.chip.acct{cursor:pointer}
.chip.acct:hover{border-color:var(--brand);color:var(--brand)}
.chip.live{background:var(--brand-soft);border-color:#c9cdfa;color:var(--brand-ink)}

/* ---- the mission card: what to do next, derived from her data ---- */
.mission{
  background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:26px 28px;
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:20px 0 8px;
  box-shadow:0 10px 26px rgba(79,70,229,.22);
}
.mission .m-body{flex:1;min-width:260px}
.mission .m-kicker{
  font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  opacity:.82;margin-bottom:8px;
}
.mission h2{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;color:#fff}
.mission p{margin:0;font-size:15px;line-height:1.55;opacity:.94;max-width:60ch}
.mission .btn{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
.mission .btn:hover{background:var(--spot);border-color:var(--spot);color:#3a2c00}
.mission .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.mission .btn.ghost:hover{background:rgba(255,255,255,.14);color:#fff}
.mission .m-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---- cards ---- */
.card{
  background:var(--shell-card);border:1px solid var(--shell-line);border-radius:var(--r-lg);
  padding:22px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
.card h3{font-size:18px;font-weight:700}
.card p{color:var(--shell-soft);font-size:14.5px}
.card .meta{color:var(--shell-soft)}
.mode-card{position:relative;overflow:hidden}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(20,22,31,.08);border-color:#cfd3ea}
.mode-card .icon{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-size:22px;background:var(--brand-soft);margin-bottom:14px;
}
.mode-card.full .icon{background:#e8f3ff}
.mode-card.sec .icon{background:var(--green-soft)}
.mode-card.skill .icon{background:#fff8e6}
.mode-card.diag .icon{background:#fdeaf4}

.pill{background:var(--brand-soft);color:var(--brand-ink);font-size:11px;letter-spacing:.09em}
.btn{border-radius:999px;font-family:var(--body);font-weight:700}
.btn.big{padding:13px 26px;font-size:16px;width:100%}
.home .btn,.review-wrap .btn,.auth-card .btn{background:var(--brand);border-color:var(--brand)}
.home .btn:hover,.review-wrap .btn:hover,.auth-card .btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.home .btn.ghost,.review-wrap .btn.ghost{background:#fff;color:var(--brand)}
.home .btn.ghost:hover,.review-wrap .btn.ghost:hover{background:var(--brand-soft)}
.home .btn.subtle,.review-wrap .btn.subtle{background:#fff;color:var(--shell-ink);border-color:var(--shell-line)}
.home .btn.subtle:hover,.review-wrap .btn.subtle:hover{background:var(--shell-bg);border-color:#cfd3ea}

/* ---- stat tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:14px}
.tile{background:#fff;border:1px solid var(--shell-line);border-radius:var(--r-md);padding:16px 18px}
.tile .t-lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--shell-soft)}
.tile .t-val{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .t-sub{font-size:12.5px;color:var(--shell-soft);margin-top:2px}
.tile.spot{background:#fffdf5;border-color:#f3dfa4}

/* ---- leaks (top decoys) ---- */
.leaks{display:flex;flex-direction:column;gap:12px}
.leak{
  display:flex;gap:18px;background:#fff;border:1px solid var(--shell-line);
  border-radius:var(--r-lg);padding:20px 22px;border-left:5px solid var(--brand);
}
.leak-rank{
  flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;
}
.leak-body{flex:1}
.leak h3{font-size:19px;font-weight:700;margin-bottom:2px}
.leak-n{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--red);
  background:var(--red-soft);padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:6px}
.leak-fam{font-size:12.5px;color:var(--shell-soft);margin:0 0 10px}
.leak p{font-size:14.5px;line-height:1.6;margin:0 0 8px;color:var(--shell-ink)}
.leak .card-actions{margin-top:12px}

.strat-row{
  display:grid;grid-template-columns:1fr 120px 60px 150px 110px;gap:14px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--shell-line);font-size:14.5px;
}
.strat-row:last-child{border-bottom:none}
.strat-move-sm{font-size:12.5px;color:var(--shell-soft);margin-top:3px;line-height:1.45}
.strat-move{font-size:14px;color:var(--brand-ink);background:var(--brand-soft);
  padding:8px 12px;border-radius:8px;margin:0 0 10px !important}

/* ---- trap naming inside explanations ---- */
.help-card.caught{border-left-color:#c2410c;background:#fffaf6}
.help-card.caught h4{color:#c2410c}
.trap-name{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.trap-fam{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--shell-soft);background:var(--shell-bg);padding:3px 9px;border-radius:999px;margin-left:10px}
.trap-count{font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-soft);
  padding:3px 9px;border-radius:999px;margin-left:8px}
.trap-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:var(--ink);color:#fff;padding:2px 8px;border-radius:5px;margin-right:6px;white-space:nowrap}

/* ---- AI tutor ---- */
.help-card.ai{border-left-color:#7c3aed;background:#fcfaff}
.help-card.ai h4{color:#7c3aed}
.ai-thread{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
.ai-thread:empty{display:none}
.ai-you{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 14px;
  border-radius:14px 14px 4px 14px;font-size:14.5px;max-width:85%;line-height:1.45}
.ai-answer{background:#fff;border:1px solid #e6dcfa;border-radius:14px 14px 14px 4px;
  padding:12px 15px;font-size:14.5px;line-height:1.6;max-width:92%}
.ai-answer p{margin:0 0 9px}
.ai-answer p:last-child{margin-bottom:0}
.ai-meta{font-size:11px;color:var(--shell-soft);margin-top:8px;font-variant-numeric:tabular-nums}
.ai-wait{font-size:14px;color:var(--shell-soft);font-style:italic}
.ai-err{font-size:14px;color:var(--red);background:var(--red-soft);padding:9px 13px;border-radius:10px}
.ai-controls{display:flex;gap:8px;margin-top:12px}
.ai-controls input{
  flex:1;font-family:var(--body);font-size:14.5px;padding:10px 14px;
  border:1px solid var(--shell-line);border-radius:999px;
}
.ai-controls input:focus{outline:2px solid var(--brand);border-color:var(--brand)}

/* ---- sign in ---- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px;
  background:radial-gradient(120% 90% at 50% 0%,#eef0fe 0%,var(--shell-bg) 60%)}
.auth-card{
  width:min(430px,100%);background:#fff;border:1px solid var(--shell-line);
  border-radius:22px;padding:34px 32px;box-shadow:0 18px 44px rgba(20,22,31,.10);text-align:center;
}
.auth-mark{font-size:42px;line-height:1;margin-bottom:12px}
.auth-card h1{font-size:34px;font-weight:800;letter-spacing:-.035em;margin-bottom:8px}
.auth-sub{color:var(--shell-soft);font-size:14.5px;line-height:1.55;margin:0 0 6px}
.auth-class{font-size:13px;font-weight:700;color:var(--brand);margin:0 0 18px}
.fld{display:block;text-align:left;margin:18px 0 14px}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--shell-soft);margin-bottom:6px}
.fld input{
  width:100%;font-family:var(--body);font-size:16px;padding:12px 14px;
  border:1.5px solid var(--shell-line);border-radius:var(--r-md);background:#fff;color:var(--shell-ink);
}
.fld input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
#auth-code{font-family:var(--mono);font-size:26px;letter-spacing:.34em;text-align:center}
.auth-note{font-size:12.5px;color:var(--shell-soft);line-height:1.5;margin:12px 0 0}
.auth-sent{font-size:14.5px;margin:14px 0 0}
.auth-err{font-size:13.5px;color:var(--red);background:var(--red-soft);padding:10px 13px;border-radius:10px;margin-top:14px}
.auth-msg{font-size:13.5px;color:var(--green);background:var(--green-soft);padding:10px 13px;border-radius:10px;margin-top:14px}
.auth-alt{margin-top:24px;padding-top:18px;border-top:1px solid var(--shell-line)}
.code-pill{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.12em;
  background:var(--brand-soft);color:var(--brand-ink);display:inline-block;padding:8px 18px;border-radius:10px;margin:6px 0}

/* ---- review + score ---- */
.score-box{border-radius:var(--r-lg);border-color:var(--shell-line)}
.score-box .big{font-family:var(--display);font-weight:800;letter-spacing:-.04em}
.qrow{border-radius:var(--r-md);border-color:var(--shell-line)}
.qrow:hover{border-color:var(--brand)}
.bar{border-color:var(--shell-line)}
.bar>i{background:var(--brand)}

@media (prefers-reduced-motion:reduce){
  .card,.mode-card{transition:none}
  .mode-card:hover{transform:none}
}
@media (max-width:700px){
  .strat-row{grid-template-columns:1fr 70px;gap:8px}
  .strat-row>div:nth-child(4),.strat-row>div:nth-child(5){grid-column:1/-1;text-align:left}
  .mission{padding:22px}
  .brand{font-size:28px}
}

.greet .hi span{color:var(--brand)}
.auth-card h1 span{color:var(--brand)}

/* ============================================================
   PALETTES
   ------------------------------------------------------------
   Five shell palettes. The student picks one; it is remembered.

   Rules every palette obeys:
   * --brand clears 4.5:1 against white, so it is legible both as
     text on white and as a background under white text.
   * Red is never a palette colour. It stays reserved for momentary
     error states, because red exposure is the one colour effect with
     solid evidence of impairing achievement-task performance.
   * Green stays the "correct" signal, so no palette uses a brand
     colour close enough to be confused with it.
   * The attribute is data-palette, NOT data-theme -- the artifact host
     stamps data-theme on the root element for light/dark and would
     collide with it.
   * Exam screens are deliberately excluded. Inside a timed module the
     Bluebook palette holds, whatever palette is chosen.
   ============================================================ */

/* ---- Focus (default): aqua + coral. Calm base, warm reward. ---- */
:root,
:root[data-palette="focus"]{
  --brand:#0e7490;
  --brand-dark:#0c5f77;
  --brand-deep:#155e75;
  --brand-soft:#e0f4fa;
  --brand-ink:#0c4a6e;
  --spot:#ff7a5c;
  --spot-soft:#fff1ed;
  --spot-line:#ffd0c4;
  --spot-dark:#9a3412;
  --shell-bg:#f4f8fa;
  --shell-line:#dde8ec;
  --shell-soft:#556b73;
}

/* ---- Arcade: electric blue + lime. Highest energy. ---- */
:root[data-palette="arcade"]{
  --brand:#2563eb;
  --brand-dark:#1d4ed8;
  --brand-deep:#1e3a8a;
  --brand-soft:#e6edfe;
  --brand-ink:#1e3a8a;
  --spot:#a3e635;
  --spot-soft:#f4fce3;
  --spot-line:#d3ee9b;
  --spot-dark:#3f6212;
  --shell-bg:#f5f6fb;
  --shell-line:#e3e5f0;
  --shell-soft:#5b6072;
}

/* ---- Sunset: magenta + amber. Warmest. ---- */
:root[data-palette="sunset"]{
  --brand:#be185d;
  --brand-dark:#9d174d;
  --brand-deep:#831843;
  --brand-soft:#fce7f0;
  --brand-ink:#831843;
  --spot:#fbbf24;
  --spot-soft:#fff8e6;
  --spot-line:#f3dfa4;
  --spot-dark:#92400e;
  --shell-bg:#fbf6f8;
  --shell-line:#eddde4;
  --shell-soft:#6b5560;
}

/* ---- Grove: forest + peach. Quietest. ---- */
:root[data-palette="grove"]{
  --brand:#047857;
  --brand-dark:#036249;
  --brand-deep:#064e3b;
  --brand-soft:#e0f5ee;
  --brand-ink:#064e3b;
  --spot:#fdba74;
  --spot-soft:#fff5ec;
  --spot-line:#fbd7b0;
  --spot-dark:#9a3412;
  --shell-bg:#f5f9f7;
  --shell-line:#dfeae5;
  --shell-soft:#526b61;
}

/* ---- Violet: indigo + sunshine. The original. ---- */
:root[data-palette="violet"]{
  --brand:#4f46e5;
  --brand-dark:#3730a3;
  --brand-deep:#3730a3;
  --brand-soft:#eef0fe;
  --brand-ink:#211d5c;
  --spot:#ffd166;
  --spot-soft:#fff8e6;
  --spot-line:#f3dfa4;
  --spot-dark:#8a6100;
  --shell-bg:#f5f6fb;
  --shell-line:#e3e5f0;
  --shell-soft:#5b6072;
}

/* ---- palette-aware surfaces (were hard-coded to indigo/yellow) ---- */
.mission{background:var(--brand-deep);box-shadow:0 10px 26px rgba(12,74,110,.20)}
.chip.streak{background:var(--spot-soft);border-color:var(--spot-line);color:var(--spot-dark)}
.tile.spot{background:var(--spot-soft);border-color:var(--spot-line)}
.mode-card .icon{background:var(--brand-soft)}
.mode-card.full .icon{background:var(--brand-soft)}
.mode-card.sec .icon{background:var(--green-soft)}
.mode-card.skill .icon{background:var(--spot-soft)}
.mode-card.diag .icon{background:var(--brand-soft)}
.mission .btn:hover{background:var(--spot);border-color:var(--spot);color:var(--spot-dark)}
.auth-wrap{background:radial-gradient(120% 90% at 50% 0%,var(--brand-soft) 0%,var(--shell-bg) 62%)}
.help-card.caught{border-left-color:var(--spot-dark);background:var(--spot-soft)}
.help-card.caught h4{color:var(--spot-dark)}

/* ---- the picker ---- */
.pal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pal{
  border:2px solid var(--shell-line);border-radius:14px;padding:14px;background:#fff;
  text-align:left;cursor:pointer;transition:border-color .12s ease,transform .12s ease;
}
.pal:hover{transform:translateY(-2px)}
.pal.on{border-color:var(--shell-ink)}
.pal .swatches{display:flex;gap:5px;margin-bottom:10px}
.pal .sw{width:26px;height:26px;border-radius:8px}
.pal .nm{font-family:var(--display);font-weight:700;font-size:15px}
.pal .ds{font-size:12px;color:var(--shell-soft);line-height:1.4;margin-top:3px}
.pal .on-tag{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}

/* ============================================================
   ICONS + SIMPLER SURFACES
   Line icons instead of emoji: they inherit colour, stay crisp at any
   size, and look the same on every operating system.
   ============================================================ */
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}
.mode-card .icon .ic{width:22px;height:22px;color:var(--brand)}
.mode-card.sec .icon .ic{color:var(--green)}
.mode-card.skill .icon .ic{color:var(--spot-dark)}
.chip .ic{width:15px;height:15px;vertical-align:-3px}
.tool .ic{width:17px;height:17px}
.qhead .mark .ic{width:16px;height:16px}
.auth-mark .ic{width:46px;height:46px;color:var(--brand)}
.icon-btn .ic{width:18px;height:18px}

/* the exam toolbar reads as labels, not a row of pictures */
.tool{gap:6px;font-weight:500}
.qhead .mark{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.qhead .mark:hover{color:var(--blue)}
.qhead .mark.on{color:var(--red)}
.qhead .mark.on .ic{fill:currentColor}

/* navigator legend in words */
.navpop .legend i{display:flex;align-items:center;gap:6px}
.navpop .legend i::before{content:"";width:12px;height:12px;border-radius:3px;display:inline-block}
.navpop .legend .lg-un::before{border:1px dashed var(--blue)}
.navpop .legend .lg-an::before{background:var(--blue)}
.navpop .legend .lg-mk::before{background:var(--red)}

/* verdict reads as words, no glyph */
.verdict{font-family:var(--display);font-size:19px;letter-spacing:-.01em}

/* flatter, simpler cards: one border, no competing shadows */
.card{box-shadow:none}
.leak{border-left-width:4px}
.mission{box-shadow:0 8px 22px rgba(0,0,0,.10)}

/* ---- coverage checklist ---- */
.cv-row{
  display:grid;grid-template-columns:1fr 110px 110px;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--shell-line);font-size:14.5px;
}
.cv-row:last-child{border-bottom:none}
.cv{
  display:inline-block;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.cv.done{background:var(--green-soft);color:var(--green)}
.cv.learn{background:var(--spot-soft);color:var(--spot-dark)}
.cv.new{background:var(--shell-bg);color:var(--shell-soft)}
@media (max-width:700px){
  .cv-row{grid-template-columns:1fr 80px;gap:8px}
  .cv-row>div:nth-child(3){grid-column:1/-1;text-align:left}
}

/* The generic .home .btn rule below the mission rules was overriding the
   mission card's own buttons, leaving brand-on-brand text. These win. */
.home .mission .btn{background:#fff;color:var(--brand-deep);border-color:#fff}
.home .mission .btn:hover{background:var(--spot);border-color:var(--spot);color:var(--spot-dark)}
.home .mission .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.home .mission .btn.ghost:hover{background:rgba(255,255,255,.16);color:#fff;border-color:#fff}

/* ---- logging a practice test ---- */
.mode-card.log .icon{background:var(--brand-soft)}
.log-group{margin:16px 0}
.log-dom{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--shell-soft);margin-bottom:8px}
.log-opts{display:flex;flex-wrap:wrap;gap:8px}
.log-opts.col{flex-direction:column;flex-wrap:nowrap}
.log-opt{
  border:1.5px solid var(--shell-line);background:#fff;border-radius:10px;
  padding:9px 14px;font-family:var(--body);font-size:14.5px;color:var(--shell-ink);text-align:left;
  transition:border-color .1s ease,background .1s ease;
}
.log-opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.log-opt.wide{display:flex;flex-direction:column;gap:3px;padding:13px 16px;width:100%}
.log-opt.wide .lo-felt{font-size:15px;line-height:1.4}
.log-opt.wide .lo-name{font-size:12px;color:var(--shell-soft);font-weight:600}
.log-opt.wide:hover .lo-name{color:var(--brand)}
.log-opt.alt{border-style:dashed}
.log-opt.alt:hover{border-color:var(--spot-dark);background:var(--spot-soft)}

/* ============================================================
   LANDING PAGE
   The one place in the app that argues rather than drills, so it gets
   larger type and more room. The exam screens stay untouched.
   ============================================================ */
.landing{max-width:1000px}
.lead-mark{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em;padding:34px 0 0}
.lead-mark span{color:var(--brand)}
.lead{padding:44px 0 30px;max-width:44ch}
.lead h1{
  font-family:var(--display);font-size:clamp(34px,5.2vw,54px);font-weight:800;
  letter-spacing:-.035em;line-height:1.04;text-wrap:balance;
}
.lead h1 span{color:var(--brand)}
.lead-sub{font-size:17.5px;line-height:1.6;color:var(--shell-soft);margin-top:20px;max-width:60ch}

/* the live question */
.demo{
  background:#fff;border:1px solid var(--shell-line);border-radius:var(--r-lg);
  padding:26px 28px;margin:8px 0 30px;
}
.demo-tag{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brand);margin-bottom:12px;
}
.demo-q{font-size:17px;line-height:1.5;font-weight:600;margin-bottom:18px}
.demo-choices{display:flex;flex-direction:column;gap:9px;max-width:520px}
.demo-choice{
  display:flex;gap:12px;align-items:center;text-align:left;
  border:2px solid var(--shell-line);background:#fff;border-radius:10px;
  padding:11px 14px;font-family:var(--body);font-size:16px;color:var(--shell-ink);
}
.demo-choice:hover{border-color:var(--brand);background:var(--brand-soft)}
.demo-choice .ltr{

          body:'<p>Copy the claim into your head in its own words first. Then require the choice to support <em>that</em> claim.</p><ol><li>Underline the task word: <strong>support</strong> or <strong>weaken</strong>. At least one choice always does the opposite.</li><li>List the assumptions the claim needs. Support props one up; weakening knocks one out.</li><li>When two causes are tangled together, the right evidence separates them by varying one and holding the other fixed.</li></ol>' },
        { name:'Quantitative evidence: compute, do not eyeball',
          body:'<ol><li>Read the axis labels and units first, "in thousands" and "percent of" change everything.</li><li>Claims about a <em>relationship</em> need two data points, and you have to check they move the way the claim says. A relationship can be positive or negative; a single number can never establish either.</li><li>Claims with <strong>most, largest, steepest</strong> require arithmetic on every group before you can choose. Ties are a common trap.</li><li>Check that the choice states data <em>and</em> connects it to the claim. Accurate but irrelevant is the most common wrong answer.</li></ol>' },
        { name:'Inference: one small step, never a leap',
          body:'<ol><li>The answer must follow from the text alone, no outside knowledge, however true.</li><li>Prefer the modest claim. "Suggests X plays a role" beats "proves X is the only cause."</li><li>Ask what each sentence is doing there. In these texts, almost every detail exists to rule out one of the choices.</li><li>Blanks preceded by "therefore" or "suggests that" want the conclusion, not a restatement.</li></ol>' }
      ]
    },
    {
      title:'Reading and Writing: Craft and Structure',
      items:[
        { name:'Words in context: write your own word first',
          body:'<p>Cover the choices. Put your own plain word in the blank or over the underlined word, then match.</p><ol><li>The everyday meaning of a familiar word is usually the trap. The text decides the meaning, not the dictionary.</li><li>Look for a colon, a dash, or a "that is." The text often defines the word for you.</li><li>Use contrast clues: if the sentence says the old view was "fixed," the new one means the opposite of fixed.</li><li>Substitute your choice back into the sentence and read the whole thing. Wrong answers usually break the sentence in a way you can hear.</li></ol>' },
        { name:'Text structure and purpose: answer with a verb',
          body:'<ol><li>Purpose questions ask what the author is <em>doing</em>: describing, correcting, illustrating, conceding, redirecting.</li><li>For "function of the underlined sentence," read the sentence before and after. The function is the bridge between them.</li><li>The first word of the <em>next</em> sentence tells you a great deal. "Yet" or "But" means the underlined sentence was set up to be challenged, or reinterpreted.</li><li>For overall structure, map each sentence in three words, then count the moves. A choice with the wrong number of moves is wrong even if it sounds true.</li></ol>' },
        { name:'Cross-text connections: find the concession',
          body:'<ol><li>Before reading the choices, finish this sentence: "Author 2 thinks author 1 is wrong about ___."</li><li>Note what author 2 explicitly <em>accepts</em>. Any choice attacking that is out immediately.</li><li>Watch for choices that overstate the disagreement ("entirely imaginary," "never mattered"). Scholarly disagreement is usually narrow.</li><li>Hard versions require capturing two objections at once. A choice that captures only one is incomplete.</li></ol>' }
      ]
    },
    {
      title:'Reading and Writing: Expression of Ideas',
      items:[
        { name:'Transitions: name the relationship before you read the choices',
          body:'<p>Cover the choices and decide which of six relationships holds.</p><ol><li><strong>Same direction:</strong> also, moreover, indeed, in addition, similarly.</li><li><strong>Opposite:</strong> however, nevertheless, still, on the other hand, by contrast.</li><li><strong>Concession:</strong> granted, admittedly, to be sure, that said. You give ground, then push back.</li><li><strong>Cause or result:</strong> therefore, consequently, as a result, for this reason.</li><li><strong>Example:</strong> for instance, for example, in particular.</li><li><strong>Restatement:</strong> in other words, that is, put differently.</li></ol><p><strong>The hard distinction</strong> is example against restatement. An example is one case of the claim; a restatement is the same claim in new words. If the second sentence adds a limitation rather than repeating, you want a concession word instead.</p><p><strong>Sequence words</strong> (meanwhile, subsequently, previously, eventually) are a seventh case worth knowing, but check the logic first: a sequence word placed where the logic is a reversal is a standard trap.</p>' },
        { name:'Rhetorical synthesis: the goal is the whole question',
          body:'<p>All the notes are true, so accuracy cannot separate the choices. Only the stated goal can.</p><ol><li>Underline the goal and split it into requirements. "Emphasize a difference" needs both sides plus a contrast word. "Explain why" needs a cause, not a restatement.</li><li>Count the parts. If the goal has two parts joined by "and," a choice satisfying one is wrong.</li><li>"Generalize about all X" requires a claim true of <em>every</em> case. Missing evidence for one case is not evidence.</li><li>Suspect any choice that adds a motive, a cause, or a judgment the notes never state.</li></ol>' }
      ]
    },
    {
      title:'Reading and Writing: Standard English Conventions',
      items:[
        { name:'Boundaries: test each side for a complete sentence',
          body:'<p>Cover the blank and ask whether each side could stand alone.</p><ol><li>Complete + complete: period, semicolon, or comma + and/but/or/so/for/nor/yet. <em>A comma alone is a comma splice.</em></li><li>Complete + list or explanation: colon. Everything before the colon must be a full sentence.</li><li>Punctuation is paired: a dash has to be closed by a dash, and a comma by a comma. Never open with one and close with the other.</li><li>Never split a subject from its verb with a single comma, however long the subject is.</li><li>If list items already contain commas, separate the items with semicolons.</li></ol>' },
        { name:'Form, structure, and sense: the checklist',
          body:'<ol><li><strong>First move, always:</strong> read the four choices down the column and find the one thing they change. That names the rule being tested, so you never have to guess it.</li><li><strong>Agreement:</strong> cross out every "of" phrase and modifier, then match the verb to the bare subject. Collective nouns (colony, team, committee) are singular. Do not strip anything on a modifier question, though, because there the opening phrase is the evidence.</li><li><strong>Inverted sentences:</strong> when the sentence starts with a prepositional phrase, flip it around to find the real subject.</li><li><strong>Tense:</strong> let the time markers decide. The earlier of two past events takes "had" + participle.</li><li><strong>Apostrophes:</strong> ask how many owners, then whether they own anything. Plural owners take the apostrophe after the -s.</li><li><strong>Modifiers:</strong> an opening phrase describes the subject right after the comma. Name that subject and check that it can perform the action.</li><li><strong>Parallelism:</strong> "not only \u2026 but also," "either \u2026 or," and lists require matching grammatical forms.</li><li><strong>Comparisons:</strong> compare like with like, winters with winters, not winters with records.</li><li><strong>Pronouns:</strong> send every pronoun back to the one noun it replaces and check the number matches. If two nouns could be the antecedent, the pronoun is the error. Its, their, and whose never take an apostrophe.</li><li><strong>Subjunctive:</strong> recommend/require/insist/demand + that \u2192 use the base form ("that the bridge <em>be</em> closed").</li></ol>' }
      ]
    },
    {
      title:'Math: universal moves',
      items:[
        { name:'Before you compute',
          body:'<ol><li>Read the last line first. Many mistakes are correct algebra answering the wrong question, x when it asked for x + y.</li><li>Circle exactly what is asked and write the unit next to it.</li><li>Check whether the answer choices let you back-solve or plug in. Testing choices is a real method, not a shortcut.</li><li>On "which expression is equivalent," pick a number like x = 2, evaluate the original and each choice, and keep whichever matches.</li></ol>' },
        { name:'Words into equations',
          body:'<ol><li>Define your variables in writing before setting anything up.</li><li>Two unknowns need two equations, usually one counting things and one counting money, weight, or time.</li><li>"At most" \u2192 \u2264. "At least" \u2192 \u2265. "No more than" \u2192 \u2264.</li><li>Convert units before substituting into a model. If t is in years and the question says 18 months, use 1.5.</li></ol>' },
        { name:'Quadratics and functions',
          body:'<ol><li>Vertex is at x = \u2212b/(2a); substitute back if the question wants the maximum or minimum <em>value</em>.</li><li>Discriminant b\u00b2 \u2212 4ac: positive \u2192 two real solutions, zero \u2192 exactly one, negative \u2192 none.</li><li>Sum of roots = \u2212b/a, product = c/a. Often you never need the roots themselves.</li><li>Always check radical and rational equations in the original, squaring creates extraneous roots.</li><li>Factor out common coefficients (like \u221216 in projectile problems) before factoring.</li></ol>' },
        { name:'Data, rates, and percentages',
          body:'<ol><li>Percent change = change \u00f7 <em>original</em>. Successive percent changes multiply: +20% then \u221210% is \u00d71.20\u00d70.90 = \u00d71.08.</li><li>In a conditional probability, the phrase after "if" sets the denominator.</li><li>Mean uses every value and moves with outliers; median only cares about position.</li><li>Margin of error makes an interval: estimate \u00b1 margin. It never makes a value exact.</li><li>In dilutions and mixtures, the amount of solute stays constant while the total volume changes.</li></ol>' },
        { name:'Graph it before you solve it',
          body:'<p>Every math question on the real test has a Desmos graphing calculator built in. This is the highest-leverage habit on the current exam.</p><ol><li><strong>Equations:</strong> enter the left side and the right side as two functions and read the intersection. A radical or rational equation cannot hand you an extraneous root this way, because a false solution is simply not a crossing point.</li><li><strong>Systems:</strong> enter both equations and read the crossing point.</li><li><strong>Inequalities:</strong> type them with the inequality signs and the region shades itself. Then click each candidate point.</li><li><strong>Quadratics:</strong> read the vertex, the zeros, and the minimum straight off the curve instead of computing \u2212b/(2a).</li><li><strong>Equivalence:</strong> graph the original expression and a candidate on top of each other. If they overlap everywhere, they match.</li></ol><p><strong>When not to graph:</strong> if a question is one line of arithmetic, typing it in is slower. And the graph gives you a point, not an answer, so read the question again before you pick: it may want x, or y, or x + y.</p>' },
        { name:'How many solutions',
          body:'<p>Counting solutions is one idea in three disguises. In all three you compare the two sides instead of solving.</p><ol><li><strong>Linear:</strong> expand both sides. Identical means infinitely many solutions. Same variable terms with a different constant means none.</li><li><strong>Systems:</strong> compare the coefficient ratios. Proportional throughout means the same line and infinitely many; proportional in the variables but not the constants means parallel and none.</li><li><strong>Quadratic:</strong> the discriminant b\u00b2 \u2212 4ac. Positive gives two, zero gives one, negative gives none.</li></ol><p>The two cases differ only in the constant term, so once you find your value, substitute it back and confirm the count is the one you were asked for.</p>' },
        { name:'Geometry and trigonometry',
          body:'<ol><li>Find the radius first, nearly every circle question routes through it.</li><li>Open the reference sheet for areas, volumes, the Pythagorean theorem, and the special right triangles. It does not give you arc length, sector area, surface area, or the radian conversion, so carry those in yourself.</li><li>SOH-CAH-TOA is relative to the named angle. Sine and cosine are never greater than 1, use that to check.</li><li>Turn a given ratio into a labeled triangle, then use the Pythagorean theorem.</li><li>Scaling: doubling a length multiplies area by 4 and volume by 8. Substitute symbolically instead of guessing.</li><li>"Figure not drawn to scale" means do not trust the picture; trust the given measurements.</li></ol>' },
        { name:'Student-produced response (fill-in) rules',
          body:'<ol><li>Answers may be positive or negative, integers, decimals, or fractions. Mixed numbers are not allowed, enter 5/2, not 2 1/2.</li><li>The box holds 5 characters (6 if the answer is negative). If a decimal does not fit, fill the whole box, truncating or rounding at the last digit that fits. For 2/3 you may enter 2/3, .6666, or .6667; two digits such as .66 is scored wrong. When a fraction fits, entering the fraction is the safest option.</li><li>Do not enter symbols: no percent signs, no dollar signs, no commas in large numbers.</li><li>If a question has more than one correct answer, enter only one.</li></ol>' }
      ]
    }
  ],

  reference: [
    { label:'Circle', formula:'A = \u03c0r\u00b2<br>C = 2\u03c0r' },
    { label:'Rectangle', formula:'A = \u2113w' },
    { label:'Triangle', formula:'A = \u00bdbh' },
    { label:'Pythagorean theorem', formula:'c\u00b2 = a\u00b2 + b\u00b2' },
    { label:'Special right triangle', formula:'30\u00b0-60\u00b0-90\u00b0<br>x, x\u221a3, 2x' },
    { label:'Special right triangle', formula:'45\u00b0-45\u00b0-90\u00b0<br>s, s, s\u221a2' },
    { label:'Rectangular solid', formula:'V = \u2113wh' },
    { label:'Cylinder', formula:'V = \u03c0r\u00b2h' },
    { label:'Sphere', formula:'V = (4/3)\u03c0r\u00b3' },
    { label:'Cone', formula:'V = (1/3)\u03c0r\u00b2h' },
    { label:'Pyramid', formula:'V = (1/3)\u2113wh' },
    { label:'Arc / degrees', formula:'360\u00b0 in a circle<br>2\u03c0 radians in a circle' },
    { label:'Triangle angles', formula:'Interior angles sum to 180\u00b0' }
  ],
  /* NOT on the provided sheet. These you carry in yourself. */
  memorize: [
    { label:'Slope', formula:'m = (y\u2082 \u2212 y\u2081)/(x\u2082 \u2212 x\u2081)' },
    { label:'Quadratic formula', formula:'x = [\u2212b \u00b1 \u221a(b\u00b2 \u2212 4ac)] / 2a' },
    { label:'Discriminant', formula:'b\u00b2 \u2212 4ac<br>+ two roots, 0 one, \u2212 none' },
    { label:'Vertex', formula:'x = \u2212b/(2a)' },
    { label:'Distance', formula:'d = \u221a[(x\u2082\u2212x\u2081)\u00b2 + (y\u2082\u2212y\u2081)\u00b2]' },
    { label:'Midpoint', formula:'((x\u2081+x\u2082)/2, (y\u2081+y\u2082)/2)' },
    { label:'Arc length', formula:'(\u03b8/360) \u00d7 2\u03c0r' },
    { label:'Sector area', formula:'(\u03b8/360) \u00d7 \u03c0r\u00b2' },
    { label:'Radians', formula:'degrees \u00d7 \u03c0/180' },
    { label:'Perpendicular slopes', formula:'m\u2081 \u00d7 m\u2082 = \u22121' },
    { label:'Percent change', formula:'change \u00f7 original' },
    { label:'Exponential growth', formula:'y = a(1 + r)^t' }
  ]
