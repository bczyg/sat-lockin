# Render setup for SAT LockIn: one web service and one Postgres database, in
# the "SAT LockIn" project (production environment). It follows the same
# practices as the other AICounting projects on Render (Syftr, Fulkrum).
#
# Nothing secret belongs in this file. Every value below is either harmless or
# marked `sync: false`, which makes Render ask for it in the dashboard and keeps
# it out of git. The repository is public, so this matters.
#
# No long-lived key for the AI. Anthropic is reached by workload identity
# federation (OIDC): Render hands the service a short-lived token and rotates
# it, and the server trades it for a short-lived Anthropic token. See
# SETUP-CLOUD.md, Part 3. Never add ANTHROPIC_API_KEY to this service.

services:
  - type: web
    name: sat-lockin
    runtime: node
    region: virginia
    plan: starter
    branch: main
    # Deploy only after the GitHub checks (tests) pass on the commit.
    autoDeployTrigger: checksPass
    # Rate limits and sign-in code throttling live in process memory, so one
    # instance. A second would keep its own counts.
    numInstances: 1
    # No preview deploys: a preview would be a second public copy of the app.
    previews:
      generation: off
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # Fails the deploy if the app can't reach its database (503), rather than
    # cutting traffic over to an instance that can't serve accounts.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"

      # The internal connection string: stays on Render's private network.
      - key: DATABASE_URL
        fromDatabase:
          name: sat-lockin-db
          property: connectionString

      # Anthropic workload identity federation. Render provides the identity
      # token file itself; do not set ANTHROPIC_IDENTITY_TOKEN_FILE.
      - key: ANTHROPIC_FEDERATION_RULE_ID
        sync: false
      - key: ANTHROPIC_ORGANIZATION_ID
        sync: false
      - key: ANTHROPIC_SERVICE_ACCOUNT_ID
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false

      # Payments (Stripe). The webhook signing secret verifies that a payment
      # event really came from Stripe.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COMP_EMAILS
        sync: false

      # The Desmos graphing calculator on math questions. Desmos issues the
      # key; it is visible to browsers once loaded, but stays out of git so
      # the trial key can be swapped for the paid one in the dashboard.
      - key: DESMOS_API_KEY
        sync: false

      # Sign-in emails by Microsoft Graph: see SETUP-CLOUD.md, Part 2.3.
      # The client secret expires (Microsoft's rule). Record its expiry date in
      # GRAPH_SECRET_EXPIRES (YYYY-MM-DD) so the server warns 30 days ahead.
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_SENDER
        sync: false
      - key: GRAPH_SECRET_EXPIRES
        sync: false

databases:
  - name: sat-lockin-db
    region: virginia
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: lockin
    user: lockin
    # No outside connections at all: only services in this workspace can
    # reach the database, over Render's private network.
    ipAllowList: []
