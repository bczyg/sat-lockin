<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SAT LockIn admin</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .admin{max-width:1100px;margin:0 auto;padding:var(--s5) max(16px, env(safe-area-inset-right, 0px)) var(--s8) max(16px, env(safe-area-inset-left, 0px))}
  .admin h1{font-size:var(--fs-xl, 28px);margin-bottom:var(--s1)}
  .admin h2{font-size:20px;margin:var(--s7) 0 var(--s2)}
  .admin .sub{color:var(--ink-3);max-width:70ch}
  .tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
  .tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
  .tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl td.q{min-width:280px;color:var(--ink)}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
  .tag.pool{background:var(--brand-soft);color:var(--brand-ink)}
  .tag.off{background:var(--surface-3);color:var(--ink)}
  .empty{padding:var(--s4);color:var(--ink-3)}
  .msg{margin-top:var(--s5);padding:var(--s4);border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
  .rules{font-size:14px;color:var(--ink-3);margin-top:var(--s2)}
</style>
</head>
<body>
<main class="admin">
  <h1>Question feedback</h1>
  <p class="sub">What students say about questions and moves, and what the question writer produced. Totals only: nothing here says who voted.</p>
  <div id="out"><p class="msg">Loading…</p></div>
</main>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
