<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The wordmark's mark (.wordmark::before in styles.css): the brand
       gradient with a target ring and a center dot. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2bcf"/>
      <stop offset="1" stop-color="#7b4cf0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="4" width="60" height="58" rx="18" fill="#3424b0"/>
  <rect x="2" y="2" width="60" height="57" rx="18" fill="url(#g)"/>
  <circle cx="32" cy="30.5" r="17" fill="none" stroke="#fff" stroke-width="5.5"/>
  <circle cx="32" cy="30.5" r="7" fill="#fff"/>
</svg>
