# Runs on every push and pull request. Catches a malformed question or a
# style regression before it reaches a student mid-test.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify question bank and house style
        run: node scripts/verify.js

      - name: Check the question writer's structural checks
        run: node scripts/writer-test.mjs

      - name: Confirm the committed bundle matches the sources
        run: |
          cp dist/sat-lockin.html /tmp/committed.html
          python3 build-single-file.py
          if ! cmp -s /tmp/committed.html dist/sat-lockin.html; then
            echo "::error::dist/sat-lockin.html is out of date. Run 'npm run bundle' and commit the result."
            exit 1
          fi
          echo "the committed bundle matches the sources"

      - name: Confirm the server starts and answers
        run: |
          node server.js &
          SERVER=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/healthz > /tmp/health.json; then break; fi
            sleep 0.5
          done
          echo "health: $(cat /tmp/health.json)"
          curl -sf -o /dev/null http://127.0.0.1:8080/ || (echo "the app did not serve"; kill $SERVER; exit 1)
          # server-side files must never be reachable over HTTP
          for p in /server.js /.env /lib/db.js /db/schema.sql /js/../lib/auth.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://127.0.0.1:8080$p")
            echo "  $p -> $code"
            if [ "$code" != "404" ]; then echo "SECURITY: $p is reachable"; kill $SERVER; exit 1; fi
          done
          kill $SERVER
        env:
          PORT: 8080

  # Drives the API against a real, throwaway Postgres: sign-in limits and
  # races, one account never touching another's rows, naming sync, signed
  # payment webhooks, the coach and the question pool, and CORS. Then checks
  # that the server signs in to Anthropic by OIDC and never with a stored key.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lockin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Integration test
        run: node scripts/integration-test.mjs
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/lockin_test

      - name: Anthropic sign-in by workload identity federation
        run: node scripts/oidc-test.mjs
