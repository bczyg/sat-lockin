# Applies db/schema.sql to Railway Postgres.
#
# The server already applies the schema on boot, so this workflow is not
# required. It exists for when you would rather migrations were an explicit,
# logged step you can see and re-run, instead of something that happens
# invisibly at startup.
#
# One setup step, and one detail that catches everyone:
#
#   Railway gives Postgres two connection strings. DATABASE_URL points at
#   postgres.railway.internal, which only resolves inside Railway's private
#   network, so GitHub cannot reach it. You need DATABASE_PUBLIC_URL, the
#   TCP proxy address.
#
#   In Railway: Postgres service -> Variables -> copy DATABASE_PUBLIC_URL
#   In GitHub:  Settings -> Secrets and variables -> Actions -> New secret
#               Name: DATABASE_PUBLIC_URL
#
# The schema is written to be safe to run repeatedly: every statement is
# create table if not exists, create index if not exists, or create extension
# if not exists. Re-running it changes nothing.
name: schema

on:
  push:
    branches: [main]
    paths:
      - 'db/schema.sql'
      - '.github/workflows/schema.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is present
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "::error::DATABASE_PUBLIC_URL is not set. Copy it from the Railway Postgres service"
            echo "::error::(Variables tab) into GitHub Settings -> Secrets and variables -> Actions."
            echo "::error::Use DATABASE_PUBLIC_URL, not DATABASE_URL: the internal host is not"
            echo "::error::reachable from GitHub."
            exit 1
          fi

      - name: Install the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply the schema
        env:
          PGCONN: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          psql "$PGCONN" -v ON_ERROR_STOP=1 -f db/schema.sql
          echo "schema applied"

      - name: Report the tables
        env:
          PGCONN: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          {
            echo "### Schema applied"
            echo ""
            echo "| table | columns | rows |"
            echo "|---|---|---|"
            psql "$PGCONN" -At -F '|' -c "
              select '| ' || c.relname
                     || ' | ' || (select count(*) from information_schema.columns
                                   where table_schema='public' and table_name=c.relname)
                     || ' | ' || coalesce(s.n_live_tup, 0) || ' |'
                from pg_class c
                left join pg_stat_user_tables s on s.relname = c.relname
               where c.relkind='r'
                 and c.relnamespace = 'public'::regnamespace
               order by c.relname;"
          } >> "$GITHUB_STEP_SUMMARY"
